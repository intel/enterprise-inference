apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aigw-{{MODEL_NAME}}
  namespace: {{NAMESPACE}}
  labels:
    app.kubernetes.io/name: {{MODEL_NAME}}
    enterprise-inference/owner: model-manager
    app.kubernetes.io/managed-by: model-manager
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{AI_GATEWAY_NAME}}
      namespace: {{AI_GATEWAY_NAMESPACE}}
      sectionName: http
  rules:
    - matches:
        - headers:
            - name: X-Gateway-Base-Model-Name
              type: Exact
              value: {{MODEL_NAME}}
      timeouts:
        request: {{ROUTE_TIMEOUT}}
      backendRefs:
        - group: inference.networking.k8s.io
          kind: InferencePool
          name: {{POOL_NAME}}
