apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: direct-{{MODEL_NAME}}
  namespace: {{NAMESPACE}}
  labels:
    app.kubernetes.io/name: {{MODEL_NAME}}
    enterprise-inference/owner: model-manager
    app.kubernetes.io/managed-by: model-manager
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{AI_GATEWAY_NAME}}
      namespace: {{AI_GATEWAY_NAMESPACE}}
      sectionName: http
  # Embeddings ride the OpenAI /v1/embeddings path. The gateway's ext-proc only
  # understands the completions schema, so it 400s an embeddings body before it
  # can inject x-ai-eg-model. We bypass that: match the embeddings path directly
  # and inject the header server-side (RequestHeaderModifier), so no client header
  # is required. The header match on / lets LiteLLM / explicit callers disambiguate
  # when several embed models share the path.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/embeddings
        - headers:
            - name: x-ai-eg-model
              type: Exact
              value: {{MODEL_NAME}}
          path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-ai-eg-model
                value: {{MODEL_NAME}}
      timeouts:
        request: {{ROUTE_TIMEOUT}}
      backendRefs:
        - kind: Service
          name: {{SERVICE_NAME}}
          port: {{SERVICE_PORT}}
