apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: {{MODEL_NAME}}
  namespace: {{NAMESPACE}}
  labels:
    app.kubernetes.io/name: {{MODEL_NAME}}
    app.kubernetes.io/managed-by: model-manager{{EXTRA_LABELS}}
spec:
{{NRI_ANNOTATIONS}}  model:
    uri: {{MODEL_URI}}
  replicas: {{REPLICAS}}
  router:
    gateway:
      refs:
        - name: {{GATEWAY_NAME}}
          namespace: {{GATEWAY_NAMESPACE}}
    route: {}
    scheduler: {}
  template:
    containers:
      - name: main
        image: {{IMAGE}}
        args: {{ARGS}}
        env: {{ENV}}
{{CHAT_TEMPLATE_MOUNT}}        resources:
          requests:
            cpu: "{{CPU}}"
            memory: {{MEMORY}}
          limits:
            cpu: "{{CPU}}"
            memory: {{MEMORY}}
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 120
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 12
          periodSeconds: 10
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 5
          periodSeconds: 10
          timeoutSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
    securityContext:
      seccompProfile:
        type: RuntimeDefault
{{CHAT_TEMPLATE_VOLUME}}{{AFFINITY}}
