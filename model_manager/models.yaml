# =============================================================================
# Runtimes — per-engine deploy config (images, versions, env, categories)
# =============================================================================
# Per-engine deploy config, so the full picture of what a server runs with is in
# one place. Low-level plumbing (device, kind, routing, CR manifest pointer)
# lives in runtimes/<name>/values.yaml and is merged in at load.
#
# Effective config a pod receives (each layer overrides the one before it):
#   env   = common env   + category env  + version env delta   + per-model env  + --env
#   args  = category args + version args delta  + per-model args  + --arg
#   image = the selected version's image
#
# Version selected by:  --server-version  >  model server_version:  >  default_version

runtimes:

  # ── vLLM (CPU) ──────────────────────────────────────────────────────────────
  # env is shared across all versions/categories; args live per-category below.
  vllm:
    default_version: "0.24.0"       # used when a model/CLI doesn't pick a version

    # Common env — applied to every vLLM pod. VLLM_CPU_KVCACHE_SPACE is NOT here:
    # it is set per-category below (via ${KV_CACHE_GB} ← category kv_cache_gb) so
    # each workload class sizes its own KV cache.
    env:
      USER: "vllm"
      VLLM_CPU_NUM_OF_RESERVED_CPU: "1"
      VLLM_CPU_SGL_KERNEL: "1"
      VLLM_NO_USAGE_STATS: "1"
      KMP_BLOCKTIME: "1"

    # Server versions. Add a key, validate, then promote via default_version.
    # Optional per-version env:/args: DELTAS layer on top of the common env
    # above and the per-category args below.
    versions:
      "0.24.0":
        image: "docker.io/vllm/vllm-openai-cpu:v0.24.0"
      # Only models that pin this version use it (e.g. qwen3-6-35b-a3b);
      # default_version and every other model are unchanged.
      "0.28.0":
        image: "docker.io/vllm/vllm-openai-cpu:v0.28.0"
      # Reference entry — copy, change key + image, tweak deltas. Deltas must suit
      # the model: MoE-only flags (e.g. --enable-expert-parallel) crash dense models.
      "0.19.1":
        image: "docker.io/vllm/vllm-openai-cpu:v0.19.1"
        env: { VLLM_USE_V1: "1", VLLM_CPU_KVCACHE_SPACE: "12" }
        args: [ --max-num-seqs, "256" ]

    # Per-category engine args + env + resource defaults (a model's own values
    # override). VLLM_CPU_KVCACHE_SPACE is set here (not in the shared env above)
    # so each workload class sizes its CPU KV cache appropriately —
    # ${KV_CACHE_GB} is filled from this category's kv_cache_gb default.
    categories:
      llm:
        args: [ --dtype, bfloat16, --max-num-seqs, "128", --max-num-batched-tokens, "2048", --enable-prefix-caching, --enable-chunked-prefill ]
        env: { VLLM_CPU_KVCACHE_SPACE: "${KV_CACHE_GB}" }
        defaults: { cpu: 8, memory: "16Gi", kv_cache_gb: 8 }
      # embed/rerank do no autoregressive generation, but vLLM CPU still sizes a
      # KV cache at startup: without VLLM_CPU_KVCACHE_SPACE it requires most of
      # the NUMA node's memory to be free and crashes when an LLM already runs on
      # that node. So they set one too, from kv_cache_gb.
      embed:
        args: [ --dtype, bfloat16, --gpu-memory-utilization, "0.7" ]
        env: { VLLM_CPU_KVCACHE_SPACE: "${KV_CACHE_GB}" }
        defaults: { cpu: 6, memory: "16Gi", kv_cache_gb: 16 }
      rerank:
        args: [ --dtype, bfloat16, --gpu-memory-utilization, "0.7" ]
        env: { VLLM_CPU_KVCACHE_SPACE: "${KV_CACHE_GB}" }
        defaults: { cpu: 6, memory: "16Gi", kv_cache_gb: 16 }
      vlm:
        args: [ --dtype, bfloat16, --max-num-seqs, "64", --max-num-batched-tokens, "1024" ]
        env: { VLLM_CPU_KVCACHE_SPACE: "${KV_CACHE_GB}" }
        defaults: { cpu: 16, memory: "48Gi", kv_cache_gb: 8 }

  # ── vLLM (NVIDIA GPU / CUDA) ────────────────────────────────────────────────
  # GPU counterpart of `vllm`. Plumbing (device: gpu, accelerator resource,
  # toleration, shm) is in runtimes/vllm-cuda/values.yaml. A model opts in with
  # `runtime: vllm-cuda` (+ optional `gpus: N`; default from its category).
  #
  # Deploys are GATED: model-manager refuses a device: gpu runtime unless
  # MM_ACCEL_RESOURCE is set. In ai-solutions that happens automatically when
  # rack_scale_enabled=true and the rack-profile declares an accelerator; on a
  # standard (CPU) install the gate stays closed and nothing here is reachable.
  # --dry-run previews are not gated.
  vllm-cuda:
    default_version: "0.28.0"

    # Common env. The cache redirects let the upstream vllm-openai image run
    # under the hardened pod securityContext (runAsNonRoot, drop ALL): its
    # defaults write under /root, which is not writable there.
    env:
      USER: "vllm"
      HOME: "/tmp"
      XDG_CACHE_HOME: "/tmp/.cache"
      TRITON_CACHE_DIR: "/tmp/.triton"
      TORCHINDUCTOR_CACHE_DIR: "/tmp/torchinductor_cache"
      FLASHINFER_WORKSPACE_BASE: "/tmp"
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      VLLM_NO_USAGE_STATS: "1"

    versions:
      "0.28.0":
        image: "docker.io/vllm/vllm-openai:v0.28.0"

    # Per-category args + resource defaults. `gpus` is the per-pod GPU count and
    # the default --tensor-parallel-size. cpu/memory are host-side (weight
    # loading, tokenizer, API server), not the accelerator.
    categories:
      llm:
        args: [ --dtype, bfloat16, --max-num-seqs, "256", --enable-prefix-caching ]
        defaults: { cpu: 8, memory: "64Gi", gpus: 1 }
      vlm:
        args: [ --dtype, bfloat16, --max-num-seqs, "64" ]
        defaults: { cpu: 8, memory: "64Gi", gpus: 1 }
      embed:
        args: [ --dtype, bfloat16 ]
        defaults: { cpu: 4, memory: "16Gi", gpus: 1 }
      rerank:
        args: [ --dtype, bfloat16 ]
        defaults: { cpu: 4, memory: "16Gi", gpus: 1 }

  # ── OpenVINO Model Server ─────────────────────────────────────────────────────
  # Flat runtime (no version axis). image + plumbing live in
  # runtimes/openvino/values.yaml.
  #
  # weight_format is a CONVERSION knob for `ovms --pull`: set it (e.g. int8, int4,
  # fp16) ONLY when the model_id is a raw-HF repo that must be converted+quantized
  # to OpenVINO IR. Leave it unset for models already published as OpenVINO IR
  # (the OpenVINO/* repos below) — passing --weight-format to an already-converted
  # model makes ovms --pull abort with "unsupported for OpenVINO models".
  openvino:
    env: {}
    categories:
      llm:
        defaults: { cpu: 8, memory: "16Gi" }
      embed:
        defaults: { cpu: 6, memory: "12Gi" }
      rerank:
        defaults: { cpu: 6, memory: "12Gi" }
