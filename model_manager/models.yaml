# Model catalog: what model-manager can deploy, and the engines that serve it.
# Fields, server binding, cpu: auto, chat templates: docs/customize/catalog.md
# Runtimes, categories, KV cache, how settings combine: docs/customize/runtimes.md
# Usage: ./model-manager deploy <name> --wait | undeploy <name> | list

defaults:
  namespace: llm-inference
  runtime: iims
  replicas: 1
  require_amx: true

storage:
  pvc_name: model-store

network:
  http_proxy: ""                  # empty: inherit from the environment
  https_proxy: ""
  no_proxy: ""
  connectivity_check: https://huggingface.co

models:

  # ── LLMs ───────────────────────────────────────────────────────────────────
  - name: qwen3-0-6b
    model_id: Qwen/Qwen3-0.6B
    category: llm
    cpu: 8
    memory: 24Gi

  - name: qwen3-1-7b
    model_id: Qwen/Qwen3-1.7B
    category: llm
    cpu: auto
    memory: 64Gi
    args: [ --enable-auto-tool-choice, --tool-call-parser, hermes ]

  - name: qwen3-4b
    model_id: Qwen/Qwen3-4B-Instruct-2507
    category: llm
    cpu: auto
    memory: 64Gi
    args: [ --enable-auto-tool-choice, --tool-call-parser, hermes ]

  - name: qwen3-30b-a3b
    model_id: Qwen/Qwen3-30B-A3B-Instruct-2507
    category: llm
    cpu: auto
    memory: 160Gi
    chat_template_file: tool_chat_template_qwen3coder.jinja
    args: [ --enable-auto-tool-choice, --tool-call-parser, qwen3_xml ]

  - name: qwen3-6-35b-a3b
    model_id: Qwen/Qwen3.6-35B-A3B
    category: llm
    cpu: auto
    memory: 128Gi
    # Linear attention on CPU rejects prefix caching and chunked prefill; vision tower off (AMX kernel crash).
    args: [ --enable-auto-tool-choice, --tool-call-parser, qwen3_xml, --no-enable-prefix-caching,
            --no-enable-chunked-prefill, --max-model-len, "32768", --max-num-batched-tokens, "32768",
            --limit-mm-per-prompt.image, "0", --limit-mm-per-prompt.video, "0" ]

  - name: qwen2-5-coder-7b
    model_id: Qwen/Qwen2.5-Coder-7B-Instruct
    category: llm
    cpu: auto
    memory: 64Gi
    chat_template_file: tool_chat_template_qwen3coder.jinja
    args: [ --enable-auto-tool-choice, --tool-call-parser, qwen3_coder ]

  - name: qwen2-5-coder-14b
    model_id: Qwen/Qwen2.5-Coder-14B-Instruct
    category: llm
    cpu: auto
    memory: 96Gi
    chat_template_file: tool_chat_template_qwen3coder.jinja
    args: [ --enable-auto-tool-choice, --tool-call-parser, qwen3_xml ]

  - name: qwen3-coder-30b
    model_id: Qwen/Qwen3-Coder-30B-A3B-Instruct
    category: llm
    cpu: auto
    memory: 160Gi
    chat_template_file: tool_chat_template_qwen3coder.jinja
    args: [ --enable-auto-tool-choice, --tool-call-parser, qwen3_xml ]

  - name: qwen3-5-2b-ovms
    model_id: OpenVINO/Qwen3.5-2B-int4-ov
    category: llm
    runtime: openvino
    cpu: 8
    memory: 16Gi

  - name: llama3-8b-awq
    model_id: casperhansen/llama-3-8b-instruct-awq
    category: llm
    cpu: 16
    memory: 32Gi

  - name: deepseek-r1-qwen-32b
    model_id: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
    category: llm
    cpu: auto
    memory: 128Gi

  - name: nemotron-nano-4b
    model_id: nvidia/Llama-3.1-Nemotron-Nano-4B-v1.1
    category: llm
    cpu: auto
    memory: 48Gi
    args: [ --enable-auto-tool-choice, --tool-call-parser, llama3_json ]

  - name: gemma-4-26b
    model_id: google/gemma-4-26B-A4B-it
    category: llm
    cpu: auto
    memory: 128Gi
    chat_template_file: tool_chat_template_gemma4.jinja
    args: [ --enable-auto-tool-choice, --tool-call-parser, gemma4 ]
    env: { VLLM_CPU_SGL_KERNEL: "0" }  # its vision tower feeds the AMX SGL kernel a 3D tensor (vllm runtime sets 1)

  - name: whisper-small                # speech-to-text (/v1/audio/transcriptions)
    model_id: openai/whisper-small
    category: llm
    cpu: auto
    memory: 24Gi
    # Encoder-decoder: prefix caching kills the engine on the first request (no cross-attention caching).
    args: [ --dtype, float32, --enforce-eager, --no-enable-prefix-caching ]
    env: { TORCHDYNAMO_DISABLE: "1" }

  # Backs the LiteLLM guardrail, which is fail-closed: an OOM here blocks every request.
  - name: qwen3guard
    model_id: Qwen/Qwen3Guard-Gen-0.6B
    category: llm
    cpu: 8
    memory: 24Gi

  # Speculative decoding: the draft is fetched to /mnt/models/draft; enable it with --speculative-config args.
  - name: llama-3-1-8b-specdec
    model_id: meta-llama/Llama-3.1-8B-Instruct
    draft_model_id: meta-llama/Llama-3.2-1B-Instruct
    category: llm
    cpu: auto
    memory: 64Gi
    args: [ --enable-auto-tool-choice, --tool-call-parser, llama3_json ]

  - name: qwen3-coder-30b-specdec
    model_id: Qwen/Qwen3-Coder-30B-A3B-Instruct
    draft_model_id: Qwen/Qwen3-0.6B
    category: llm
    cpu: auto
    memory: 160Gi
    chat_template_file: tool_chat_template_qwen3coder.jinja
    args: [ --enable-auto-tool-choice, --tool-call-parser, qwen3_xml ]

  # Needs vllm-project/vllm#42775: the draft's vocab (151936) differs from the base (152064).
  - name: qwen2-5-coder-14b-specdec
    model_id: Qwen/Qwen2.5-Coder-14B-Instruct
    draft_model_id: Qwen/Qwen2.5-Coder-0.5B-Instruct
    category: llm
    cpu: auto
    memory: 96Gi
    chat_template_file: tool_chat_template_qwen3coder.jinja
    args: [ --enable-auto-tool-choice, --tool-call-parser, qwen3_xml ]

  # Intel Inference Microservices catalog: per-model images. Llama repos are gated (HF_TOKEN).
  - name: iim-qwen3-4b
    model_id: Qwen/Qwen3-4B
    category: llm
    image: docker.io/intel/inference-xeon-qwen-qwen3-4b:0.1.0
    cpu: auto
    memory: 32Gi
    args: [ --enable-auto-tool-choice, --tool-call-parser, hermes ]

  - name: iim-qwen3-8b
    model_id: Qwen/Qwen3-8B
    category: llm
    image: docker.io/intel/inference-xeon-qwen-qwen3-8b:0.1.0
    cpu: auto
    memory: 48Gi
    args: [ --enable-auto-tool-choice, --tool-call-parser, hermes ]

  - name: iim-qwen3-30b-a3b
    model_id: Qwen/Qwen3-30B-A3B
    category: llm
    image: docker.io/intel/inference-xeon-qwen-qwen3-30b-a3b:0.1.0
    cpu: auto
    memory: 96Gi
    args: [ --enable-auto-tool-choice, --tool-call-parser, hermes ]

  - name: llama-3-1-8b
    model_id: meta-llama/Llama-3.1-8B-Instruct
    category: llm
    image: docker.io/intel/inference-xeon-meta-llama-llama-3.1-8b-instruct:0.1.0
    cpu: auto
    memory: 40Gi
    args: [ --enable-auto-tool-choice, --tool-call-parser, llama3_json ]

  - name: llama-3-2-3b
    model_id: meta-llama/Llama-3.2-3B-Instruct
    category: llm
    image: docker.io/intel/inference-xeon-meta-llama-llama-3.2-3b-instruct:0.1.0
    cpu: auto
    memory: 32Gi
    args: [ --enable-auto-tool-choice, --tool-call-parser, llama3_json ]

  - name: iim-granite-3-2-2b
    model_id: ibm-granite/granite-3.2-2b-instruct
    category: llm
    image: docker.io/intel/inference-xeon-ibm-granite-granite-3.2-2b-instruct:0.1.0
    cpu: auto
    memory: 32Gi

  - name: iim-phi-4-reasoning
    model_id: microsoft/Phi-4-reasoning
    category: llm
    image: docker.io/intel/inference-xeon-microsoft-phi-4-reasoning:0.1.0
    cpu: auto
    memory: 56Gi

  - name: iim-mistral-7b-v0-2
    model_id: mistralai/Mistral-7B-Instruct-v0.2
    category: llm
    image: docker.io/intel/inference-xeon-mistralai-mistral-7b-instruct-v0.2:0.1.0
    cpu: auto
    memory: 40Gi

  # ── VLMs ───────────────────────────────────────────────────────────────────
  - name: iim-gemma-4-e4b
    model_id: google/gemma-4-E4B-it
    category: vlm
    image: docker.io/intel/inference-xeon-google-gemma-4-e4b-it:0.1.0
    cpu: auto
    memory: 56Gi

  - name: iim-qwen3-vl-30b-a3b
    model_id: Qwen/Qwen3-VL-30B-A3B-Instruct
    category: vlm
    image: docker.io/intel/inference-xeon-qwen-qwen3-vl-30b-a3b-instruct:0.1.0
    cpu: auto
    memory: 96Gi

  # ── Embedding and rerankers ────────────────────────────────────────────────
  - name: bge-base-en
    model_id: BAAI/bge-base-en-v1.5
    category: embed

  - name: bge-reranker
    model_id: BAAI/bge-reranker-base
    category: rerank

runtimes:

  # IIM launcher (python -m inference_runtime.cli serve); plumbing in runtimes/iims.
  iims:
    image: "docker.io/intel/inference-xeon-base:0.1.0"   # models without their own IIM image
    categories:
      llm:
        args: [ --max-model-len, auto ]
        env: { VLLM_CPU_KVCACHE_SPACE: "${KV_CACHE_GB}" }
        defaults: { cpu: 8, memory: "32Gi", kv_cache_gb: 16 }
      vlm:
        args: [ --max-model-len, auto ]
        env: { VLLM_CPU_KVCACHE_SPACE: "${KV_CACHE_GB}" }
        defaults: { cpu: 16, memory: "48Gi", kv_cache_gb: 16 }
      embed:
        env: { VLLM_CPU_KVCACHE_SPACE: "${KV_CACHE_GB}" }
        defaults: { cpu: 6, memory: "8Gi", kv_cache_gb: 2 }
      rerank:
        env: { VLLM_CPU_KVCACHE_SPACE: "${KV_CACHE_GB}" }
        defaults: { cpu: 6, memory: "8Gi", kv_cache_gb: 2 }

  # Upstream vLLM CPU images: pick with --server vllm [--server-version V].
  vllm:
    default_version: "0.28.0"
    env:
      USER: "vllm"
      VLLM_CPU_NUM_OF_RESERVED_CPU: "1"
      VLLM_CPU_SGL_KERNEL: "1"
      VLLM_NO_USAGE_STATS: "1"
      KMP_BLOCKTIME: "1"
    versions:
      "0.33.0": { image: "docker.io/vllm/vllm-openai-cpu:v0.33.0" }
      "0.24.0": { image: "docker.io/vllm/vllm-openai-cpu:v0.24.0" }
      "0.28.0": { image: "docker.io/vllm/vllm-openai-cpu:v0.28.0" }
      "0.19.1":
        image: "docker.io/vllm/vllm-openai-cpu:v0.19.1"
        env: { VLLM_USE_V1: "1", VLLM_CPU_KVCACHE_SPACE: "12" }
        args: [ --max-num-seqs, "256" ]
    categories:
      llm:
        args: [ --dtype, bfloat16, --max-num-seqs, "128", --max-num-batched-tokens, "2048", --enable-prefix-caching, --enable-chunked-prefill ]
        env: { VLLM_CPU_KVCACHE_SPACE: "${KV_CACHE_GB}" }
        defaults: { cpu: 8, memory: "16Gi", kv_cache_gb: 8 }
      vlm:
        args: [ --dtype, bfloat16, --max-num-seqs, "64", --max-num-batched-tokens, "1024" ]
        env: { VLLM_CPU_KVCACHE_SPACE: "${KV_CACHE_GB}" }
        defaults: { cpu: 16, memory: "48Gi", kv_cache_gb: 8 }
      embed:
        args: [ --dtype, bfloat16, --gpu-memory-utilization, "0.7" ]
        env: { VLLM_CPU_KVCACHE_SPACE: "${KV_CACHE_GB}" }
        defaults: { cpu: 6, memory: "16Gi", kv_cache_gb: 16 }
      rerank:
        args: [ --dtype, bfloat16, --gpu-memory-utilization, "0.7" ]
        env: { VLLM_CPU_KVCACHE_SPACE: "${KV_CACHE_GB}" }
        defaults: { cpu: 6, memory: "16Gi", kv_cache_gb: 16 }

  # OpenVINO Model Server; plumbing in runtimes/openvino.
  openvino:
    env: {}
    categories:
      llm:
        defaults: { cpu: 8, memory: "16Gi" }
      embed:
        defaults: { cpu: 6, memory: "12Gi" }
      rerank:
        defaults: { cpu: 6, memory: "12Gi" }
