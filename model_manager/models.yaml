# =============================================================================
# Model Manager — model catalog & runtime configuration
# =============================================================================
#   models:    what to deploy (one entry per model)
#   runtimes:  per-engine deploy config (images, versions, env, categories)
#
#   ./model-manager deploy <name> --wait           # deploy a catalog model
#   ./model-manager deploy --id <hf/repo> --cpu 8  # deploy any HuggingFace model by id (no edit needed)
#   ./model-manager undeploy <name>
# =============================================================================


# =============================================================================
# Defaults — cluster-wide fallbacks applied to every model that omits a value
# =============================================================================
defaults:
  namespace: llm-inference        # target namespace for deployments
  runtime: vllm                   # default engine when a model omits one
  replicas: 1                     # default replica count
  require_amx: true               # only schedule model pods on nodes with Intel AMX

# =============================================================================
# Storage — where downloaded model weights live
# =============================================================================
storage:
  pvc_name: model-store           # PVC that holds downloaded model weights

# =============================================================================
# Network — proxy + connectivity settings for pulling weights from HuggingFace
# =============================================================================
network:
  http_proxy: ""                  # e.g. http://proxy:911 — empty inherits from env
  https_proxy: ""                 # e.g. http://proxy:912
  no_proxy: ""                    # e.g. localhost,127.0.0.1,10.0.0.0/8
  connectivity_check: https://huggingface.co   # reachability probe before download


# =============================================================================
# Models — what to deploy (one entry per model)
# =============================================================================
# Required: name, model_id. Everything else is optional and inherits from the
# runtime/category. CLI flags override any field for a one-off deploy.
#
# Common fields:
#   category:        llm | embed | rerank | vlm   (drives default args + cpu/memory)
#   cpu / memory:    resource requests            (default from category)
#   replicas:        replica count                (default: 1)
#   namespace:       target namespace             (default: llm-inference)
#   node:            pin to a specific node
#   routing:         epp | direct
#   image:           override the runtime image entirely
#   autodeploy:      true → bring up automatically during install
#   chat_template:   inline Jinja, or an absolute path → vLLM --chat-template
#                    Inline Jinja (multi-line: use a `|` block scalar) is stored
#                    in a <model>-chat-template ConfigMap and mounted read-only
#                    at /etc/chat-template — it is deliberately NOT inlined into
#                    the LLMInferenceService, because the KServe controller runs
#                    the spec through Go text/template and rejects `{{ ... }}`.
#                    The ConfigMap is created on deploy and removed on undeploy.
#                    An absolute path (leading /) is passed through untouched and
#                    must already exist in the pod — e.g. a file you placed on the
#                    model PVC, visible at /mnt/models/<file>. vLLM exits if it is
#                    missing, so prefer inline Jinja unless the file is external.
#                    Must be a single string — if a HF repo publishes a LIST of
#                    named templates, copy just the one you want (usually
#                    "default"). Literal CR (\r) survives: use a double-quoted
#                    scalar with "\r" escapes (a `|` block scalar cannot carry CR,
#                    as YAML normalizes line breaks).
#   chat_template_file: file under chat-templates/ (or an absolute host path)
#                    whose content is used as chat_template — one shared file
#                    instead of inline duplication. Mutually exclusive with chat_template.
#   args: [ ... ]    extra engine args   (appended after category/version args)
#   env:  { ... }    extra env vars      (merged over runtime env)
#
# Server binding — pick the model server + version. Two equivalent forms:
#   servers: (preferred)   declares the known-good server/version allow-list
#     servers: { vllm: { versions: ["0.24.0","0.19.1"], default: "0.24.0" } }
#     default_server: vllm
#   shorthand (single)     runtime: + server_version:   (no allow-list)
#
# Select at deploy: --server <engine> --server-version <v>   (must be declared)
# Run variants side by side: --as <alt-name>

models:

  # LLM — small Qwen3, test model (servers: form)
  - name: qwen3-0-6b                                                # deploy name + the "model" id used in API requests
    model_id: Qwen/Qwen3-0.6B                                       # HuggingFace repo to pull weights from
    category: llm                                                   # workload class → picks vLLM llm args + cpu/memory defaults
    servers:                                                        # servers this model may run on (allow-list)
      vllm: { versions: ["0.24.0", "0.19.1"], default: "0.24.0" }   # engine: allowed versions + default
    default_server: vllm                                            # server used when --server is not passed
    cpu: 8                                                          # CPU cores requested (overrides category default)
    memory: 16Gi                                                    # memory requested (overrides category default)

  # LLM — quantized Llama-3 8B, chat/completion (shorthand form)
  - name: llama3-8b-awq
    model_id: casperhansen/llama-3-8b-instruct-awq
    category: llm
    runtime: vllm
    server_version: "0.24.0"
    cpu: 16
    memory: 32Gi

  # LLM — Qwen3.5 2B INT4 on OpenVINO (flat runtime, no version)
  - name: qwen3-5-2b-ovms
    model_id: OpenVINO/Qwen3.5-2B-int4-ov
    runtime: openvino
    category: llm
    cpu: 8
    memory: 16Gi

  # Embedding — BGE base English (768-dim)
  - name: bge-base-en
    model_id: BAAI/bge-base-en-v1.5
    category: embed
    runtime: vllm
    server_version: "0.24.0"

  # Reranker — BGE reranker for RAG pipelines
  - name: bge-reranker
    model_id: BAAI/bge-reranker-base
    category: rerank
    runtime: vllm
    server_version: "0.24.0"


  # ── Tuned CPU sizing + TP + tool-call parsers + chat templates.
  #    TP 1 for every CPU model: vLLM
  #    binds one NUMA node per TP rank and the NRI balloon is chosen by --tp, so
  #    raise both together with `--tp N`. Memory is a sizing estimate.
  #    `cpu: auto` sizes each model to the free physical cores of one NUMA
  #    node (minus reserved) per TP rank, on the smallest node; `--cpu N` overrides.
  - name: llama-3-1-8b
    model_id: meta-llama/Llama-3.1-8B-Instruct
    category: llm
    runtime: vllm
    server_version: "0.24.0"
    cpu: auto                        # one NUMA node per TP rank, per node
    memory: 64Gi
    args: [ "--block-size", "128", "--dtype", "bfloat16", "--distributed_executor_backend", "mp", "--enable_chunked_prefill", "--enforce-eager", "--max-num-batched-tokens", "2048", "--max-num-seqs", "256", "--enable-prefix-caching", "--enable-auto-tool-choice", "--tool-call-parser", "llama3_json", "--tensor-parallel-size", "1" ]
    env:
      VLLM_RPC_TIMEOUT: "100000"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_ENGINE_ITERATION_TIMEOUT_S: "120"
      TRITON_CACHE_DIR: "/tmp/.triton"
      USER: "vllm"
      VLLM_CPU_KVCACHE_SPACE: "40"
      VLLM_CPU_NUM_OF_RESERVED_CPU: "0"
      HF_HUB_DISABLE_XET: "1"
      VLLM_CPU_SGL_KERNEL: "1"

