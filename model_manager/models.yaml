# =============================================================================
# Runtimes — per-engine deploy config (images, versions, env, categories)
# =============================================================================
# Per-engine deploy config, so the full picture of what a server runs with is in
# one place. Low-level plumbing (device, kind, routing, CR manifest pointer)
# lives in runtimes/<name>/values.yaml and is merged in at load.
#
# Effective config a pod receives (each layer overrides the one before it):
#   env   = common env   + category env  + version env delta   + per-model env  + --env
#   args  = category args + version args delta  + per-model args  + --arg
#   image = the selected version's image
#
# Version selected by:  --server-version  >  model server_version:  >  default_version

  # ── Agent toolkit models ───────────────────────────────────────────
  # JSON-valued vLLM flags use dot notation (--flag.key value): KServe evals the arg
  # string, which strips the quotes from inline JSON.
  # Qwen3.6-35B-A3B: hybrid linear-attention MoE (Qwen3_5MoeForConditionalGeneration)
  # that needs vLLM 0.28 — pinned here so no other model changes version.
  # - Prefix caching and chunked prefill off: with them on, vLLM rejects the config for
  #   linear attention on CPU ("--mamba-block-size can only be set with
  #   --enable-prefix-caching"). The --no-enable-* flags override the llm category defaults.
  # - 32k context: the model default (262144) is far past what a CPU KV cache holds.
  #   Without chunked prefill a batch must hold a full prompt, so batched tokens = context.
  # - Text-only: the vision tower crashes the AMX kernel ("mat1 must be a 2D tensor").
  # TP 1 (vLLM 0.28 CPU needs one NUMA node per TP rank).
  - name: qwen3-6-35b-a3b
    model_id: Qwen/Qwen3.6-35B-A3B
    category: llm
    runtime: vllm
    server_version: "0.28.0"
    cpu: auto                        # one NUMA node per TP rank, per node
    memory: 128Gi
    args: [ "--block-size", "128", "--dtype", "bfloat16", "--distributed_executor_backend", "mp", "--trust-remote-code", "--enforce-eager", "--no-enable-prefix-caching", "--no-enable-chunked-prefill", "--max-model-len", "32768", "--max-num-batched-tokens", "32768", "--limit-mm-per-prompt.image", "0", "--limit-mm-per-prompt.video", "0", "--enable-auto-tool-choice", "--tool-call-parser", "qwen3_xml", "--tensor-parallel-size", "1" ]
    env:
      VLLM_CPU_KVCACHE_SPACE: "50"
      VLLM_RPC_TIMEOUT: "100000"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_ENGINE_ITERATION_TIMEOUT_S: "120"
      VLLM_CPU_NUM_OF_RESERVED_CPU: "0"
      HF_HUB_DISABLE_XET: "1"
      VLLM_CPU_SGL_KERNEL: "1"
