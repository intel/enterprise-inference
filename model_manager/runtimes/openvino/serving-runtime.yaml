apiVersion: serving.kserve.io/v1alpha1
kind: ClusterServingRuntime
metadata:
  name: openvino-runtime
  labels:
    enterprise-inference/owner: model-manager
    app.kubernetes.io/managed-by: model-manager
  annotations:
    serving.kserve.io/server-type: ovms
spec:
  annotations:
    prometheus.kserve.io/port: "8080"
    prometheus.kserve.io/path: "/metrics"
  supportedModelFormats:
    - name: openvino
      autoSelect: true
      priority: 1
      version: "10"
  protocolVersions:
    - v1
    - v2
    - grpc-v2
  containers:
    - name: kserve-container
      # Light image (no Python/optimum) — serves a pre-exported model via its
      # config_all.json registry. The model is downloaded + converted to
      # OpenVINO IR beforehand by the prep job (see download_weights → OVMS
      # branch), so the serving pod fetches nothing.
      # {{RUNTIME_IMAGE}} is filled from the runtime's `image:` (runtimes/openvino/
      # values.yaml, overridable in models.yaml → runtimes.openvino.image).
      image: {{RUNTIME_IMAGE}}
      args:
        - "--config_path"
        - "/models/{{.Name}}/config_all.json"
        - "--port=9000"
        - "--rest_port=8080"
        - "--metrics_enable"
      ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 9000
          name: grpc
          protocol: TCP
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 4Gi
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        runAsNonRoot: true
        runAsUser: 5000
        capabilities:
          drop:
            - ALL
