# =============================================================================
# OpenVINO Model Server (OVMS) runtime — low-level plumbing
# =============================================================================
# OVMS deploy config (env, per-category defaults) lives in models.yaml →
# runtimes.openvino. This file holds only the low-level plumbing merged in at
# load time. OVMS is a flat runtime with no version axis — server_version is
# not applicable, and requesting one via --server-version aborts with a clear
# message.
# =============================================================================

# One image serves and pulls (`ovms --pull` of pre-exported OpenVINO models). 2026.4+
# loads models that ship an MTP draft (e.g. Qwen3.5). Set model_downloader_image to a
# -py tag only to convert a model that is not already in OpenVINO format.
image: "openvino/model_server:2026.4.1"                     # injected into the ClusterServingRuntime (override in models.yaml → runtimes.openvino.image)
device: cpu
kind: InferenceService
format: openvino
runtime_name: openvino-runtime                              # ClusterServingRuntime to reference
routing: aigateway
serving_runtime_manifest: openvino/serving-runtime.yaml     # raw CR manifest applied on first deploy
