# =============================================================================
# vLLM runtime — low-level plumbing (CPU)
# =============================================================================
# The deploy config that users tune — versions, common env, per-category args
# and resource defaults — lives in models.yaml → runtimes.vllm (so the full
# picture is in one place). This file holds only the stable, low-level plumbing
# that is merged in at load time (models.yaml wins on any key clash).
#
# Supported plumbing keys:
#   device                   cpu | gpu                                (default: cpu)
#   kind                     LLMInferenceService | InferenceService   (default: LLMInferenceService)
#   routing                  epp | direct
#   container                LLMInferenceService engines other than vLLM: command,
#                            args, ready_path, live_path ($model filled in), run_as_user
#                            (see runtimes/openvino). Unset: KServe's vLLM command
#   autoscaling              KEDA signal: query (PromQL, $namespace/$model filled in)
#                            and scale_target, its default per-replica threshold
#   format                   model format hint                        (InferenceService)
#   runtime_name             ClusterServingRuntime name to reference  (InferenceService)
#   serving_runtime_manifest path to a raw CR manifest to apply       (InferenceService)
#   model_downloader_image   image for the weight-download job        (OVMS)
# =============================================================================

device: cpu
kind: LLMInferenceService
routing: epp
# Requests queued because the replica is saturated.
autoscaling:
  query: 'sum(vllm:num_requests_waiting{namespace="$namespace",model="$model"})'
  scale_target: 2
