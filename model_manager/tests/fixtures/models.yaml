# Edge-case catalog for parity tests (not a usable deployment catalog).
defaults:
  namespace: ns1
  replicas: 2
  require_amx: false

models:
  - name: tmpl-inline
    model_id: org/inline
    category: llm
    runtime: vllm
    chat_template: |
      {%- for m in messages -%}{{ m['content'] }}{%- endfor -%}
    args: [--tensor-parallel-size, "1", --max-model-len, "2048"]
    env: { FLAG: true, NUM: 3, KV: "${KV_CACHE_GB}g" }

  - name: tmpl-path
    model_id: org/path
    category: embed
    routing: aigateway
    chat_template: /mnt/models/tpl.jinja

  - name: tmpl-file
    model_id: org/file
    category: llm
    chat_template_file: chat.jinja

  - name: tmpl-file-both
    model_id: org/both
    chat_template: "{{ messages }}"
    chat_template_file: chat.jinja

  - name: tmpl-file-missing
    model_id: org/missing
    chat_template_file: missing.jinja

  - name: specdec
    model_id: org/target
    draft_model_id: org/draft
    category: llm
    args: [--speculative-config.method, draft_model, --speculative-config.model, /mnt/models/draft]

  - name: auto-cpu
    model_id: org/auto
    category: llm
    cpu: auto

  - name: multi
    model_id: org/multi
    category: llm
    servers:
      vllm: { versions: ["0.24.0"] }
      openvino: {}

  - name: nocat
    model_id: org/nocat
    runtime: vllm

  - name: badenv
    model_id: org/badenv
    env: [a, b]

  - name: badtpl
    model_id: org/badtpl
    chat_template: [{ name: default, template: x }]

runtimes:
  vllm:
    default_version: "0.24.0"
    env: { USER: vllm }
    versions:
      "0.24.0": { image: "img/vllm:0.24.0" }
      "0.30.0": { image: "img/vllm:0.30.0", env: { VLLM_X: "1" }, args: [--foo] }
    categories:
      llm:
        args: [--dtype, bfloat16]
        env: { VLLM_CPU_KVCACHE_SPACE: "${KV_CACHE_GB}" }
        defaults: { cpu: 4, memory: 8Gi, kv_cache_gb: 4 }
      embed:
        defaults: { cpu: 2 }
  openvino:
    categories:
      llm:
        weight_format: int4
        defaults: { cpu: 6, memory: 12Gi }
