---
name: "Val :: Unit tests"

# Actions are pinned to full commit SHAs (the trailing `# vX.Y.Z` is the tag
# that SHA corresponded to) and every tool to an exact version -- no floating
# tags. Only GitHub-hosted runners and public actions are used.
#
# model_manager tests need no cluster: stub kubectl/curl scripts replay
# scripted responses (model_manager/tests/fakebin).

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'release-[0-9]+\.[0-9]+'
  pull_request:
    branches:
      - main
      - 'release-[0-9]+\.[0-9]+'
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede PR runs; every push to main/release keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  model-manager:
    name: "model_manager_unit_tests (python ${{ matrix.python }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported (RHEL 9 python3) with the minimum PyYAML, and current.
          - python: "3.9"
            pyyaml: "5.4.1"
          - python: "3.12"
            pyyaml: "6.0.3"
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        env:
          PYYAML_VERSION: ${{ matrix.pyyaml }}
        run: python -m pip install --disable-pip-version-check "pytest==8.4.2" "PyYAML==${PYYAML_VERSION}"

      - name: Run model_manager tests
        run: python -m pytest -q model_manager/tests

  # Single stable check for branch protection, independent of matrix entries.
  unit-tests-result:
    name: "Unit tests result"
    if: always()
    needs: model-manager
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check unit test results
        env:
          RESULT: ${{ needs.model-manager.result }}
        run: |
          echo "model-manager: ${RESULT}"
          [[ "${RESULT}" == "success" ]]
