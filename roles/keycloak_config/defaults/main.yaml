---
# =============================================================================
# Keycloak Config — Inference Solution Defaults
# =============================================================================
# This role configures Keycloak realm & client for the inference solution
# using the native KeycloakRealmImport CRD.
# Each solution layer owns its own realm/client/mappers/RBAC.
# =============================================================================

keycloak_namespace: "keycloak"
# In-pod admin URL: Keycloak serves under its route prefix in path mode.
_kcc_relative_path: >-
  {{ ('keycloak' | service_route(routing_mode | default('subdomain'),
                                 base_domain_name | default('inference-example.com'),
                                 service_routes | default({}),
                                 service_route_overrides | default({}))).relative_path }}
keycloak_admin_server_url: "http://localhost:8080{{ '' if _kcc_relative_path == '/' else _kcc_relative_path }}"

# Realm & client owned by this solution
keycloak_realm: "inference"
keycloak_client_id: "inference-client"

# Client secret storage
keycloak_client_secret_name: "keycloak-client-secret"

# JWT token lifespan in seconds (default: 900 = 15 minutes)
keycloak_token_lifespan: 900
