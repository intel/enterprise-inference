---
# =============================================================================
# Keycloak Config — Teardown
# =============================================================================
# Removes only what this role installed (see keycloak_config_owned_objects).

- name: "keycloak_config | Remove owned objects"
  ansible.builtin.include_role:
    name: inference_ownership
    tasks_from: delete
  vars:
    ownership_name: keycloak_config
    ownership_items: "{{ keycloak_config_owned_objects }}"

- name: "keycloak_config | Teardown complete"
  ansible.builtin.debug:
    msg: "Inference Keycloak config teardown done (only objects this role installed)."
