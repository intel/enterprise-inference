---
# =============================================================================
# Keycloak Config — Inference Solution (KeycloakRealmImport CR)
# =============================================================================
# Creates realm, client, audience mapper for the inference solution using the
# Keycloak Operator's native KeycloakRealmImport CRD.
# Each solution ships its own version of this role with custom mappers/RBAC.
# =============================================================================

- name: "keycloak_config | Check for existing client secret"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ keycloak_client_secret_name }}"
    namespace: "{{ keycloak_namespace }}"
  register: _kcc_secret_existing
  failed_when: false

- name: "keycloak_config | Already configured — skipping"
  ansible.builtin.debug:
    msg: "{{ keycloak_client_secret_name }} already exists — skipping realm/client setup."
  when: (_kcc_secret_existing.resources | default([]) | length) > 0

- name: "keycloak_config | Configure realm & client via KeycloakRealmImport"
  when: (_kcc_secret_existing.resources | default([]) | length) == 0
  block:
    - name: "keycloak_config | Verify Keycloak instance exists"
      kubernetes.core.k8s_info:
        api_version: k8s.keycloak.org/v2beta1
        kind: Keycloak
        name: keycloak
        namespace: "{{ keycloak_namespace }}"
      register: _kcc_keycloak
      failed_when: (_kcc_keycloak.resources | default([]) | length) == 0

    - name: "keycloak_config | Wait for Keycloak StatefulSet readiness"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: StatefulSet
        name: keycloak
        namespace: "{{ keycloak_namespace }}"
      register: _kcc_sts
      until:
        - _kcc_sts.resources | length > 0
        - (_kcc_sts.resources[0].status.readyReplicas | default(0) | int) >= 1
      retries: 30
      delay: 10

    # ── Generate a client secret value ──────────────────────────────────────────

    - name: "keycloak_config | Generate client secret"
      ansible.builtin.set_fact:
        _kcc_client_secret: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
      no_log: "{{ secure_logs | default(true) }}"

    # ── Apply KeycloakRealmImport CR ────────────────────────────────────────────

    - name: "keycloak_config | Apply KeycloakRealmImport CR"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: k8s.keycloak.org/v2beta1
          kind: KeycloakRealmImport
          metadata:
            name: "{{ keycloak_realm }}-realm-import"
            namespace: "{{ keycloak_namespace }}"
          spec:
            keycloakCRName: keycloak
            realm:
              realm: "{{ keycloak_realm }}"
              enabled: true
              clients:
                - clientId: "{{ keycloak_client_id }}"
                  enabled: true
                  publicClient: false
                  serviceAccountsEnabled: true
                  directAccessGrantsEnabled: false
                  standardFlowEnabled: false
                  secret: "{{ _kcc_client_secret }}"
                  # client_credentials only: no browser flow, so no redirect URIs or origins.
                  redirectUris: []
                  webOrigins: []
                  attributes:
                    access.token.lifespan: "{{ keycloak_token_lifespan | string }}"
                  protocolMappers:
                    - name: audience-mapper
                      protocol: openid-connect
                      protocolMapper: oidc-audience-mapper
                      config:
                        included.client.audience: "{{ keycloak_client_id }}"
                        id.token.claim: "false"
                        access.token.claim: "true"

    # ── Wait for import to complete ─────────────────────────────────────────────

    - name: "keycloak_config | Wait for realm import to complete"
      kubernetes.core.k8s_info:
        api_version: k8s.keycloak.org/v2beta1
        kind: KeycloakRealmImport
        name: "{{ keycloak_realm }}-realm-import"
        namespace: "{{ keycloak_namespace }}"
      register: _kcc_import
      until:
        - _kcc_import.resources | length > 0
        - _kcc_import.resources[0].status is defined
        - _kcc_import.resources[0].status.conditions is defined
        - >-
          (_kcc_import.resources[0].status.conditions
            | selectattr('type', 'eq', 'Done')
            | selectattr('status', 'eq', 'True')
            | list | length > 0)
          or
          (_kcc_import.resources[0].status.conditions
            | selectattr('type', 'eq', 'HasErrors')
            | selectattr('status', 'eq', 'True')
            | list | length > 0)
      retries: 30
      delay: 10

    - name: "keycloak_config | Check import result"
      ansible.builtin.fail:
        msg: >-
          KeycloakRealmImport failed. Check:
            kubectl -n {{ keycloak_namespace }} get keycloakrealmimports/{{ keycloak_realm }}-realm-import -o yaml
            kubectl -n {{ keycloak_namespace }} logs job/{{ keycloak_realm }}-realm-import-kc
      when: >-
        _kcc_import.resources[0].status.conditions
          | selectattr('type', 'eq', 'HasErrors')
          | selectattr('status', 'eq', 'True')
          | list | length > 0

    # ── Make Keycloak adopt our generated secret ─────────────────────────────────
    # The realm-import Job is idempotent by realm name: on a realm that already
    # exists (platform Keycloak survives an inference-layer teardown) it is a
    # no-op and does NOT set the client secret. k8s would then store a freshly
    # generated secret while Keycloak keeps its old one — they diverge and token
    # requests fail with "Invalid client credentials". Pushing our secret via
    # kcadm makes the k8s value authoritative and converges both every run. Runs
    # in-pod (kcadm against localhost), so no port-forward/curl/JSON parsing.

    - name: "keycloak_config | Read Keycloak admin credentials"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: keycloak-admin-secret
        namespace: "{{ keycloak_namespace }}"
      register: _kcc_admin_sec
      no_log: "{{ secure_logs | default(true) }}"

    - name: "keycloak_config | Discover Keycloak server pod"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ keycloak_namespace }}"
        label_selectors:
          - "app=keycloak"
        field_selectors:
          - "status.phase=Running"
      register: _kcc_pod
      failed_when: (_kcc_pod.resources | default([]) | length) == 0

    - name: "keycloak_config | Set Keycloak pod name"
      ansible.builtin.set_fact:
        keycloak_pod_name: "{{ _kcc_pod.resources[0].metadata.name }}"

    - name: "keycloak_config | kcadm — authenticate (writes in-pod config)"
      kubernetes.core.k8s_exec:
        namespace: "{{ keycloak_namespace }}"
        pod: "{{ keycloak_pod_name }}"
        command: >-
          /opt/keycloak/bin/kcadm.sh config credentials
          --server {{ keycloak_admin_server_url }} --realm master
          --user {{ _kcc_admin_sec.resources[0].data.username | b64decode }}
          --password {{ _kcc_admin_sec.resources[0].data.password | b64decode }}
      no_log: "{{ secure_logs | default(true) }}"

    # Right after a fresh import the server can answer 403 until it sees the
    # new realm's admin roles; retry instead of failing the run.
    - name: "keycloak_config | kcadm — resolve client UUID"
      kubernetes.core.k8s_exec:
        namespace: "{{ keycloak_namespace }}"
        pod: "{{ keycloak_pod_name }}"
        command: >-
          /opt/keycloak/bin/kcadm.sh get clients -r {{ keycloak_realm }}
          -q clientId={{ keycloak_client_id }} --fields id --format csv --noquotes
      register: _kcc_client_uuid
      changed_when: false
      failed_when: false
      until: (_kcc_client_uuid.stdout | default('') | trim) != ""
      retries: 10
      delay: 6

    - name: "keycloak_config | Check client UUID"
      ansible.builtin.assert:
        that: (_kcc_client_uuid.stdout | default('') | trim) != ""
        fail_msg: "Client {{ keycloak_client_id }} not found in realm {{ keycloak_realm }}: {{ _kcc_client_uuid.stderr | default('') }}"

    - name: "keycloak_config | kcadm — set client secret to our generated value"
      kubernetes.core.k8s_exec:
        namespace: "{{ keycloak_namespace }}"
        pod: "{{ keycloak_pod_name }}"
        command: >-
          /opt/keycloak/bin/kcadm.sh update clients/{{ _kcc_client_uuid.stdout | trim }}
          -r {{ keycloak_realm }} -s secret={{ _kcc_client_secret }}
      no_log: "{{ secure_logs | default(true) }}"

    # ── Store client secret in K8s Secret ───────────────────────────────────────

    - name: "keycloak_config | Store client secret"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ keycloak_client_secret_name }}"
            namespace: "{{ keycloak_namespace }}"
          type: Opaque
          stringData:
            client-id: "{{ keycloak_client_id }}"
            client-secret: "{{ _kcc_client_secret }}"
      no_log: "{{ secure_logs | default(true) }}"

    # ── Cleanup the import CR (as recommended by docs) ──────────────────────────

    - name: "keycloak_config | Cleanup realm import CR"
      kubernetes.core.k8s:
        api_version: k8s.keycloak.org/v2beta1
        kind: KeycloakRealmImport
        name: "{{ keycloak_realm }}-realm-import"
        namespace: "{{ keycloak_namespace }}"
        state: absent
      failed_when: false

    - name: "keycloak_config | Realm & client configured"
      ansible.builtin.debug:
        msg: >-
          Realm '{{ keycloak_realm }}' + client '{{ keycloak_client_id }}' ready.
          Secret stored in {{ keycloak_client_secret_name }}.
