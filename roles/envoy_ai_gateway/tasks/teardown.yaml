---
# =============================================================================
# Envoy AI Gateway — Teardown
# =============================================================================
# Removes only objects in envoy_ai_gateway_owned_objects that carry the
# ownership label (see roles/inference_ownership). Routes are deleted before
# the controller is uninstalled, so it can clear their finalizers. The
# llm-inference namespace (llm_services) and the agentgateway's objects of the
# same name are left alone.

- name: "envoy_ai_gateway | Remove owned objects"
  ansible.builtin.include_role:
    name: inference_ownership
    tasks_from: delete
  vars:
    ownership_name: envoy_ai_gateway
    ownership_items: "{{ envoy_ai_gateway_owned_objects }}"
