---
# =============================================================================
# Envoy AI Gateway — Teardown
# =============================================================================

- name: "envoy_ai_gateway | Check if Helm release exists"
  kubernetes.core.helm_info:
    name: aieg
    release_namespace: "{{ envoy_ai_gateway_namespace }}"
  register: _eag_release
  failed_when: false

- name: "envoy_ai_gateway | Not installed — skipping teardown"
  ansible.builtin.debug:
    msg: "Envoy AI Gateway Helm release not found in {{ envoy_ai_gateway_namespace }}. Nothing to tear down."
  when: _eag_release.status is not defined

- name: "envoy_ai_gateway | Teardown"
  when: _eag_release.status is defined
  block:
    - name: "envoy_ai_gateway | Uninstall controller"
      kubernetes.core.helm:
        name: aieg
        release_namespace: "{{ envoy_ai_gateway_namespace }}"
        state: absent
        wait: true
      failed_when: false

    - name: "envoy_ai_gateway | Uninstall CRDs Helm release"
      kubernetes.core.helm:
        name: aieg-crd
        release_namespace: "{{ envoy_ai_gateway_namespace }}"
        state: absent
        wait: true
      failed_when: false

    - name: "envoy_ai_gateway | Find AI Gateway CRDs"
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
      register: _eag_crds
      failed_when: false

    - name: "envoy_ai_gateway | Delete AI Gateway CRDs"
      kubernetes.core.k8s:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: "{{ item.metadata.name }}"
        state: absent
      loop: "{{ _eag_crds.resources | default([]) | selectattr('metadata.name', 'match', '.*(aigateway|envoyproxy.*ai).*') | list }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      failed_when: false

    - name: "envoy_ai_gateway | Find all AIGatewayRoutes in namespace"
      kubernetes.core.k8s_info:
        api_version: aigateway.envoyproxy.io/v1beta1
        kind: AIGatewayRoute
        namespace: "{{ ai_gateway_namespace }}"
      register: _aigw_routes
      failed_when: false

    - name: "envoy_ai_gateway | Strip finalizers from AIGatewayRoutes"
      kubernetes.core.k8s_json_patch:
        api_version: aigateway.envoyproxy.io/v1beta1
        kind: AIGatewayRoute
        name: "{{ item.metadata.name }}"
        namespace: "{{ ai_gateway_namespace }}"
        patch:
          - op: remove
            path: /metadata/finalizers
      loop: "{{ _aigw_routes.resources | default([]) | selectattr('metadata.finalizers', 'defined') | list }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      failed_when: false

    - name: "envoy_ai_gateway | Delete AIGatewayRoutes"
      kubernetes.core.k8s:
        api_version: aigateway.envoyproxy.io/v1beta1
        kind: AIGatewayRoute
        name: "{{ item.metadata.name }}"
        namespace: "{{ ai_gateway_namespace }}"
        state: absent
      loop: "{{ _aigw_routes.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      failed_when: false

    - name: "envoy_ai_gateway | Delete external inference HTTPRoute"
      kubernetes.core.k8s:
        api_version: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        name: inference-external
        namespace: "{{ envoy_gateway_namespace | default('envoy-gateway-system') }}"
        state: absent
      failed_when: false

    - name: "envoy_ai_gateway | Unpublish the inference host"
      ansible.builtin.include_role:
        name: gateway_listener
        tasks_from: remove.yaml
      vars:
        gateway_listener_name: inference
        gateway_listener_namespace: "{{ envoy_gateway_namespace | default('envoy-gateway-system') }}"
        gateway_listener_hosts: [{name: inference, hostname: "{{ inference_hostname }}"}]

    - name: "envoy_ai_gateway | Find model-manager managed HTTPRoutes on ai-gateway"
      kubernetes.core.k8s_info:
        api_version: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        namespace: "{{ ai_gateway_namespace }}"
        label_selectors:
          - "app.kubernetes.io/managed-by=model-manager"
      register: _mm_httproutes
      failed_when: false

    - name: "envoy_ai_gateway | Delete model-manager HTTPRoutes"
      kubernetes.core.k8s:
        api_version: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        name: "{{ item.metadata.name }}"
        namespace: "{{ ai_gateway_namespace }}"
        state: absent
      loop: "{{ _mm_httproutes.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      failed_when: false

    - name: "envoy_ai_gateway | Delete legacy shared AIGatewayRoutes (migration cleanup)"
      kubernetes.core.k8s:
        api_version: aigateway.envoyproxy.io/v1beta1
        kind: AIGatewayRoute
        name: "{{ item }}"
        namespace: "{{ ai_gateway_namespace }}"
        state: absent
      loop:
        - inference-unified
        - inference-unified-internal
      failed_when: false

    - name: "envoy_ai_gateway | Delete AI Gateway resource"
      kubernetes.core.k8s:
        api_version: gateway.networking.k8s.io/v1
        kind: Gateway
        name: "{{ ai_gateway_name }}"
        namespace: "{{ ai_gateway_namespace }}"
        state: absent
      failed_when: false
      when: ai_gateway_create | bool

    - name: "envoy_ai_gateway | Delete AI GatewayClass"
      kubernetes.core.k8s:
        api_version: gateway.networking.k8s.io/v1
        kind: GatewayClass
        name: "{{ ai_gateway_class_name }}"
        state: absent
      failed_when: false
      when: ai_gateway_create | bool

    - name: "envoy_ai_gateway | Delete AI Gateway namespace"
      kubernetes.core.k8s:
        kind: Namespace
        name: "{{ ai_gateway_namespace }}"
        state: absent
      failed_when: false
      when: ai_gateway_create | bool

    - name: "envoy_ai_gateway | Delete namespace"
      kubernetes.core.k8s:
        kind: Namespace
        name: "{{ envoy_ai_gateway_namespace }}"
        state: absent
      failed_when: false
