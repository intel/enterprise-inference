---
# Each release is built against one Envoy Gateway minor (upstream go.mod), so
# the version follows the platform controller; set it to pin one.
envoy_ai_gateway_versions:
  "1.9": "1.2.0"
  "1.8": "1.1.0"
  "1.7": "0.6.0"
envoy_ai_gateway_version: "{{ envoy_ai_gateway_versions[_eag_eg_minor] | default('') }}"
_eag_eg_minor: >-
  {{ ((gateway_platform | default({})).version | default(envoy_gateway_version | default('1.9.2'), true)
      | string).split('.')[:2] | join('.') }}
envoy_ai_gateway_namespace: "envoy-ai-gateway-system"
envoy_ai_gateway_helm_repo: "oci://docker.io/envoyproxy"
envoy_ai_gateway_wait_timeout: "300s"

# AI Gateway resource — created in kserve namespace for InferencePool routing
ai_gateway_create: true
ai_gateway_name: "ai-gateway"
ai_gateway_class_name: "inference-pool-with-aigwroute"
ai_gateway_namespace: "{{ kserve_llmisvc_namespace | default('llm-inference') }}"

# Stable service name for the AI Gateway data-plane (avoids hash-suffix from Envoy Gateway).
# Internal consumers can reach it at: <name>.<ai_gateway_namespace>.svc.cluster.local:80
ai_gateway_service_name: "ai-gateway"

# External inference hostname (eg-gateway TLS listener → ai-gateway)
inference_hostname: "inference.{{ base_domain_name | default('inference-example.com') }}"
# Path mode (routing_mode: path): <base>/inference, prefix stripped for the AI
# gateway; the API takes bearer tokens, so cookies of the shared host are dropped.
inference_path: "/inference"
_inference_strip_prefix: >-
  {{ [{'type': 'URLRewrite', 'urlRewrite': {'path': {'type': 'ReplacePrefixMatch', 'replacePrefixMatch': '/'}}},
      {'type': 'RequestHeaderModifier', 'requestHeaderModifier': {'remove': ['Cookie']}}]
     if (routing_mode | default('subdomain')) == 'path' else [] }}
