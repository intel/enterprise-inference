---
# =============================================================================
# vLLM Semantic Router — install
# =============================================================================
# 1. Deploy the official router chart (ext_proc + classifier, models on a PVC).
# 2. Wire it into a dedicated `semantic-router` Envoy AI Gateway via ext_proc.
# 3. (litellm mode) register the customizable `semantic-router` virtual model.
# Opt-in: this whole file only runs when vllm_sr_enabled is true (components.yaml).
# =============================================================================

- name: "vllm_sr | Create namespace"
  kubernetes.core.k8s:
    kind: Namespace
    name: "{{ vllm_sr_namespace }}"
    state: present

# --- HuggingFace token (classifier/embedding model download) ------------------
- name: "vllm_sr | Create HF token secret"
  when: vllm_sr_hf_token | length > 0
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: vllm-sr-env-secrets
        namespace: "{{ vllm_sr_namespace }}"
      stringData:
        HF_TOKEN: "{{ vllm_sr_hf_token }}"
  no_log: true

# --- Router chart (vendored official chart) -----------------------------------
# --- Dashboard credentials (generated once, kept across re-runs) ---------------
- name: "vllm_sr | Dashboard credentials"
  when: vllm_sr_dashboard_enabled | bool
  block:
    - name: "vllm_sr | Read existing dashboard secret"
      kubernetes.core.k8s_info:
        kind: Secret
        name: "{{ vllm_sr_dashboard_secret }}"
        namespace: "{{ vllm_sr_namespace }}"
      register: _vsr_dash_secret

    - name: "vllm_sr | Create dashboard secret (admin password + JWT key)"
      when: _vsr_dash_secret.resources | length == 0
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ vllm_sr_dashboard_secret }}"
            namespace: "{{ vllm_sr_namespace }}"
          stringData:
            admin-email: "{{ vllm_sr_dashboard_admin_email }}"
            admin-password: "{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
            jwt-secret: "{{ lookup('password', '/dev/null length=48 chars=ascii_letters,digits') }}"
      no_log: true

- name: "vllm_sr | Render chart values"
  ansible.builtin.set_fact:
    _vllm_sr_values: "{{ lookup('template', 'values.yaml.j2') | from_yaml }}"

- name: "vllm_sr | Install / upgrade router via Helm"
  kubernetes.core.helm:
    name: "{{ vllm_sr_release_name }}"
    chart_ref: "{{ role_path }}/../../charts/vllm-sr"
    release_namespace: "{{ vllm_sr_namespace }}"
    create_namespace: true
    wait: false
    timeout: "15m0s"
    values: "{{ _vllm_sr_values }}"

# The platform gateway enforces JWT on every route in keycloak mode; the dashboard
# has its own login, so it is exempted the same way as Grafana (grafana-no-auth).
- name: "vllm_sr | Bypass gateway auth for the dashboard (it has its own login)"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.envoyproxy.io/v1alpha1
      kind: SecurityPolicy
      metadata:
        name: vllm-sr-dashboard-no-auth
        namespace: "{{ vllm_sr_namespace }}"
      spec:
        targetRefs:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
            name: "{{ vllm_sr_release_name }}-dashboard"
  when: vllm_sr_dashboard_enabled | bool and auth_provider | default('none') in ['keycloak', 'litellm']

- name: "vllm_sr | Wait for router deployment ready (model download can take a while)"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ vllm_sr_namespace }}"
    label_selectors:
      - "app.kubernetes.io/name=semantic-router"
      - "app.kubernetes.io/component=router"   # the dashboard Deployment shares the name label
  register: _vllm_sr_deploy
  until: >-
    _vllm_sr_deploy.resources | default([]) | length > 0 and
    _vllm_sr_deploy.resources[0].status.readyReplicas | default(0) | int >= 1
  retries: 120
  delay: 10

# --- Enable EnvoyPatchPolicy (required for the ext_proc injection) ------------
# The Envoy AI Gateway ext_proc wiring uses an EnvoyPatchPolicy, which Envoy
# Gateway only honours when extensionApis.enableEnvoyPatchPolicy is true.
- name: "vllm_sr | Read Envoy Gateway config"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: envoy-gateway-config
    namespace: "{{ kserve_envoy_gateway_namespace | default('envoy-gateway-system') }}"
  register: _eg_cfg

- name: "vllm_sr | Ensure EnvoyPatchPolicy is enabled"
  when:
    - _eg_cfg.resources | default([]) | length > 0
    - "'enableEnvoyPatchPolicy: true' not in (_eg_cfg.resources[0].data['envoy-gateway.yaml'] | default(''))"
  block:
    - name: "vllm_sr | Patch Envoy Gateway config to enable EnvoyPatchPolicy"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: envoy-gateway-config
            namespace: "{{ kserve_envoy_gateway_namespace | default('envoy-gateway-system') }}"
          data:
            envoy-gateway.yaml: >-
              {{ (_eg_cfg.resources[0].data['envoy-gateway.yaml'] ~ '\nextensionApis:\n  enableEnvoyPatchPolicy: true\n') }}

    - name: "vllm_sr | Restart Envoy Gateway controller to apply the flag"
      kubernetes.core.k8s:
        state: patched
        api_version: apps/v1
        kind: Deployment
        name: envoy-gateway
        namespace: "{{ kserve_envoy_gateway_namespace | default('envoy-gateway-system') }}"
        definition:
          spec:
            template:
              metadata:
                annotations:
                  vllm-sr/restarted-at: "{{ ansible_date_time.iso8601 | default(lookup('pipe', 'date -u +%FT%TZ')) }}"

# --- Gateway wiring (dedicated semantic-router gateway + ext_proc) -------------
- name: "vllm_sr | Apply Envoy AI Gateway resources (gateway, routes, ext_proc)"
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'gwapi-resources.yaml.j2') }}"

- name: "vllm_sr | Read managed AI Gateway routes"
  kubernetes.core.k8s_info:
    api_version: aigateway.envoyproxy.io/v1beta1
    kind: AIGatewayRoute
    namespace: "{{ vllm_sr_gateway_namespace }}"
    label_selectors:
      - "app.kubernetes.io/part-of=vllm-sr"
  register: _vllm_sr_managed_routes

- name: "vllm_sr | Build desired AI Gateway route names"
  ansible.builtin.set_fact:
    _vllm_sr_desired_route_names: >-
      {{ ['sr-default'] + (vllm_sr_route_models | map('regex_replace', '^', 'sr-') | list) }}

- name: "vllm_sr | Remove routes for models no longer configured"
  kubernetes.core.k8s:
    state: absent
    api_version: aigateway.envoyproxy.io/v1beta1
    kind: AIGatewayRoute
    name: "{{ item.metadata.name }}"
    namespace: "{{ vllm_sr_gateway_namespace }}"
    wait: true
  loop: "{{ _vllm_sr_managed_routes.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when: item.metadata.name not in _vllm_sr_desired_route_names

- name: "vllm_sr | Wait for the semantic-router gateway to be programmed"
  kubernetes.core.k8s_info:
    api_version: gateway.networking.k8s.io/v1
    kind: Gateway
    name: "{{ vllm_sr_gateway_name }}"
    namespace: "{{ vllm_sr_gateway_namespace }}"
  register: _vllm_sr_gw
  until: >-
    _vllm_sr_gw.resources | default([]) | length > 0 and
    _vllm_sr_gw.resources[0].status.addresses | default([]) | length > 0
  retries: 30
  delay: 5

# --- LiteLLM registration (litellm mode) --------------------------------------
- name: "vllm_sr | Register the semantic-router virtual model with LiteLLM"
  when: vllm_sr_expose in ['litellm', 'both']
  ansible.builtin.include_tasks: register_litellm.yaml

- name: "vllm_sr | Install complete"
  ansible.builtin.debug:
    msg:
      - "vLLM Semantic Router deployed in '{{ vllm_sr_namespace }}' (opt-in)."
      - "Routing models: {{ vllm_sr_route_models | join(', ') }} (default: {{ vllm_sr_default_model }})"
      - "Exposure: {{ vllm_sr_expose }}{{ ' — LiteLLM model: ' ~ vllm_sr_litellm_model_name if vllm_sr_expose in ['litellm','both'] else '' }}"
      - "{{ 'Dashboard: https://' ~ vllm_sr_dashboard_hostname ~ '/ (admin ' ~ vllm_sr_dashboard_admin_email ~ '; password: kubectl -n ' ~ vllm_sr_namespace ~ ' get secret ' ~ vllm_sr_dashboard_secret ~ ' -o jsonpath={.data.admin-password} | base64 -d)' if vllm_sr_dashboard_enabled | bool else 'Dashboard: off (vllm_sr_dashboard_enabled)' }}"
      - "User guide: docs/vllm-semantic-router.md"
