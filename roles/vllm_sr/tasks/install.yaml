---
# =============================================================================
# vLLM Semantic Router — install
# =============================================================================
# 1. Deploy the official router chart (ext_proc + classifier, models on a PVC).
# 2. Wire it into a dedicated `semantic-router` Envoy AI Gateway via ext_proc.
# 3. (exposure litellm) register the customizable `semantic-router` virtual model.
# 4. (dashboard) publish it on the platform gateway behind its own login.
# Opt-in: components.yaml runs this role only when vllm_sr_enabled is true and
# ai_gateway_provider is envoy.
# =============================================================================

# controllerName and the namespace the gateway proxies run in follow the platform.
- name: "vllm_sr | Load the platform Envoy Gateway"
  ansible.builtin.include_role:
    name: gateway
    tasks_from: platform.yaml

- name: "vllm_sr | Envoy AI Gateway is the AI gateway"
  ansible.builtin.assert:
    that:
      - (ai_gateway_provider | default('envoy')) == 'envoy'
      - (gateway_platform.provider | default('envoy')) == 'envoy'
    fail_msg: >-
      vllm_sr routes through Envoy AI Gateway (AIGatewayRoute, EnvoyPatchPolicy), so it needs
      ai_gateway_provider: envoy on an Envoy Gateway platform (got ai_gateway_provider:
      {{ ai_gateway_provider | default('envoy') }}, platform: {{ gateway_platform.provider | default('envoy') }}).
      Set vllm_sr_enabled: false, or switch to ai_gateway_provider: envoy.
    quiet: true

# The ext_proc wiring is an EnvoyPatchPolicy, which Envoy Gateway only honours
# with extensionApis.enableEnvoyPatchPolicy; the kserve role turns it on together
# with the AI Gateway extension. Read-only: the controller is never changed here.
- name: "vllm_sr | Read the Envoy Gateway configuration"
  kubernetes.core.k8s_info:
    kind: ConfigMap
    name: envoy-gateway-config
    namespace: "{{ envoy_gateway_namespace | default('envoy-gateway-system') }}"
  register: _vllm_sr_eg_cfg

- name: "vllm_sr | EnvoyPatchPolicy is enabled on Envoy Gateway"
  vars:
    _vllm_sr_eg_config: >-
      {{ ((_vllm_sr_eg_cfg.resources | default([]) | first | default({})).data | default({})).get('envoy-gateway.yaml', '{}')
         | from_yaml | default({}, true) }}
  ansible.builtin.assert:
    that: (_vllm_sr_eg_config.extensionApis | default({})).enableEnvoyPatchPolicy | default(false) | bool
    fail_msg: >-
      The Envoy Gateway in {{ envoy_gateway_namespace | default('envoy-gateway-system') }} does not enable
      EnvoyPatchPolicy (extensionApis.enableEnvoyPatchPolicy in ConfigMap envoy-gateway-config), which the
      semantic router's ext_proc filter needs. The kserve role enables it with the AI Gateway extension:
      re-run install inference, with envoy_gateway_configure_existing: true for an Envoy Gateway this
      platform did not install, or set config.envoyGateway.extensionApis.enableEnvoyPatchPolicy: true on
      that Envoy Gateway release.
    quiet: true

- name: "vllm_sr | Create namespace"
  kubernetes.core.k8s:
    kind: Namespace
    name: "{{ vllm_sr_namespace }}"
    state: present

# The router passes 'restricted'. The dashboard image starts as root and drops to
# a non-root user itself, which only 'baseline' admits.
- name: "vllm_sr | Label namespace — PSS"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ vllm_sr_namespace }}"
        labels:
          pod-security.kubernetes.io/enforce: "{{ 'baseline' if vllm_sr_dashboard_enabled | bool else 'restricted' }}"
          pod-security.kubernetes.io/audit: "restricted"
          pod-security.kubernetes.io/warn: "restricted"
  when: enforce_pss | default(false) | bool

# --- HuggingFace token (classifier/embedding model download) ------------------
- name: "vllm_sr | Create HF token secret"
  when: vllm_sr_hf_token | length > 0
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: vllm-sr-env-secrets
        namespace: "{{ vllm_sr_namespace }}"
      stringData:
        HF_TOKEN: "{{ vllm_sr_hf_token }}"
  no_log: true

# --- Dashboard credentials (generated once, kept across re-runs) ---------------
- name: "vllm_sr | Dashboard credentials"
  when: vllm_sr_dashboard_enabled | bool
  block:
    - name: "vllm_sr | Read existing dashboard secret"
      kubernetes.core.k8s_info:
        kind: Secret
        name: "{{ vllm_sr_dashboard_secret }}"
        namespace: "{{ vllm_sr_namespace }}"
      register: _vllm_sr_dash_secret
      no_log: true

    - name: "vllm_sr | Create dashboard secret (admin password + JWT key)"
      when: _vllm_sr_dash_secret.resources | length == 0
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ vllm_sr_dashboard_secret }}"
            namespace: "{{ vllm_sr_namespace }}"
          stringData:
            admin-email: "{{ vllm_sr_dashboard_admin_email }}"
            admin-password: "{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
            jwt-secret: "{{ lookup('password', '/dev/null length=48 chars=ascii_letters,digits') }}"
      no_log: true

# --- Router chart (vendored official chart) -----------------------------------
- name: "vllm_sr | Resolve the routed models"
  ansible.builtin.include_tasks: models.yaml

- name: "vllm_sr | Render chart values"
  ansible.builtin.set_fact:
    _vllm_sr_values: "{{ lookup('template', 'values.yaml.j2') | from_yaml }}"

- name: "vllm_sr | Install / upgrade router via Helm"
  kubernetes.core.helm:
    name: "{{ vllm_sr_release_name }}"
    chart_ref: "{{ role_path }}/../../charts/vllm-sr"
    release_namespace: "{{ vllm_sr_namespace }}"
    create_namespace: true
    wait: false
    timeout: "15m0s"
    values: "{{ _vllm_sr_values }}"

- name: "vllm_sr | Wait for router deployment ready (model download can take a while)"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ vllm_sr_namespace }}"
    label_selectors:
      - "app.kubernetes.io/name=semantic-router"
      - "app.kubernetes.io/component=router"   # the dashboard Deployment shares the name label
  register: _vllm_sr_deploy
  until: >-
    _vllm_sr_deploy.resources | default([]) | length > 0 and
    _vllm_sr_deploy.resources[0].status.readyReplicas | default(0) | int >= 1
  retries: 120
  delay: 10

# --- Gateway wiring (dedicated semantic-router gateway + ext_proc) -------------
- name: "vllm_sr | Apply Envoy AI Gateway resources (gateway, routes, ext_proc)"
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'gwapi-resources.yaml.j2') }}"

- name: "vllm_sr | Read managed AI Gateway routes"
  kubernetes.core.k8s_info:
    api_version: aigateway.envoyproxy.io/v1beta1
    kind: AIGatewayRoute
    namespace: "{{ vllm_sr_gateway_namespace }}"
    label_selectors:
      - "app.kubernetes.io/part-of=vllm-sr"
  register: _vllm_sr_managed_routes

- name: "vllm_sr | Build desired AI Gateway route names"
  ansible.builtin.set_fact:
    _vllm_sr_desired_route_names: >-
      {{ ['sr-default'] + (_vllm_sr_models | map('regex_replace', '^', 'sr-') | list) }}

- name: "vllm_sr | Remove routes for models no longer configured"
  kubernetes.core.k8s:
    state: absent
    api_version: aigateway.envoyproxy.io/v1beta1
    kind: AIGatewayRoute
    name: "{{ item.metadata.name }}"
    namespace: "{{ vllm_sr_gateway_namespace }}"
    wait: true
  loop: "{{ _vllm_sr_managed_routes.resources | default([]) }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when: item.metadata.name not in _vllm_sr_desired_route_names

- name: "vllm_sr | Wait for the semantic-router gateway to be programmed"
  kubernetes.core.k8s_info:
    api_version: gateway.networking.k8s.io/v1
    kind: Gateway
    name: "{{ vllm_sr_gateway_name }}"
    namespace: "{{ vllm_sr_gateway_namespace }}"
  register: _vllm_sr_gw
  until: >-
    _vllm_sr_gw.resources | default([]) | length > 0 and
    _vllm_sr_gw.resources[0].status.addresses | default([]) | length > 0
  retries: 30
  delay: 5

# --- Dashboard on the platform gateway ----------------------------------------
# Its own host in both routing modes: the dashboard serves root paths.
- name: "vllm_sr | Publish the dashboard host"
  ansible.builtin.include_role:
    name: gateway
    tasks_from: publish.yaml
  vars:
    gateway_publish_name: vllm-sr
    gateway_publish_namespace: "{{ vllm_sr_namespace }}"
    gateway_publish_host: "{{ vllm_sr_dashboard_hostname }}"
    gateway_publish_mode: subdomain   # the dashboard cannot run under a path
  when:
    - vllm_sr_dashboard_enabled | bool
    - vllm_sr_gateway_publish | bool

- name: "vllm_sr | Create dashboard HTTPRoute"
  when:
    - vllm_sr_dashboard_enabled | bool
    - vllm_sr_gateway_publish | bool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: "{{ vllm_sr_release_name }}-dashboard"
        namespace: "{{ vllm_sr_namespace }}"
        labels:
          app.kubernetes.io/managed-by: ansible
          app.kubernetes.io/part-of: vllm-sr
          app.kubernetes.io/component: dashboard
      spec:
        parentRefs:
          - "{{ gateway_publish.parent_ref }}"
        hostnames:
          - "{{ vllm_sr_dashboard_hostname }}"
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: "{{ vllm_sr_release_name }}-dashboard"
                port: "{{ vllm_sr_dashboard_port | int }}"

- name: "vllm_sr | Exempt the dashboard from gateway auth (it has its own login)"
  when:
    - vllm_sr_dashboard_enabled | bool
    - vllm_sr_gateway_publish | bool
  ansible.builtin.include_role:
    name: gateway
    tasks_from: route_auth_exempt.yaml
  vars:
    gateway_route_name: "{{ vllm_sr_release_name }}-dashboard"
    gateway_route_namespace: "{{ vllm_sr_namespace }}"
    gateway_route_policy_name: vllm-sr-dashboard-no-auth

# Dashboard turned off (or not published): drop what an earlier run published.
- name: "vllm_sr | Remove the dashboard route and its auth exemption when not published"
  when: not (vllm_sr_dashboard_enabled | bool and vllm_sr_gateway_publish | bool)
  block:
    - name: "vllm_sr | Remove dashboard HTTPRoute"
      kubernetes.core.k8s:
        state: absent
        api_version: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        name: "{{ vllm_sr_release_name }}-dashboard"
        namespace: "{{ vllm_sr_namespace }}"
      # Absent on any install that never published the dashboard — not an error.
      failed_when: false

    - name: "vllm_sr | Drop the dashboard auth exemption"
      ansible.builtin.include_role:
        name: gateway
        tasks_from: route_auth_exempt.yaml
      vars:
        gateway_route_name: "{{ vllm_sr_release_name }}-dashboard"
        gateway_route_namespace: "{{ vllm_sr_namespace }}"
        gateway_route_policy_name: vllm-sr-dashboard-no-auth
        gateway_route_state: absent

    - name: "vllm_sr | Unpublish the dashboard host"
      ansible.builtin.include_role:
        name: gateway
        tasks_from: unpublish.yaml
      vars:
        gateway_publish_name: vllm-sr
        gateway_publish_namespace: "{{ vllm_sr_namespace }}"
        gateway_publish_host: "{{ vllm_sr_dashboard_hostname }}"
        gateway_publish_mode: subdomain

# --- LiteLLM registration (exposure litellm) ----------------------------------
- name: "vllm_sr | Register the semantic-router virtual model with LiteLLM"
  when: vllm_sr_expose in ['litellm', 'both']
  ansible.builtin.include_tasks: register_litellm.yaml

- name: "vllm_sr | Install complete"
  ansible.builtin.debug:
    msg:
      - "vLLM Semantic Router deployed in '{{ vllm_sr_namespace }}' (opt-in)."
      - "Routing models ({{ _vllm_sr_models_source }}): {{ _vllm_sr_models | join(', ') }} (default: {{ _vllm_sr_default }})"
      - "Exposure: {{ vllm_sr_expose }}{{ ' — LiteLLM model: ' ~ vllm_sr_litellm_model_name if vllm_sr_expose in ['litellm','both'] else '' }}"
      - >-
        {{ 'Dashboard: https://' ~ vllm_sr_dashboard_hostname ~ '/ (admin ' ~ vllm_sr_dashboard_admin_email
           ~ '; password: kubectl -n ' ~ vllm_sr_namespace ~ ' get secret ' ~ vllm_sr_dashboard_secret
           ~ ' -o jsonpath={.data.admin-password} | base64 -d)'
           if vllm_sr_dashboard_enabled | bool and vllm_sr_gateway_publish | bool
           else 'Dashboard: deployed, not published (vllm_sr_gateway_publish)' if vllm_sr_dashboard_enabled | bool
           else 'Dashboard: off (vllm_sr_dashboard_enabled)' }}
      - "User guide: docs/customize/vllm-semantic-router.md"
