---
# Register the semantic router as a customizable LiteLLM virtual model so clients
# can call `model: {{ vllm_sr_litellm_model_name }}` (through LiteLLM's virtual-key
# auth + content-safety guardrail + Langfuse) and get semantic routing.

- name: "vllm_sr | litellm | Resolve semantic-router gateway address"
  ansible.builtin.set_fact:
    _vllm_sr_gw_addr: "{{ vllm_sr_gateway_service_name }}.{{ gateway_namespace | default('envoy-gateway-system') }}.svc.cluster.local"

- name: "vllm_sr | litellm | Wait for LiteLLM deployment ready"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: litellm
    namespace: "{{ vllm_sr_litellm_namespace }}"
  register: _sr_litellm
  until: >-
    _sr_litellm.resources | default([]) | length > 0 and
    _sr_litellm.resources[0].status.readyReplicas | default(0) | int >= 1
  retries: 60
  delay: 5

- name: "vllm_sr | litellm | Register '{{ vllm_sr_litellm_model_name }}' virtual model"
  ansible.builtin.command:
    cmd: >-
      kubectl exec -i -n {{ vllm_sr_litellm_namespace }}
      deploy/litellm -c litellm -- python -
    stdin: "{{ lookup('template', 'register-router-litellm.py.j2') }}"
  environment:
    KUBECONFIG: "{{ kubernetes_kubeconfig | default(omit) }}"
  vars:
    reg_model_name: "{{ vllm_sr_litellm_model_name }}"
    reg_api_base: "http://{{ _vllm_sr_gw_addr }}/v1"
    reg_trigger_model: "{{ vllm_sr_router_trigger_model }}"
  register: _sr_reg
  changed_when: "'registered' in (_sr_reg.stdout | default(''))"
  failed_when: _sr_reg.rc != 0

- name: "vllm_sr | litellm | Registration result"
  ansible.builtin.debug:
    msg: "{{ _sr_reg.stdout_lines | default([]) }}"
