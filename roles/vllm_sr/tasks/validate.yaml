---
# =============================================================================
# vLLM Semantic Router — validate (read-only)
# =============================================================================

- name: "vllm_sr | validate | Router deployment ready"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ vllm_sr_namespace }}"
    label_selectors:
      - "app.kubernetes.io/name=semantic-router"
      - "app.kubernetes.io/component=router"   # the dashboard Deployment shares the name label
  register: _vllm_sr_val_deploy
  failed_when: >-
    (_vllm_sr_val_deploy.resources | default([]) | length == 0) or
    (_vllm_sr_val_deploy.resources[0].status.readyReplicas | default(0) | int < 1)

- name: "vllm_sr | validate | Dashboard ready and routed"
  when: vllm_sr_dashboard_enabled | bool
  block:
    - name: "vllm_sr | validate | Dashboard deployment"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ vllm_sr_namespace }}"
        label_selectors:
          - "app.kubernetes.io/name=semantic-router"
          - "app.kubernetes.io/component=dashboard"
      register: _vllm_sr_val_dash
      failed_when: >-
        (_vllm_sr_val_dash.resources | default([]) | length == 0) or
        (_vllm_sr_val_dash.resources[0].status.readyReplicas | default(0) | int < 1)

    - name: "vllm_sr | validate | Dashboard HTTPRoute accepted"
      kubernetes.core.k8s_info:
        api_version: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        name: "{{ vllm_sr_release_name }}-dashboard"
        namespace: "{{ vllm_sr_namespace }}"
      register: _vllm_sr_val_dash_route
      failed_when: >-
        (_vllm_sr_val_dash_route.resources | default([]) | length == 0) or
        not ((_vllm_sr_val_dash_route.resources[0].status.parents | default([]) | map(attribute='conditions') | flatten
              | selectattr('type', 'equalto', 'Accepted') | selectattr('status', 'equalto', 'True') | list) | length > 0)
      when: vllm_sr_gateway_publish | bool

    # Without the exemption the gateway's JWT policy answers 401 before the
    # dashboard's own login page loads.
    - name: "vllm_sr | validate | Dashboard exempt from gateway auth"
      kubernetes.core.k8s_info:
        api_version: gateway.envoyproxy.io/v1alpha1
        kind: SecurityPolicy
        name: vllm-sr-dashboard-no-auth
        namespace: "{{ vllm_sr_namespace }}"
      register: _vllm_sr_val_dash_exempt
      failed_when: _vllm_sr_val_dash_exempt.resources | default([]) | length == 0
      when: vllm_sr_gateway_publish | bool

- name: "vllm_sr | validate | Read the Envoy Gateway configuration"
  kubernetes.core.k8s_info:
    kind: ConfigMap
    name: envoy-gateway-config
    namespace: "{{ envoy_gateway_namespace | default('envoy-gateway-system') }}"
  register: _vllm_sr_val_eg_cfg

- name: "vllm_sr | validate | EnvoyPatchPolicy enabled on Envoy Gateway"
  vars:
    _vllm_sr_eg_config: >-
      {{ ((_vllm_sr_val_eg_cfg.resources | default([]) | first | default({})).data | default({})).get('envoy-gateway.yaml', '{}')
         | from_yaml | default({}, true) }}
  ansible.builtin.assert:
    that: (_vllm_sr_eg_config.extensionApis | default({})).enableEnvoyPatchPolicy | default(false) | bool
    fail_msg: >-
      EnvoyPatchPolicy is not enabled on the Envoy Gateway in {{ envoy_gateway_namespace | default('envoy-gateway-system') }},
      so the semantic router's ext_proc filter is not applied. The kserve role enables it with the AI Gateway
      extension: re-run install inference.
    quiet: true

- name: "vllm_sr | validate | Semantic-router gateway programmed"
  kubernetes.core.k8s_info:
    api_version: gateway.networking.k8s.io/v1
    kind: Gateway
    name: "{{ vllm_sr_gateway_name }}"
    namespace: "{{ vllm_sr_gateway_namespace }}"
  register: _vllm_sr_val_gw
  failed_when: >-
    (_vllm_sr_val_gw.resources | default([]) | length == 0) or
    (_vllm_sr_val_gw.resources[0].status.addresses | default([]) | length == 0)

- name: "vllm_sr | validate | ext_proc EnvoyPatchPolicy present"
  kubernetes.core.k8s_info:
    api_version: gateway.envoyproxy.io/v1alpha1
    kind: EnvoyPatchPolicy
    name: "{{ vllm_sr_gateway_name }}-extproc"
    namespace: "{{ vllm_sr_gateway_namespace }}"
  register: _vllm_sr_val_epp
  failed_when: _vllm_sr_val_epp.resources | default([]) | length == 0

- name: "vllm_sr | validate | AIGatewayRoutes present for routed models"
  kubernetes.core.k8s_info:
    api_version: aigateway.envoyproxy.io/v1beta1
    kind: AIGatewayRoute
    namespace: "{{ vllm_sr_gateway_namespace }}"
    label_selectors:
      - "app.kubernetes.io/part-of=vllm-sr"
  register: _vllm_sr_val_routes

- name: "vllm_sr | validate | Summary"
  ansible.builtin.debug:
    msg:
      - "Router ready:       OK"
      - "Gateway programmed: OK"
      - "ext_proc policy:    OK"
      - "AIGatewayRoutes:    {{ _vllm_sr_val_routes.resources | default([]) | length }}"
      - "Dashboard:          {{ ('OK (https://' ~ vllm_sr_dashboard_hostname ~ '/)' if vllm_sr_gateway_publish | bool else 'OK (not published)') if vllm_sr_dashboard_enabled | bool else 'off' }}"
      - "Exposure mode:      {{ vllm_sr_expose }}"
