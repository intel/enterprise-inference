---
# =============================================================================
# vLLM Semantic Router — teardown (removes what install created; safe when absent)
# =============================================================================

- name: "vllm_sr | teardown | Check the cluster API"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ vllm_sr_namespace }}"
  register: _vllm_sr_td_api
  failed_when: false

# No cluster (for example a failed install): nothing to remove, and the reset must still run
- name: "vllm_sr | teardown | No cluster — skip"
  when: _vllm_sr_td_api.resources is not defined
  ansible.builtin.meta: end_role

# kubernetes.core.k8s_exec takes no stdin, so the script is piped in through kubectl.
- name: "vllm_sr | teardown | Deregister the LiteLLM virtual model"
  when: vllm_sr_expose in ['litellm', 'both']
  ansible.builtin.command:
    cmd: >-
      kubectl exec -i -n {{ vllm_sr_litellm_namespace }}
      deploy/litellm -c litellm -- python -
    stdin: |
      import json, os, urllib.request, urllib.error
      BASE="http://127.0.0.1:4000"; MODEL="{{ vllm_sr_litellm_model_name }}"
      KEY=os.environ.get("PROXY_MASTER_KEY") or os.environ.get("LITELLM_MASTER_KEY") or ""
      def call(m,p,b=None):
          d=json.dumps(b).encode() if b is not None else None
          r=urllib.request.Request(BASE+p,data=d,method=m)
          r.add_header("Authorization","Bearer "+KEY); r.add_header("Content-Type","application/json")
          try:
              with urllib.request.urlopen(r,timeout=20) as x: return x.read().decode()
          except Exception: return "{}"
      try: data=json.loads(call("GET","/model/info"))
      except Exception: data={}
      for e in (data.get("data") or []):
          if e.get("model_name")==MODEL:
              i=(e.get("model_info") or {}).get("id")
              if i: call("POST","/model/delete",{"id":i})
      print("deregistered", MODEL)
  environment:
    KUBECONFIG: "{{ kubernetes_kubeconfig | default(ansible_env.HOME + '/.kube/config') }}"
  register: _vllm_sr_dereg
  changed_when: false
  failed_when: false

- name: "vllm_sr | teardown | Remove dashboard HTTPRoute"
  kubernetes.core.k8s:
    state: absent
    api_version: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    name: "{{ vllm_sr_release_name }}-dashboard"
    namespace: "{{ vllm_sr_namespace }}"
  failed_when: false

- name: "vllm_sr | teardown | Drop the dashboard auth exemption"
  kubernetes.core.k8s:
    state: absent
    api_version: gateway.envoyproxy.io/v1alpha1
    kind: SecurityPolicy
    name: vllm-sr-dashboard-no-auth
    namespace: "{{ vllm_sr_namespace }}"
  failed_when: false

- name: "vllm_sr | teardown | Resolve the routed models"
  ansible.builtin.include_tasks: models.yaml

- name: "vllm_sr | teardown | Remove Envoy AI Gateway resources"
  kubernetes.core.k8s:
    state: absent
    definition: "{{ lookup('template', 'gwapi-resources.yaml.j2') }}"
  failed_when: false

- name: "vllm_sr | teardown | Uninstall router Helm release"
  kubernetes.core.helm:
    name: "{{ vllm_sr_release_name }}"
    release_namespace: "{{ vllm_sr_namespace }}"
    state: absent
    wait: false
  failed_when: false

- name: "vllm_sr | teardown | Remove namespace"
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ vllm_sr_namespace }}"
    state: absent
  failed_when: false

- name: "vllm_sr | teardown | Complete"
  ansible.builtin.debug:
    msg: "vLLM Semantic Router removed from '{{ vllm_sr_namespace }}'."
