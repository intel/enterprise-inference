---
# Platform gateway contract (ai-solutions envoy_gateway). A solution publishes
# its hosts in a ListenerSet in its own namespace; only these values are shared.
gateway_name: "eg-gateway"
gateway_namespace: "envoy-gateway-system"
gateway_tls_mode: "selfsigned"                # custom: use the platform certificate
gateway_tls_secret_name: "gateway-tls"
gateway_issuer: "gateway-issuer"              # ClusterIssuer (selfsigned mode)
gateway_listeners_label_key: "gateway.ai-solutions.intel.com/listeners"
gateway_listeners_label_value: "allowed"
gateway_hostnames_annotation: "gateway.ai-solutions.intel.com/hostnames"

# Inputs: ListenerSet name, owning namespace and [{name, hostname}].
gateway_listener_name: ""
gateway_listener_namespace: ""
gateway_listener_hosts: []

_gl_secret: "{{ gateway_listener_name }}-listener-tls"
_gl_cert_ref: >-
  {{ {'kind': 'Secret', 'name': _gl_secret} if gateway_tls_mode == 'selfsigned'
     else {'kind': 'Secret', 'name': gateway_tls_secret_name, 'namespace': gateway_namespace} }}
