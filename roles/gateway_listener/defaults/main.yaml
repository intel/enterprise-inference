---
# Platform gateway contract (ai-solutions envoy_gateway). Subdomain mode: a
# ListenerSet in the solution's namespace. Path mode: a path grant on the apex
# host. Only these values are shared.
gateway_name: "eg-gateway"
gateway_namespace: "envoy-gateway-system"
gateway_tls_mode: "selfsigned"                # custom: use the platform certificate
gateway_tls_secret_name: "gateway-tls"
gateway_issuer: "gateway-issuer"              # ClusterIssuer (selfsigned mode)
gateway_listeners_label_key: "gateway.enterprise-ai/allow-listenersets"
gateway_listeners_label_value: "true"
gateway_hostnames_annotation: "gateway.enterprise-ai/hostnames"
gateway_apex_label_key: "gateway.enterprise-ai/allow-apex-routes"
gateway_apex_label_value: "true"
gateway_path_grants_configmap: "gateway-path-grants"   # key: path without '/' ('/'->'.'), value: namespace

# Inputs: name, owning namespace, [{name, hostname}] for subdomain mode and the
# apex path for path mode; gateway_listener_mode overrides routing_mode. In path
# mode services share one origin: scope cookies to the path (APIs drop them).
gateway_listener_name: ""
gateway_listener_namespace: ""
gateway_listener_hosts: []
gateway_listener_path: ""
gateway_listener_mode: ""
_gl_mode: "{{ gateway_listener_mode | default(routing_mode | default('subdomain'), true) }}"
_gl_key: "{{ '_root' if gateway_listener_path == '/' else gateway_listener_path[1:] | replace('/', '.') }}"

_gl_secret: "{{ gateway_listener_name }}-listener-tls"
_gl_cert_ref: >-
  {{ {'kind': 'Secret', 'name': _gl_secret} if gateway_tls_mode == 'selfsigned'
     else {'kind': 'Secret', 'name': gateway_tls_secret_name, 'namespace': gateway_namespace} }}
