---
# =============================================================================
# gateway_listener — grant an apex path to a namespace (path mode)
# =============================================================================
# Inputs: see defaults (gateway_listener_namespace, gateway_listener_path).

- name: "gateway_listener | apex path | Validate {{ gateway_listener_path }}"
  ansible.builtin.assert:
    that: gateway_listener_path is match('^/([a-z0-9][a-z0-9_-]*(/[a-z0-9][a-z0-9_-]*)*)?$')
    fail_msg: "Invalid apex path '{{ gateway_listener_path }}' (lowercase segments, no trailing '/')."
    quiet: true

- name: "gateway_listener | apex path | Read path grants"
  kubernetes.core.k8s_info:
    kind: ConfigMap
    name: "{{ gateway_path_grants_configmap }}"
    namespace: "{{ gateway_namespace }}"
  register: _gl_grants

- name: "gateway_listener | apex path | Refuse a path granted to another namespace"
  vars:
    _owner: "{{ ((_gl_grants.resources | first | default({})).data | default({})).get(_gl_key, '') }}"
  ansible.builtin.assert:
    that:
      - _gl_grants.resources | length > 0
      - _owner in ['', gateway_listener_namespace]
    fail_msg: >-
      {{ 'Path grants ConfigMap missing; the platform gateway must be installed first.'
         if _gl_grants.resources | length == 0
         else 'Path ' ~ gateway_listener_path ~ ' is already granted to namespace ' ~ _owner ~ '.' }}
    quiet: true

- name: "gateway_listener | apex path | Grant {{ gateway_listener_path ~ ' to ' ~ gateway_listener_namespace }}"
  kubernetes.core.k8s:
    state: patched
    kind: ConfigMap
    name: "{{ gateway_path_grants_configmap }}"
    namespace: "{{ gateway_namespace }}"
    definition:
      data: "{{ {_gl_key: gateway_listener_namespace} }}"

- name: "gateway_listener | apex path | Allow on the apex listener: {{ gateway_listener_namespace }}"
  kubernetes.core.k8s:
    state: patched
    kind: Namespace
    name: "{{ gateway_listener_namespace }}"
    definition:
      metadata:
        labels: "{{ {gateway_apex_label_key: gateway_apex_label_value} }}"
