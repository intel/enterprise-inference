---
# =============================================================================
# gateway_listener — publish a service in the current routing mode
# =============================================================================
# subdomain: its hosts on their own listeners (listenerset.yaml)
# path:      a path on the apex host (apex_path.yaml)
# The other mode's objects are removed, so switching modes leaves nothing
# stale. Sets gateway_listener_ref (route parent) and gateway_listener_publish
# {mode, host, relative_path, frontend_url}. Remove with tasks_from: remove.yaml.

- name: "gateway_listener | {{ gateway_listener_name ~ ' (' ~ _gl_mode ~ ')' }}"
  ansible.builtin.include_tasks: "{{ _gl_file }}"
  loop: "{{ ['listenerset.yaml', 'apex_path_remove.yaml'] if _gl_mode == 'subdomain'
            else ['apex_path.yaml', 'listenerset_remove.yaml'] }}"
  loop_control:
    loop_var: _gl_file      # included files loop over item themselves

- name: "gateway_listener | Route parent for {{ gateway_listener_name }}"
  vars:
    _host: "{{ gateway_listener_hosts[0].hostname if _gl_mode == 'subdomain' else base_domain_name }}"
  ansible.builtin.set_fact:
    gateway_listener_ref: >-
      {{ gateway_listener_ref | combine({'sectionName': gateway_listener_hosts[0].name}) if _gl_mode == 'subdomain'
         else {'name': gateway_name, 'namespace': gateway_namespace, 'sectionName': 'https-apex'} }}
    gateway_listener_publish:
      mode: "{{ _gl_mode }}"
      host: "{{ _host }}"
      relative_path: "{{ '/' if _gl_mode == 'subdomain' else gateway_listener_path }}"
      frontend_url: "https://{{ _host }}{{ '' if _gl_mode == 'subdomain' else gateway_listener_path }}"
