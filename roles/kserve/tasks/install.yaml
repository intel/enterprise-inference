---
# =============================================================================
# KServe installation — supports Standard, Knative & LLMIsvc add-on
# Handles both fresh install and upgrade (version-aware).
# =============================================================================

# ── 0. Validate deploy mode ──────────────────────────────────────────────────

- name: "kserve | Validate deploy mode"
  ansible.builtin.assert:
    that: kserve_deploy_mode in ['Standard', 'Knative']
    fail_msg: >-
      Invalid kserve_deploy_mode '{{ kserve_deploy_mode }}'.
      Valid values: Standard, Knative.
    success_msg: "Deploy mode: {{ kserve_deploy_mode }}"

# Gateway class, controller namespace and version follow the platform Gateway.
- name: "kserve | Load the platform Envoy Gateway"
  ansible.builtin.include_role:
    name: gateway
    tasks_from: platform.yaml
  when: kserve_enable_gateway_api | bool or kserve_llmisvc_enabled | bool

# AI integration on Envoy Gateway, decided from its live configuration:
# present (already configured: nothing to do), apply (our release, or an existing
# one with envoy_gateway_configure_existing) or skip (a notice; never stops).
- name: "kserve | Read the Envoy Gateway configuration"
  kubernetes.core.k8s_info:
    kind: ConfigMap
    name: envoy-gateway-config
    namespace: "{{ kserve_envoy_gateway_namespace }}"
  register: _kserve_eg_cfg
  when: kserve_llmisvc_enabled | bool and (ai_gateway_provider | default('envoy')) == 'envoy'

- name: "kserve | Plan the Envoy Gateway AI integration"
  vars:
    _want: "{{ kserve_envoy_ai_controller_service }}.{{ kserve_envoy_ai_controller_namespace }}.svc.cluster.local"
    _cfg: >-
      {{ ((_kserve_eg_cfg.resources | default([]) | first | default({})).data | default({})).get('envoy-gateway.yaml', '{}')
         | from_yaml | default({}, true) }}
    _has: "{{ (((_cfg.extensionManager | default({})).service | default({})).fqdn | default({})).hostname | default('') == _want }}"
  ansible.builtin.set_fact:
    _kserve_eg_ai: >-
      {{ 'off' if not (kserve_llmisvc_enabled | bool and (ai_gateway_provider | default('envoy')) == 'envoy')
         else 'present' if _has | bool
         else 'apply' if gateway_platform.controller_managed | bool
              or (gateway_platform.configure_existing | default(false) | bool and gateway_platform.release)
         else 'skip' }}

# ── 1. cert-manager (installed by cert_manager role — just verify it's up) ───

- name: "kserve | Verify cert-manager is running"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: cert-manager
    namespace: "{{ kserve_certmanager_namespace }}"
  register: _certmgr_check
  failed_when: _certmgr_check.resources | length == 0

- name: "kserve | Wait for cert-manager webhook"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: cert-manager-webhook
    namespace: "{{ kserve_certmanager_namespace }}"
  register: _kserve_cm_webhook
  until:
    - _kserve_cm_webhook.resources | length > 0
    - _kserve_cm_webhook.resources[0].status.conditions | default([]) | selectattr('type','eq','Available') | selectattr('status','eq','True') | list | length > 0
  retries: 60
  delay: 5

# ── 2. Knative mode prerequisites (Istio + Knative Serving) ─────────────────

- name: "kserve | Knative mode — install Istio if missing"
  when: kserve_deploy_mode == 'Knative'
  block:
    - name: "kserve | Check Istio installed"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: istiod
        namespace: "{{ kserve_istio_namespace }}"
      register: _istio_check

    - name: "kserve | Install Istio via Helm (istio-base)"
      kubernetes.core.helm:
        name: istio-base
        chart_ref: "{{ kserve_istio_helm_repo }}/base"
        chart_version: "{{ kserve_istio_version }}"
        release_namespace: "{{ kserve_istio_namespace }}"
        create_namespace: true
        wait: true
      when: _istio_check.resources | length == 0
      register: _kserve_helm_istio_base
      until: _kserve_helm_istio_base is succeeded
      retries: "{{ helm_retries | default(3) }}"
      delay: 15

    - name: "kserve | Install Istio (istiod)"
      kubernetes.core.helm:
        name: istiod
        chart_ref: "{{ kserve_istio_helm_repo }}/istiod"
        chart_version: "{{ kserve_istio_version }}"
        release_namespace: "{{ kserve_istio_namespace }}"
        wait: true
      when: _istio_check.resources | length == 0
      register: _kserve_helm_istiod
      until: _kserve_helm_istiod is succeeded
      retries: "{{ helm_retries | default(3) }}"
      delay: 15

    - name: "kserve | Wait for istiod"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: istiod
        namespace: "{{ kserve_istio_namespace }}"
      register: _kserve_istiod
      until:
        - _kserve_istiod.resources | length > 0
        - _kserve_istiod.resources[0].status.conditions | default([]) | selectattr('type','eq','Available') | selectattr('status','eq','True') | list | length > 0
      retries: 60
      delay: 5

- name: "kserve | Knative mode — install Knative Serving"
  when: kserve_deploy_mode == 'Knative'
  block:
    - name: "kserve | Check Knative Serving installed"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: controller
        namespace: "{{ kserve_knative_namespace }}"
      register: _knative_check

    - name: "kserve | Install Knative Serving CRDs"
      kubernetes.core.k8s:
        src: "https://github.com/knative/serving/releases/download/knative-v{{ kserve_knative_version }}/serving-crds.yaml"
        state: present
      when: _knative_check.resources | length == 0

    - name: "kserve | Install Knative Serving core"
      kubernetes.core.k8s:
        src: "https://github.com/knative/serving/releases/download/knative-v{{ kserve_knative_version }}/serving-core.yaml"
        state: present
      when: _knative_check.resources | length == 0

    - name: "kserve | Install Knative Istio controller"
      kubernetes.core.k8s:
        src: "https://github.com/knative/net-istio/releases/download/knative-v{{ kserve_knative_version }}/net-istio.yaml"
        state: present
      when: _knative_check.resources | length == 0

    - name: "kserve | Wait for Knative Serving controller"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: controller
        namespace: "{{ kserve_knative_namespace }}"
      register: _kserve_knative_ctrl
      until:
        - _kserve_knative_ctrl.resources | length > 0
        - _kserve_knative_ctrl.resources[0].status.conditions | default([]) | selectattr('type','eq','Available') | selectattr('status','eq','True') | list | length > 0
      retries: 60
      delay: 5

# ── 3. KServe core (all modes) ──────────────────────────────────────────────

- name: "kserve | Check for existing KServe Helm release"
  kubernetes.core.helm_info:
    name: kserve-resources
    release_namespace: "{{ kserve_namespace }}"
  register: _kserve_release
  failed_when: false

- name: "kserve | Detect version"
  ansible.builtin.set_fact:
    _kserve_installed_chart: "{{ _kserve_installed }}"
    _kserve_version: "{{ _kserve_installed_version if _kserve_newer | bool else kserve_version }}"
    _kserve_target_chart: "kserve-resources-v{{ _kserve_installed_version if _kserve_newer | bool else kserve_version }}"
  vars:
    _kserve_installed: "{{ _kserve_release.status.chart | default('') }}"
    _kserve_installed_version: "{{ _kserve_installed | regex_replace('^kserve-resources-v', '') }}"
    _kserve_newer: "{{ _kserve_installed | length > 0 and _kserve_installed_version is version(kserve_version, '>') }}"

- name: "kserve | Status"
  ansible.builtin.debug:
    msg: >-
      {{ 'Upgrading' if _kserve_installed_chart and _kserve_installed_chart != _kserve_target_chart
         else ('Already at v' ~ _kserve_version ~ ' — reconciling') if _kserve_installed_chart
         else 'Fresh install' }}
      KServe v{{ _kserve_version }}
      {{ ('(from ' ~ _kserve_installed_chart ~ ')') if _kserve_installed_chart and _kserve_installed_chart != _kserve_target_chart else '' }}
      {{ '(v' ~ kserve_version ~ ' selected; never downgrades)' if _kserve_version != kserve_version else '' }}

- name: "kserve | Label namespace — Istio"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ kserve_namespace }}"
        labels: "{{ istio_namespace_labels | default({'istio.io/dataplane-mode': 'ambient'}) }}"
  when: istio_enabled | default(false) | bool

# Host-network apiserver (no mesh identity) can't reach the KServe + LLMISVC admission
# webhooks under mesh-wide STRICT; open only their port, rest of each pod stays STRICT.
- name: "kserve | Allow apiserver to reach webhooks (port-level mTLS)"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: security.istio.io/v1
      kind: PeerAuthentication
      metadata:
        name: "{{ item.name }}"
        namespace: "{{ kserve_namespace }}"
      spec:
        selector:
          matchLabels:
            control-plane: "{{ item.control_plane }}"
        mtls:
          mode: STRICT
        portLevelMtls: "{{ {'9443': {'mode': 'PERMISSIVE'}} }}"
  loop:
    - name: allow-webhook
      control_plane: kserve-controller-manager
    - name: allow-webhook-llmisvc
      control_plane: llmisvc-controller-manager
  loop_control:
    label: "{{ item.name }}"
  when: istio_enabled | default(false) | bool

- name: "kserve | Label namespace — PSS"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ kserve_namespace }}"
        labels:
          pod-security.kubernetes.io/enforce: "baseline"
          pod-security.kubernetes.io/audit: "restricted"
          pod-security.kubernetes.io/warn: "restricted"
  when: enforce_pss | default(false) | bool

- name: "kserve | Install core"
  when: >-
    _kserve_release.status is not defined or
    _kserve_release.status is none or
    _kserve_installed_chart != _kserve_target_chart
  block:
    - name: "kserve | Render the KServe CRDs"
      kubernetes.core.helm_template:
        chart_ref: "{{ kserve_helm_repo }}/kserve-crd"
        chart_version: "v{{ _kserve_version }}"
      register: _kserve_crd_tpl
      until: _kserve_crd_tpl is succeeded
      retries: "{{ helm_retries | default(3) }}"
      delay: 15

    - name: "kserve | Select the rendered CRDs"
      ansible.builtin.set_fact:
        _kserve_crds: >-
          {{ _kserve_crd_tpl.stdout | from_yaml_all | select
             | selectattr('kind', 'equalto', 'CustomResourceDefinition') | list }}

    - name: "kserve | Check the chart rendered CRDs"
      ansible.builtin.assert:
        that: _kserve_crds | length > 0
        fail_msg: "kserve-crd v{{ _kserve_version }} rendered no CustomResourceDefinition; check the chart output."
        quiet: true

    # Server-side: the CRDs are too large for the last-applied annotation. This role owns the
    # KServe CRDs cluster-wide (this step runs only to install or upgrade its kserve-resources
    # release); force_conflicts takes over the fields an earlier `kubectl apply --server-side` owns.
    - name: "kserve | Apply the KServe CRDs (server-side)"
      kubernetes.core.k8s:
        state: present
        definition: "{{ _kserve_crds }}"
        apply: true
        server_side_apply:
          field_manager: ai-solutions-kserve
          force_conflicts: true
      register: _kserve_crd
      until: _kserve_crd is succeeded
      retries: "{{ helm_retries | default(3) }}"
      delay: 15

    # Helm fails with "no matches for kind" on a CRD that is not served yet.
    - name: "kserve | Wait for the KServe CRDs to be Established"
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: "{{ item.metadata.name }}"
        wait: true
        wait_condition:
          type: Established
          status: "True"
        wait_timeout: 120
      loop: "{{ _kserve_crds }}"
      loop_control:
        label: "{{ item.metadata.name }}"

    - name: "kserve | Install KServe resources via Helm"
      kubernetes.core.helm:
        name: kserve-resources
        chart_ref: "{{ kserve_helm_repo }}/kserve-resources"
        chart_version: "v{{ _kserve_version }}"
        release_namespace: "{{ kserve_namespace }}"
        create_namespace: true
        wait: true
        set_values:
          - value: "kserve.controller.deploymentMode={{ kserve_deploy_mode }}"
        values:
          kserve:
            controller:
              affinity: "{{ _platform_affinity | default({}) }}"
      register: _kserve_helm_resources
      until: _kserve_helm_resources is succeeded
      retries: "{{ helm_retries | default(3) }}"
      delay: 15

    - name: "kserve | Detect pre-existing LLMIsvc runtime configs"
      # Re-runs must not wipe LLMInferenceServiceConfig CRs already installed
      # by a prior llmisvc enablement. If the kserve-llmisvc-resources helm
      # release already exists, the CRDs are present and we can safely render
      # llmisvcConfigs in the first runtime-configs install pass.
      kubernetes.core.helm_info:
        name: kserve-llmisvc-resources
        release_namespace: "{{ kserve_namespace }}"
      register: _llmisvc_release_precheck
      failed_when: false

    # An older llmisvc webhook rejects the new presets; the LLMIsvc block
    # upgrades it first and installs the runtime configs after.
    - name: "kserve | Compute initial llmisvcConfigs enablement"
      ansible.builtin.set_fact:
        _kserve_initial_llmisvc_configs: "{{ _llmisvc_exists | bool }}"
        _kserve_defer_runtime_configs: >-
          {{ _llmisvc_exists | bool
             and _llmisvc_release_precheck.status.chart | default('') != 'kserve-llmisvc-resources-v' ~ _kserve_version }}
      vars:
        _llmisvc_exists: "{{ _llmisvc_release_precheck.status is defined and _llmisvc_release_precheck.status is not none }}"

    - name: "kserve | Runtime configs kept until the LLMIsvc add-on is upgraded"
      ansible.builtin.debug:
        msg: >-
          {{ _llmisvc_release_precheck.status.chart }} is installed but kserve_llmisvc_enabled is false, so
          kserve-runtime-configs stays at its current version; run with kserve_llmisvc_enabled: true to upgrade both.
      when: _kserve_defer_runtime_configs | bool and not kserve_llmisvc_enabled | bool

    - name: "kserve | Install KServe runtime configs via Helm"
      when: not _kserve_defer_runtime_configs | bool
      kubernetes.core.helm:
        name: kserve-runtime-configs
        chart_ref: "{{ kserve_helm_repo }}/kserve-runtime-configs"
        chart_version: "v{{ _kserve_version }}"
        release_namespace: "{{ kserve_namespace }}"
        wait: true
        set_values:
          - value: "kserve.servingruntime.enabled=true"
          - value: "kserve.llmisvcConfigs.enabled={{ _kserve_initial_llmisvc_configs | bool | string | lower }}"
      register: _kserve_helm_runtime_configs
      until: _kserve_helm_runtime_configs is succeeded
      retries: "{{ helm_retries | default(3) }}"
      delay: 15

    - name: "kserve | Wait for controller"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: kserve-controller-manager
        namespace: "{{ kserve_namespace }}"
      register: _kserve_ctrl
      until:
        - _kserve_ctrl.resources | length > 0
        - _kserve_ctrl.resources[0].status.conditions | default([]) | selectattr('type','eq','Available') | selectattr('status','eq','True') | list | length > 0
      retries: 60
      delay: 5

    # -- Enable Gateway API ingress (Standard mode + Envoy Gateway) --
    - name: "kserve | Configure Gateway API ingress"
      kubernetes.core.k8s_json_patch:
        api_version: v1
        kind: ConfigMap
        name: inferenceservice-config
        namespace: "{{ kserve_namespace }}"
        patch:
          - op: replace
            path: /data/ingress
            value: >-
              {
                "enableGatewayApi": {{ kserve_enable_gateway_api | to_json }},
                "kserveIngressGateway": "{{ kserve_gateway_namespace }}/{{ kserve_gateway_name }}",
                "ingressGateway": "{{ kserve_gateway_namespace }}/{{ kserve_gateway_name }}",
                "ingressClassName": "{{ kserve_ingress_class }}",
                "ingressDomain": "{{ kserve_ingress_domain }}",
                "domainTemplate": "{{ '{{ .Name }}-{{ .Namespace }}.{{ .IngressDomain }}' }}",
                "pathTemplate": "",
                "urlScheme": "http",
                "disableIstioVirtualHost": true,
                "disableIngressCreation": false,
                "additionalIngressDomains": []
              }
      when: kserve_enable_gateway_api | bool

    # Same as `kubectl rollout restart`; waits so later steps do not hit its webhook mid-restart.
    - name: "kserve | Restart controller to pick up ingress config"
      kubernetes.core.k8s:
        api_version: apps/v1
        kind: Deployment
        name: kserve-controller-manager
        namespace: "{{ kserve_namespace }}"
        state: patched
        definition:
          spec:
            template:
              metadata:
                annotations:
                  kubectl.kubernetes.io/restartedAt: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
        wait: true
        wait_timeout: 300
      when: kserve_enable_gateway_api | bool

# ── 4. LLMIsvc add-on (optional) ────────────────────────────────────────────

- name: "kserve | LLMIsvc add-on"
  when: kserve_llmisvc_enabled | bool
  block:
    # -- LWS (LeaderWorkerSet) operator --
    - name: "kserve | LLMIsvc — check LWS operator"
      kubernetes.core.helm_info:
        name: lws
        release_namespace: "{{ kserve_lws_namespace }}"
      register: _lws_check
      failed_when: false

    - name: "kserve | LLMIsvc — label LWS namespace — Istio"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ kserve_lws_namespace }}"
            labels: "{{ istio_namespace_labels | default({'istio.io/dataplane-mode': 'ambient'}) }}"
      when:
        - istio_enabled | default(false) | bool
        - _lws_check.status is not defined or _lws_check.status is none

    - name: "kserve | LLMIsvc — label LWS namespace — PSS"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ kserve_lws_namespace }}"
            labels:
              pod-security.kubernetes.io/enforce: "baseline"
              pod-security.kubernetes.io/audit: "restricted"
              pod-security.kubernetes.io/warn: "restricted"
      when: _lws_check.status is not defined or _lws_check.status is none

    - name: "kserve | LLMIsvc — install LWS operator via Helm"
      kubernetes.core.helm:
        name: lws
        chart_ref: "{{ kserve_lws_helm_repo }}"
        chart_version: "{{ kserve_lws_version }}"
        release_namespace: "{{ kserve_lws_namespace }}"
        create_namespace: true
        wait: true
        timeout: "5m0s"
      when: _lws_check.status is not defined or _lws_check.status is none
      register: _kserve_helm_lws
      until: _kserve_helm_lws is succeeded
      retries: "{{ helm_retries | default(3) }}"
      delay: 15

    - name: "kserve | LLMIsvc — wait for LWS operator"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: lws-controller-manager
        namespace: "{{ kserve_lws_namespace }}"
      register: _kserve_lws
      until:
        - _kserve_lws.resources | length > 0
        - _kserve_lws.resources[0].status.conditions | default([]) | selectattr('type','eq','Available') | selectattr('status','eq','True') | list | length > 0
      retries: 60
      delay: 5

    # Host-network apiserver (no mesh identity) can't reach the LWS admission webhook
    # under mesh-wide STRICT; open only its port, rest of the pod stays STRICT.
    - name: "kserve | LLMIsvc — allow apiserver to reach LWS webhook (port-level mTLS)"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: security.istio.io/v1
          kind: PeerAuthentication
          metadata:
            name: allow-webhook
            namespace: "{{ kserve_lws_namespace }}"
          spec:
            selector:
              matchLabels:
                control-plane: controller-manager
            mtls:
              mode: STRICT
            portLevelMtls: "{{ {'9443': {'mode': 'PERMISSIVE'}} }}"
      when: istio_enabled | default(false) | bool

    # -- Verify Envoy Gateway prerequisites --
    - name: "kserve | LLMIsvc — verify Envoy Gateway is running"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ kserve_envoy_gateway_namespace }}"
        label_selectors: [control-plane=envoy-gateway]
      register: _eg_check
      failed_when: _eg_check.resources | length == 0

    # Envoy AI Gateway controller only exists when it is the selected provider.
    # With ai_gateway_provider=agentgateway the AI-aware data plane is
    # agentgateway (its own control plane); skip this check.
    - name: "kserve | LLMIsvc — verify Envoy AI Gateway is running"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ kserve_envoy_ai_controller_namespace }}"
      register: _eag_check
      failed_when: _eag_check.resources | length == 0
      when: (ai_gateway_provider | default('envoy')) == 'envoy'

    # -- Check for existing LLMIsvc release --
    - name: "kserve | LLMIsvc — check existing release"
      kubernetes.core.helm_info:
        name: kserve-llmisvc-resources
        release_namespace: "{{ kserve_namespace }}"
      register: _llmisvc_release
      failed_when: false

    - name: "kserve | LLMIsvc — detect version change"
      ansible.builtin.set_fact:
        _llmisvc_needs_install: >-
          {{ (_llmisvc_release.status is not defined or _llmisvc_release.status is none)
             or (_llmisvc_release.status.chart | default('') != 'kserve-llmisvc-resources-v' ~ _kserve_version) }}

    # -- Install LLMIsvc CRDs + controller --
    # The core pass applies this shared CRD; from 0.21 kserve-llmisvc-crd
    # renders it unless another release's annotation claims it.
    - name: "kserve | LLMIsvc — mark the shared storage-container CRD as core-owned"
      kubernetes.core.k8s:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: clusterstoragecontainers.serving.kserve.io
        state: patched
        definition:
          metadata:
            annotations:
              meta.helm.sh/release-name: kserve-resources
              meta.helm.sh/release-namespace: "{{ kserve_namespace }}"
      when: _llmisvc_needs_install | bool

    - name: "kserve | LLMIsvc — install CRDs via Helm"
      kubernetes.core.helm:
        name: kserve-llmisvc-crd
        chart_ref: "{{ kserve_helm_repo }}/kserve-llmisvc-crd"
        chart_version: "v{{ _kserve_version }}"
        release_namespace: "{{ kserve_namespace }}"
        wait: true
      when: _llmisvc_needs_install | bool
      register: _kserve_helm_llmisvc_crds
      until: _kserve_helm_llmisvc_crds is succeeded
      retries: "{{ helm_retries | default(3) }}"
      delay: 15

    # kserve-llmisvc-crd uses crds/ (no Helm tracking), but
    # kserve-llmisvc-resources templates the same CRDs (tracked).
    # Adopt them so Helm can import the existing resources.
    # state: patched leaves a CRD that does not exist alone.
    - name: "kserve | LLMIsvc — adopt GIE CRDs for the Helm release"
      kubernetes.core.k8s:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: "{{ item }}"
        state: patched
        definition:
          metadata:
            labels:
              app.kubernetes.io/managed-by: Helm
            annotations:
              meta.helm.sh/release-name: kserve-llmisvc-resources
              meta.helm.sh/release-namespace: "{{ kserve_namespace }}"
      loop:
        - inferencemodelrewrites.inference.networking.x-k8s.io
        - inferenceobjectives.inference.networking.x-k8s.io
        - inferencepoolimports.inference.networking.x-k8s.io
        - inferencepools.inference.networking.x-k8s.io
        - inferencepools.inference.networking.k8s.io
      when: _llmisvc_needs_install | bool

    - name: "kserve | LLMIsvc — install resources via Helm"
      kubernetes.core.helm:
        name: kserve-llmisvc-resources
        chart_ref: "{{ kserve_helm_repo }}/kserve-llmisvc-resources"
        chart_version: "v{{ _kserve_version }}"
        release_namespace: "{{ kserve_namespace }}"
        wait: true
        set_values:
          - value: "kserve.createSharedResources=false"
        values:
          kserve:
            llmisvc:
              controller:
                affinity: "{{ _platform_affinity | default({}) }}"
      when: _llmisvc_needs_install | bool
      register: _kserve_helm_llmisvc_resources
      until: _kserve_helm_llmisvc_resources is succeeded
      retries: "{{ helm_retries | default(3) }}"
      delay: 15

    - name: "kserve | LLMIsvc — wait for controller"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: llmisvc-controller-manager
        namespace: "{{ kserve_namespace }}"
      register: _kserve_llmisvc
      until:
        - _kserve_llmisvc.resources | length > 0
        - _kserve_llmisvc.resources[0].status.conditions | default([]) | selectattr('type','eq','Available') | selectattr('status','eq','True') | list | length > 0
      retries: 60
      delay: 5
      when: _llmisvc_needs_install | bool

    # -- Upgrade runtime configs to enable LLMIsvc configs (CRDs exist now) --
    # Run unconditionally within this block so re-runs also enable llmisvcConfigs.
    # On a fresh install _llmisvc_needs_install is true; on re-runs the CRDs already
    # exist so the block condition (kserve_llmisvc_enabled) is still true and we
    # must ensure the value is set correctly regardless of install vs upgrade.
    - name: "kserve | LLMIsvc — upgrade runtime configs with llmisvcConfigs"
      kubernetes.core.helm:
        name: kserve-runtime-configs
        chart_ref: "{{ kserve_helm_repo }}/kserve-runtime-configs"
        chart_version: "v{{ _kserve_version }}"
        release_namespace: "{{ kserve_namespace }}"
        wait: true
        set_values:
          - value: "kserve.servingruntime.enabled=true"
          - value: "kserve.llmisvcConfigs.enabled=true"
      register: _kserve_helm_llmisvc_configs
      until: _kserve_helm_llmisvc_configs is succeeded
      retries: "{{ helm_retries | default(3) }}"
      delay: 15

    # -- Repin the scheduler preset's llm-d images (see defaults/main.yaml) --
    # KServe 0.21's preset ships pullable images and no tokenizer sidecar.
    - name: "kserve | LLMIsvc — read scheduler preset"
      kubernetes.core.k8s_info:
        api_version: serving.kserve.io/v1alpha2
        kind: LLMInferenceServiceConfig
        name: kserve-config-llm-scheduler
        namespace: "{{ kserve_namespace }}"
      register: _kserve_scheduler_preset
      when: _kserve_version is version('0.21.0', '<')

    - name: "kserve | LLMIsvc — repin llm-d router images"
      kubernetes.core.k8s_json_patch:
        api_version: serving.kserve.io/v1alpha2
        kind: LLMInferenceServiceConfig
        name: kserve-config-llm-scheduler
        namespace: "{{ kserve_namespace }}"
        patch:
          - op: replace
            path: "/spec/router/scheduler/template/containers/{{ _container_names.index(item.name) }}/image"
            value: "{{ item.image }}"
      vars:
        _container_names: >-
          {{ _kserve_scheduler_preset.resources[0].spec.router.scheduler.template.containers
             | map(attribute='name') | list }}
      loop:
        - name: main
          image: "{{ kserve_llmisvc_epp_image }}"
        - name: tokenizer
          image: "{{ kserve_llmisvc_tokenizer_image }}"
      loop_control:
        label: "{{ item.name }} → {{ item.image }}"
      when:
        - _kserve_version is version('0.21.0', '<')
        - _kserve_scheduler_preset.resources | length > 0

    # -- Pre-pull the tokenizer sidecar image so LLMIsvc pods start fast --
    # The tokenizer image (vllm-based) is multi-GB; without pre-pulling it
    # causes long startup delays the first time a pod lands on a node.
    # The EPP image is a small Go binary (~50 MB) and is not pre-pulled.
    # Wrapped in block/always so the DaemonSet is cleaned up even on failure.
    - name: "kserve | LLMIsvc — pre-pull tokenizer image"
      when: _kserve_version is version('0.21.0', '<')
      block:
        - name: "kserve | LLMIsvc — create image pre-pull DaemonSet"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: kserve-image-prepull
                namespace: "{{ kserve_namespace }}"
                labels:
                  app.kubernetes.io/name: kserve-image-prepull
                  app.kubernetes.io/managed-by: ansible
              spec:
                selector:
                  matchLabels:
                    app.kubernetes.io/name: kserve-image-prepull
                template:
                  metadata:
                    labels:
                      app.kubernetes.io/name: kserve-image-prepull
                  spec:
                    initContainers:
                      - name: pull-tokenizer
                        image: "{{ kserve_llmisvc_tokenizer_image }}"
                        command: ["python3", "-c", ""]
                        resources:
                          requests:
                            cpu: 10m
                            memory: 16Mi
                          limits:
                            cpu: 100m
                            memory: 128Mi
                    containers:
                      - name: pause
                        image: registry.k8s.io/pause:3.10
                        resources:
                          requests:
                            cpu: 1m
                            memory: 4Mi
                          limits:
                            cpu: 10m
                            memory: 16Mi
                    terminationGracePeriodSeconds: 0
                    tolerations:
                      - operator: Exists

        - name: "kserve | LLMIsvc — wait for image pre-pull to complete"
          kubernetes.core.k8s_info:
            api_version: apps/v1
            kind: DaemonSet
            name: kserve-image-prepull
            namespace: "{{ kserve_namespace }}"
          register: _prepull_ds
          until:
            - _prepull_ds.resources | length > 0
            - (_prepull_ds.resources[0].status.numberReady | default(0)) ==
              (_prepull_ds.resources[0].status.desiredNumberScheduled | default(1))
          retries: 120
          delay: 10

      always:
        - name: "kserve | LLMIsvc — remove pre-pull DaemonSet"
          kubernetes.core.k8s:
            state: absent
            api_version: apps/v1
            kind: DaemonSet
            name: kserve-image-prepull
            namespace: "{{ kserve_namespace }}"

# ── 5. Upgrade Envoy Gateway with AI integration values ──────────────────────
#   Now that the AI Gateway controller, InferencePool CRDs, and RBAC all exist,
#   upgrade Envoy Gateway to enable the extensionManager + backendResources.
#   This is Envoy-AI-Gateway-specific wiring: it points Envoy Gateway's
#   extensionManager at the Envoy AI Gateway controller so it can resolve
#   InferencePool backends. agentgateway reads InferencePool natively through
#   its own control plane, so this step is skipped for that provider.

- name: "kserve | Envoy Gateway AI integration upgrade"
  when: _kserve_eg_ai == 'apply'
  block:
    - name: "kserve | Ensure temp directory exists"
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.cache/kserve"
        state: directory
        mode: "0700"

    - name: "kserve | Render AI Gateway values for Envoy Gateway"
      ansible.builtin.template:
        src: envoy-gateway-ai-values.yaml.j2
        dest: "{{ ansible_env.HOME }}/.cache/kserve/eg-ai-gateway-values.yaml"
        mode: "0600"

    - name: "kserve | Upgrade Envoy Gateway with AI integration"
      kubernetes.core.helm:
        name: "{{ kserve_envoy_gateway_release_name }}"
        chart_ref: "{{ kserve_envoy_gateway_helm_repo }}"
        release_namespace: "{{ kserve_envoy_gateway_namespace }}"
        chart_version: "v{{ kserve_envoy_gateway_version }}"
        # CRDs come from the platform; keeps the platform's own values.
        skip_crds: true
        reset_values: false
        reset_then_reuse_values: true
        values_files:
          - "{{ ansible_env.HOME }}/.cache/kserve/eg-ai-gateway-values.yaml"
        wait: true
        timeout: "5m0s"
      register: _kserve_helm_envoy_gateway
      until: _kserve_helm_envoy_gateway is succeeded
      retries: "{{ helm_retries | default(3) }}"
      delay: 15

    - name: "kserve | Wait for Envoy Gateway to stabilise after upgrade"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ kserve_envoy_gateway_namespace }}"
        label_selectors: [control-plane=envoy-gateway]
      register: _eg_upgraded
      until:
        - _eg_upgraded.resources | length > 0
        - _eg_upgraded.resources[0].status.conditions | default([]) | selectattr('type','eq','Available') | selectattr('status','eq','True') | list | length > 0
      retries: 60
      delay: 5

# ── 6. Summary ───────────────────────────────────────────────────────────────

- name: "kserve | Notices"
  ansible.builtin.debug:
    msg: >-
      {{ 'AI Gateway integration skipped: the Envoy Gateway in ' ~ kserve_envoy_gateway_namespace
         ~ ' was not installed by this platform' ~ ('' if gateway_platform.release else ' and is not a Helm release')
         ~ '. LLMIsvc models are not routed until it has the AI Gateway extension: set'
         ~ ' envoy_gateway_configure_existing: true, or add the values in roles/kserve/templates/envoy-gateway-ai-values.yaml.j2.'
         if _kserve_eg_ai == 'skip' else
         'Added the AI Gateway extension to the existing Envoy Gateway release ' ~ kserve_envoy_gateway_release_name
         ~ ' (version ' ~ kserve_envoy_gateway_version ~ ' unchanged).' }}
  when: _kserve_eg_ai == 'skip' or (_kserve_eg_ai == 'apply' and not gateway_platform.controller_managed | bool)

- name: "kserve | Install complete"
  ansible.builtin.debug:
    msg: >-
      KServe v{{ _kserve_version }} installed in {{ kserve_namespace }}
      (mode: {{ kserve_deploy_mode }}){{ kserve_llmisvc_enabled | bool | ternary(' + LLMIsvc add-on', '') }}.
