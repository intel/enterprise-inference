---
# =============================================================================
# KServe v0.17+ teardown — handles Standard, Knative & LLMIsvc add-on
# =============================================================================
# Removes only what this role installed: objects in kserve_owned_objects that
# carry the ownership label (see roles/inference_ownership). A KServe, LWS,
# Istio or Knative that was already on the cluster is left alone, and on
# OpenShift the OpenShift AI KServe CRDs and webhooks are never touched.

# ── Knative (only if this role installed it) ────────────────────────────────
# Knative comes from upstream manifests, not Helm, so it is removed by
# manifest — only when install labelled the namespace as ours.

- name: "kserve | Look up Knative namespace"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Namespace
    name: "{{ kserve_knative_namespace }}"
  register: _kserve_knative_ns
  when: kserve_deploy_mode == 'Knative'

- name: "kserve | Uninstall Knative (installed by this role)"
  kubernetes.core.k8s:
    src: "{{ item }}"
    state: absent
  loop:
    - "https://github.com/knative/net-istio/releases/download/knative-v{{ kserve_knative_version }}/net-istio.yaml"
    - "https://github.com/knative/serving/releases/download/knative-v{{ kserve_knative_version }}/serving-core.yaml"
    - "https://github.com/knative/serving/releases/download/knative-v{{ kserve_knative_version }}/serving-crds.yaml"
  when:
    - kserve_deploy_mode == 'Knative'
    - >-
      (_kserve_knative_ns.resources | default([]) | map(attribute='metadata.labels', default={})
       | first | default({}))['enterprise-inference/owner'] | default('') == 'kserve'

# ── Everything else this role owns: Helm releases, labelled CRDs, namespaces ─

- name: "kserve | Remove owned objects"
  ansible.builtin.include_role:
    name: inference_ownership
    tasks_from: delete
  vars:
    ownership_name: kserve
    ownership_items: "{{ kserve_owned_objects }}"

# NOTE: cert-manager teardown is handled by the cert_manager role (platform layer).
# Do not delete cert-manager resources here — other components depend on it.
