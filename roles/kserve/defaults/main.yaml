---
# =============================================================================
# KServe Role Defaults
# =============================================================================

# The platform's envoy_gateway_upgrade picks the line: latest pairs with the
# Envoy AI Gateway 1.x that KServe 0.21 is tested with. Never downgrades.
kserve_releases:
  baseline: "0.18.0"
  latest: "0.21.0"
kserve_version: "{{ kserve_releases['latest' if envoy_gateway_upgrade | default(false) | bool else 'baseline'] }}"
kserve_namespace: "kserve"
# ── OpenShift (cluster_distribution) ─────────────────────────────────────────
# OpenShift AI runs the KServe controllers, and routes every LLMInferenceService
# through its inference Gateway (kserveIngressGateway in its
# inferenceservice-config): /<namespace>/<model>/v1/... on
# openshift-ingress/openshift-ai-inference. If that Gateway does not exist, the
# installer creates it (ClusterIP, TLS with its own certificate from
# gateway-issuer, or a copy of the operator's with gateway_tls_mode: custom),
# publishes it through a passthrough Route on kserve_openshift_hostname and
# guards it with a Keycloak JWT AuthPolicy (Red Hat Connectivity Link). A
# Gateway the installer did not create is used as is and never modified.
kserve_openshift_namespace: "redhat-ods-applications"
kserve_openshift_gateway_name: "openshift-ai-inference"
kserve_openshift_gateway_namespace: "openshift-ingress"
# Empty: use the first GatewayClass served by the OpenShift gateway controller
# (openshift-default, or OpenShift AI's data-science-gateway-class).
kserve_openshift_gatewayclass: ""
kserve_openshift_hostname: "{{ inference_hostname | default('inference.' ~ base_domain_name) }}"
# Namespaces whose HTTPRoutes may attach (OpenShift AI creates them next to the model):
# the models' namespace (llm_services_namespace), which defaults to kserve_llmisvc_namespace.
kserve_openshift_route_namespaces: "{{ [llm_services_namespace | default(kserve_llmisvc_namespace | default('llm-inference'))] }}"
# gateway_tls_mode custom: the operator certificate the Gateway serves, copied from
# the platform gateway (selfsigned issues a leaf for kserve_openshift_hostname).
kserve_openshift_tls_source_secret: "{{ gateway_tls_secret_name | default('gateway-tls') }}"
kserve_openshift_tls_source_namespace: "{{ gateway_namespace | default('envoy-gateway-system') }}"
kserve_openshift_auth_enabled: "{{ (auth_type | default('jwt')) == 'jwt' }}"
# Path mode (routing_mode: path): Keycloak serves under <base>/keycloak_path, on the
# gateway and on its own Service, and issues tokens for that URL.
_kserve_keycloak_path: "{{ keycloak_path | default('/keycloak') if (routing_mode | default('subdomain')) == 'path' else '' }}"
kserve_openshift_keycloak_issuer: >-
  https://{{ base_domain_name if _kserve_keycloak_path else keycloak_hostname | default('keycloak.' ~ base_domain_name) }}{{ _kserve_keycloak_path }}/realms/{{ keycloak_realm | default('inference') }}
kserve_openshift_keycloak_jwks_url: >-
  http://keycloak-service.{{ keycloak_namespace | default('keycloak') }}.svc.cluster.local:8080{{ _kserve_keycloak_path }}/realms/{{ keycloak_realm | default('inference') }}/protocol/openid-connect/certs
kserve_openshift_keycloak_audience: "{{ keycloak_client_id | default('inference-client') }}"
kserve_helm_repo: "oci://ghcr.io/kserve/charts"
kserve_wait_timeout: "300s"

# ---------------------------------------------------------------------------
# Deployment mode — "Standard" | "Knative"
# ---------------------------------------------------------------------------
#   Standard  : Raw K8s Deployments. Requires only cert-manager.
#   Knative   : Serverless with scale-to-zero / canary rollouts.
#               Requires cert-manager + Istio + Knative Serving.
# ---------------------------------------------------------------------------
kserve_deploy_mode: "Standard"

# ---------------------------------------------------------------------------
# cert-manager (required for ALL modes)
# ---------------------------------------------------------------------------
kserve_certmanager_version: "v1.20.1"
kserve_certmanager_install: true
kserve_certmanager_namespace: "cert-manager"
kserve_certmanager_helm_repo: "oci://ghcr.io/cert-manager/cert-manager/cert-manager"

# ---------------------------------------------------------------------------
# Knative mode dependencies (ignored when kserve_deploy_mode != Knative)
# ---------------------------------------------------------------------------
kserve_istio_version: "1.27.1"
kserve_istio_namespace: "istio-system"
kserve_istio_helm_repo: "oci://ghcr.io/istio-releases/helm"
kserve_knative_version: "1.21.1"
kserve_knative_namespace: "knative-serving"

# ---------------------------------------------------------------------------
# LLMIsvc add-on (optional — installs the LLMInferenceService controller)
# ---------------------------------------------------------------------------
#   When true, the role also installs:
#   • Gateway API Inference Extension CRDs
#   • LWS (LeaderWorkerSet) operator
#   • kserve-llmisvc-crd + kserve-llmisvc-resources Helm charts
#   Envoy Gateway + Envoy AI Gateway are expected to be pre-installed
#   by the envoy_gateway / envoy_ai_gateway roles.
# ---------------------------------------------------------------------------
kserve_llmisvc_enabled: true
kserve_lws_version: "v0.8.0"
kserve_lws_namespace: "lws-system"
kserve_lws_helm_repo: "oci://registry.k8s.io/lws/charts/lws"

# ---------------------------------------------------------------------------
# llm-d router images for the kserve-config-llm-scheduler preset
# ---------------------------------------------------------------------------
#   llm-d renamed "Inference Scheduler" to "llm-d Router" in v0.9.0 and deleted
#   the old ghcr packages, so the images KServe ≤0.19 pins in its scheduler
#   preset (llm-d-inference-scheduler:v0.7.1) now 403 on pull. These are the
#   pins KServe 0.20.0 ships; the preset's EPP flags are byte-identical between
#   0.18 and 0.20, so repinning the images is the whole fix. Baseline line only.
# ---------------------------------------------------------------------------
kserve_llmisvc_epp_image: "ghcr.io/llm-d/llm-d-router-endpoint-picker:v0.9.0"
kserve_llmisvc_tokenizer_image: "ghcr.io/llm-d/llm-d-uds-tokenizer:vllm-v0.19.1"

# ---------------------------------------------------------------------------
# Envoy Gateway upgrade (applied at end of LLMIsvc install)
# ---------------------------------------------------------------------------
#   After KServe + LLMIsvc are installed, kserve upgrades Envoy Gateway to
#   enable AI integration (extensionManager, backendResources: InferencePool).
#   On the platform's own release, at the version it runs. An Envoy Gateway the
#   platform did not install is changed only with envoy_gateway_configure_existing
#   (a platform setting, read from gateway_platform).
# ---------------------------------------------------------------------------
kserve_envoy_gateway_version: "{{ gateway_platform.version }}"
kserve_envoy_gateway_namespace: "{{ envoy_gateway_namespace | default('envoy-gateway-system') }}"
kserve_envoy_gateway_release_name: "{{ gateway_platform.release }}"
kserve_envoy_gateway_helm_repo: "oci://docker.io/envoyproxy/gateway-helm"
kserve_envoy_ai_controller_namespace: "envoy-ai-gateway-system"
kserve_envoy_ai_controller_service: "ai-gateway-controller"

# ---------------------------------------------------------------------------
# Gateway API integration (Standard mode with Envoy Gateway)
# ---------------------------------------------------------------------------
#   When true, configures KServe to use the Kubernetes Gateway API for
#   ingress routing instead of Istio VirtualService. The controller will
#   auto-create HTTPRoute resources for both InferenceService and
#   LLMInferenceService CRDs — no manual HTTPRoute needed.
# ---------------------------------------------------------------------------
kserve_enable_gateway_api: true
kserve_gateway_name: "eg-gateway"
kserve_gateway_namespace: "envoy-gateway-system"
kserve_ingress_domain: "{{ base_domain_name | default('inference-example.com') }}"
kserve_ingress_class: "{{ (gateway_platform | default({})).class_name | default('eg', true) }}"
