# =============================================================================
# agentgateway — Teardown
# =============================================================================

# Teardown is unconditional and idempotent: every task below deletes with
# state=absent / failed_when=false, so it is a safe no-op when a resource is
# already gone. We deliberately do NOT gate the whole flow on the control-plane
# Helm release being present — the agentgateway footprint is more than one
# release (control plane, CRDs release, CRDs, namespace, Gateway/GatewayClass,
# per-model routes/policies). Gating on a single release would orphan the rest
# whenever it alone was removed (or when the provider was switched away and the
# control plane torn down out of band). We probe the two Helm releases only to
# emit an informative "nothing to do" note.
- name: "agentgateway | Check if control-plane Helm release exists"
  kubernetes.core.helm_info:
    name: agentgateway
    release_namespace: "{{ agentgateway_namespace }}"
  register: _agw_release
  failed_when: false

- name: "agentgateway | Check if CRDs Helm release exists"
  kubernetes.core.helm_info:
    name: agentgateway-crds
    release_namespace: "{{ agentgateway_namespace }}"
  register: _agw_crds_release
  failed_when: false

- name: "agentgateway | No Helm releases found — cleaning up any residual resources"
  ansible.builtin.debug:
    msg: >-
      No agentgateway Helm releases found in {{ agentgateway_namespace }}.
      Proceeding with idempotent cleanup of any residual CRDs, namespace,
      Gateway, GatewayClass and per-model routes/policies.
  when:
    - _agw_release.status is not defined
    - _agw_crds_release.status is not defined

- name: "agentgateway | Teardown"
  block:
    # -- Per-model routes/policies created by model-manager --
    - name: "agentgateway | Find model-manager managed HTTPRoutes"
      kubernetes.core.k8s_info:
        api_version: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        namespace: "{{ ai_gateway_namespace }}"
        label_selectors:
          - "app.kubernetes.io/managed-by=model-manager"
      register: _mm_httproutes
      failed_when: false

    - name: "agentgateway | Delete model-manager HTTPRoutes"
      kubernetes.core.k8s:
        api_version: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        name: "{{ item.metadata.name }}"
        namespace: "{{ ai_gateway_namespace }}"
        state: absent
      loop: "{{ _mm_httproutes.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      failed_when: false

    - name: "agentgateway | Find model-manager managed AgentgatewayPolicies"
      kubernetes.core.k8s_info:
        api_version: agentgateway.dev/v1alpha1
        kind: AgentgatewayPolicy
        namespace: "{{ ai_gateway_namespace }}"
        label_selectors:
          - "app.kubernetes.io/managed-by=model-manager"
      register: _mm_policies
      failed_when: false

    - name: "agentgateway | Delete model-manager AgentgatewayPolicies"
      kubernetes.core.k8s:
        api_version: agentgateway.dev/v1alpha1
        kind: AgentgatewayPolicy
        name: "{{ item.metadata.name }}"
        namespace: "{{ ai_gateway_namespace }}"
        state: absent
      loop: "{{ _mm_policies.resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      failed_when: false

    - name: "agentgateway | Delete model-header extraction policy"
      kubernetes.core.k8s:
        api_version: agentgateway.dev/v1alpha1
        kind: AgentgatewayPolicy
        name: extract-model-header
        namespace: "{{ ai_gateway_namespace }}"
        state: absent
      failed_when: false

    - name: "agentgateway | Delete external inference HTTPRoute"
      kubernetes.core.k8s:
        api_version: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        name: inference-external
        namespace: "{{ envoy_gateway_namespace }}"
        state: absent
      failed_when: false

    - name: "agentgateway | Unpublish the inference host"
      ansible.builtin.include_role:
        name: envoy_gateway
        tasks_from: unpublish.yaml
      vars:
        gateway_publish_name: inference
        gateway_publish_namespace: "{{ envoy_gateway_namespace }}"
        gateway_publish_host: "{{ inference_hostname }}"
        gateway_publish_path: "{{ inference_path }}"

    - name: "agentgateway | Delete AI Gateway resource"
      kubernetes.core.k8s:
        api_version: gateway.networking.k8s.io/v1
        kind: Gateway
        name: "{{ ai_gateway_name }}"
        namespace: "{{ ai_gateway_namespace }}"
        state: absent
      failed_when: false
      when: ai_gateway_create | bool

    - name: "agentgateway | Delete GatewayClass"
      kubernetes.core.k8s:
        api_version: gateway.networking.k8s.io/v1
        kind: GatewayClass
        name: "{{ ai_gateway_class_name }}"
        state: absent
      failed_when: false
      when: ai_gateway_create | bool

    # -- Control plane --
    - name: "agentgateway | Uninstall control plane"
      kubernetes.core.helm:
        name: agentgateway
        release_namespace: "{{ agentgateway_namespace }}"
        state: absent
        wait: true
      failed_when: false

    - name: "agentgateway | Uninstall CRDs Helm release"
      kubernetes.core.helm:
        name: agentgateway-crds
        release_namespace: "{{ agentgateway_namespace }}"
        state: absent
        wait: true
      failed_when: false

    - name: "agentgateway | Find agentgateway CRDs"
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
      register: _agw_crds
      failed_when: false

    - name: "agentgateway | Delete agentgateway CRDs"
      kubernetes.core.k8s:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: "{{ item.metadata.name }}"
        state: absent
      loop: "{{ _agw_crds.resources | default([]) | selectattr('metadata.name', 'search', 'agentgateway.dev') | list }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      failed_when: false

    - name: "agentgateway | Delete control-plane namespace"
      kubernetes.core.k8s:
        kind: Namespace
        name: "{{ agentgateway_namespace }}"
        state: absent
      failed_when: false
