# =============================================================================
# agentgateway — Teardown
# =============================================================================
# Removes only objects in agentgateway_owned_objects that carry the ownership
# label (see roles/inference_ownership). The llm-inference namespace, the
# Gateway API CRDs and the Envoy AI Gateway's objects of the same name are
# left alone.

- name: "agentgateway | Remove owned objects"
  ansible.builtin.include_role:
    name: inference_ownership
    tasks_from: delete
  vars:
    ownership_name: agentgateway
    ownership_items: "{{ agentgateway_owned_objects }}"
