---
# =============================================================================
# NFD — Teardown
# =============================================================================
# Removes only what this role installed (see nfd_owned_objects).

- name: "nfd | teardown | Remove owned objects"
  ansible.builtin.include_role:
    name: inference_ownership
    tasks_from: delete
  vars:
    ownership_name: nfd
    ownership_items: "{{ nfd_owned_objects }}"

- name: "nfd | teardown | Remove Helm repo"
  kubernetes.core.helm_repository:
    name: "{{ nfd_helm_repo_name }}"
    state: absent
  failed_when: false

- name: "nfd | teardown | Complete"
  ansible.builtin.debug:
    msg: "NFD teardown done for namespace '{{ nfd_namespace }}' (only objects this role installed)"
