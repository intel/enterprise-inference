---
# =============================================================================
# NFD — Install via Helm
# =============================================================================

- name: "nfd | Skip — disabled"
  ansible.builtin.debug:
    msg: "NFD is disabled (nfd_enabled=false) — skipping."
  when: not (nfd_enabled | bool)

- name: "nfd | Install"
  when: nfd_enabled | bool
  block:

    - name: "nfd | Check for existing Helm release"
      kubernetes.core.helm_info:
        name: node-feature-discovery
        release_namespace: "{{ nfd_namespace }}"
      register: _nfd_release
      failed_when: false

    - name: "nfd | Already installed — skipping"
      ansible.builtin.debug:
        msg: "NFD already deployed in {{ nfd_namespace }} — skipping install."
      when: _nfd_release.status is defined and _nfd_release.status is not none

    - name: "nfd | Deploy"
      when: _nfd_release.status is not defined or _nfd_release.status is none
      block:

        - name: "nfd | Create namespace"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Namespace
              metadata:
                name: "{{ nfd_namespace }}"

        - name: "nfd | Add Helm repo"
          kubernetes.core.helm_repository:
            name: "{{ nfd_helm_repo_name }}"
            repo_url: "{{ nfd_helm_repo }}"

        - name: "nfd | Install via Helm"
          kubernetes.core.helm:
            name: node-feature-discovery
            chart_ref: "{{ nfd_helm_chart }}"
            chart_version: "{{ nfd_version }}"
            release_namespace: "{{ nfd_namespace }}"
            create_namespace: true
            wait: true
            timeout: "5m0s"
            values:
              master:
                resources:
                  requests:
                    cpu: "100m"
                    memory: "128Mi"
                  limits:
                    cpu: "500m"
                    memory: "256Mi"
              worker:
                resources:
                  requests:
                    cpu: "50m"
                    memory: "64Mi"
                  limits:
                    cpu: "200m"
                    memory: "128Mi"

    # NFD worker mounts hostPath (/sys, /etc/kubernetes/node-feature-discovery,
    # /usr/src) and typically uses hostNetwork; namespace-level PSS applies to
    # every pod in the namespace, so master/gc must sit at the same floor the
    # worker requires — "privileged".
    - name: "nfd | Label namespace — PSS"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ nfd_namespace }}"
            labels:
              pod-security.kubernetes.io/enforce: "privileged"
              pod-security.kubernetes.io/audit: "privileged"
              pod-security.kubernetes.io/warn: "privileged"
      when: enforce_pss | default(false) | bool

    # Wait for NFD worker pods to be running on all nodes so labels are applied
    - name: "nfd | Wait for worker DaemonSet ready"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: DaemonSet
        name: node-feature-discovery-worker
        namespace: "{{ nfd_namespace }}"
      register: _nfd_ds
      until:
        - _nfd_ds.resources | default([]) | length > 0
        - (_nfd_ds.resources[0].status.numberReady | default(0)) == (_nfd_ds.resources[0].status.desiredNumberScheduled | default(0))
      retries: 30
      delay: 10

    - name: "nfd | Verify AMX labels present on at least one node"
      kubernetes.core.k8s_info:
        kind: Node
        label_selectors:
          - "feature.node.kubernetes.io/cpu-cpuid.AMXBF16=true"
      register: _nfd_amx_nodes

    - name: "nfd | AMX node summary"
      ansible.builtin.debug:
        msg: >-
          NFD detected {{ _nfd_amx_nodes.resources | length }} node(s) with AMX support:
          {{ _nfd_amx_nodes.resources | map(attribute='metadata.name') | list | join(', ') | default('none') }}

    - name: "nfd | Install complete"
      ansible.builtin.debug:
        msg: "NFD deployed in namespace '{{ nfd_namespace }}' — node hardware labels are now active."
