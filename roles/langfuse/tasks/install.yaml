---
# =============================================================================
# Langfuse — Install via Helm
# =============================================================================
# Uses existing platform PostgreSQL and object store (S3).
# Redis (Valkey) and ClickHouse deployed by Helm subcharts.
# Single-node: 1 replica, minimal resources.
# Multi-node:  2 replicas, HPA enabled.
# =============================================================================

# ── Idempotency check ─────────────────────────────────────────────────────────

- name: "langfuse | Check for existing Helm release"
  kubernetes.core.helm_info:
    name: langfuse
    release_namespace: "{{ langfuse_namespace }}"
  register: _langfuse_release
  failed_when: false

- name: "langfuse | Already installed — skipping"
  ansible.builtin.debug:
    msg: "Langfuse already deployed in {{ langfuse_namespace }} — skipping install."
  when: _langfuse_release.status is defined and _langfuse_release.status is not none

# ── Keycloak client (every run: Langfuse's sign-in and the gateway's) ────────

- name: "langfuse | Keycloak client"
  when: langfuse_sso | bool
  block:
    - name: "langfuse | Namespace for the client secret"
      kubernetes.core.k8s:
        kind: Namespace
        name: "{{ langfuse_namespace }}"
        state: present

    - name: "langfuse | Keycloak client"
      ansible.builtin.include_role:
        name: keycloak
        tasks_from: oidc_client.yaml
      vars:
        keycloak_client:
          id: "{{ langfuse_oidc_client_id }}"
          redirect_uris:
            - "https://{{ langfuse_hostname }}/api/auth/callback/keycloak"
            - "https://{{ langfuse_hostname }}/oauth2/callback"
          post_logout_uris: ["https://{{ langfuse_hostname }}/"]

    - name: "langfuse | Keycloak client secret"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: langfuse-sso
            namespace: "{{ langfuse_namespace }}"
          type: Opaque
          stringData:
            client-secret: "{{ keycloak_client_secret }}"
      no_log: true

- name: "langfuse | Install"
  when: _langfuse_release.status is not defined or _langfuse_release.status is none
  block:

    # ── Detect cluster topology for sizing ───────────────────────────────────

    - name: "langfuse | Detect cluster size"
      ansible.builtin.set_fact:
        _langfuse_is_multinode: "{{ (kubernetes_nodes | default([]) | length) > 1 }}"

    - name: "langfuse | Set sizing based on cluster topology"
      ansible.builtin.set_fact:
        _langfuse_replicas: "{{ langfuse_multi_node_replicas if _langfuse_is_multinode | bool else langfuse_single_node_replicas }}"
        _langfuse_web_resources: "{{ langfuse_multi_node_resources.web if _langfuse_is_multinode | bool else langfuse_single_node_resources.web }}"
        _langfuse_worker_resources: "{{ langfuse_multi_node_resources.worker if _langfuse_is_multinode | bool else langfuse_single_node_resources.worker }}"

    - name: "langfuse | Topology summary"
      ansible.builtin.debug:
        msg: "Langfuse sizing: {{ 'multi-node (' + (_langfuse_replicas | string) + ' replicas)' if _langfuse_is_multinode | bool else 'single-node (1 replica)' }}"

    # ── Namespace ─────────────────────────────────────────────────────────────

    - name: "langfuse | Create namespace"
      kubernetes.core.k8s:
        kind: Namespace
        name: "{{ langfuse_namespace }}"
        state: present

    # ── PostgreSQL credentials ────────────────────────────────────────────────

    # PostgreSQL ran first (depends_on), so the secret exists now or not at all.
    - name: "langfuse | Read DB credentials secret"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: langfuse-db-secret
        namespace: "{{ langfuse_namespace }}"
      register: _langfuse_db_secret

    - name: "langfuse | DB credentials present"
      ansible.builtin.assert:
        that: _langfuse_db_secret.resources | default([]) | length > 0
        fail_msg: >-
          langfuse-db-secret not found in {{ langfuse_namespace }}. PostgreSQL creates it when
          langfuse is enabled: run install langfuse without --only, or install postgresql first.
        quiet: true

    - name: "langfuse | Wait for langfuse database to be ready (CNPG Database CRD)"
      kubernetes.core.k8s_info:
        api_version: postgresql.cnpg.io/v1
        kind: Database
        name: langfuse
        namespace: "{{ postgresql_namespace | default('postgresql') }}"
      register: _langfuse_db_crd
      until: >-
        _langfuse_db_crd.resources | default([]) | length > 0 and
        (_langfuse_db_crd.resources[0].status.applied | default(false) | bool)
      retries: 60
      delay: 5

    - name: "langfuse | Extract DB connection details"
      ansible.builtin.set_fact:
        _langfuse_db_host: "{{ _langfuse_db_secret.resources[0].data.host | b64decode }}"
        _langfuse_db_port: "{{ _langfuse_db_secret.resources[0].data.port | b64decode }}"
        _langfuse_db_name: "{{ _langfuse_db_secret.resources[0].data.database | b64decode }}"
        _langfuse_db_user: "{{ _langfuse_db_secret.resources[0].data.username | b64decode }}"
        _langfuse_db_pass: "{{ _langfuse_db_secret.resources[0].data.password | b64decode }}"
      no_log: true

    # ── Object store (S3) credentials ─────────────────────────────────────────
    # Langfuse is an object_store consumer: the active backend role (SeaweedFS)
    # creates the `langfuse` bucket + a scoped S3 user and writes the shared
    # credentials Secret. We read the langfuse key pair from it — no bucket
    # creation here (the backend already made it, and the scoped user has no
    # permission to create buckets).

    - name: "langfuse | Load object store credentials"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ object_store_credentials_secret }}"
        namespace: "{{ object_store_namespace }}"
      register: _langfuse_os_secret
      failed_when: false

    - name: "langfuse | Extract object store S3 credentials"
      ansible.builtin.set_fact:
        _langfuse_s3_endpoint: "{{ _langfuse_os_secret.resources[0].data.endpoint | b64decode }}"
        _langfuse_s3_access_key: "{{ _langfuse_os_secret.resources[0].data.langfuseAccessKey | b64decode }}"
        _langfuse_s3_secret_key: "{{ _langfuse_os_secret.resources[0].data.langfuseSecretKey | b64decode }}"
      no_log: true
      when: _langfuse_os_secret.resources | default([]) | length > 0

    - name: "langfuse | Fallback S3 to empty (object store not available)"
      ansible.builtin.set_fact:
        _langfuse_s3_endpoint: ""
        _langfuse_s3_access_key: ""
        _langfuse_s3_secret_key: ""
      when: _langfuse_os_secret.resources | default([]) | length == 0

    # ── Langfuse secrets (stable across restarts — generated once) ───────────

    - name: "langfuse | Check for existing secrets"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: langfuse-secrets
        namespace: "{{ langfuse_namespace }}"
      register: _langfuse_secrets_existing
      failed_when: false

    - name: "langfuse | Generate and store secrets"
      when: _langfuse_secrets_existing.resources | default([]) | length == 0
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: langfuse-secrets
            namespace: "{{ langfuse_namespace }}"
          stringData:
            salt: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
            encryption_key: "{{ lookup('password', '/dev/null length=64 chars=hexdigits') | lower }}"
            nextauth_secret: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"
            clickhouse_password: "{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
            # Default admin account — seeded on first startup via LANGFUSE_INIT_* env vars
            # Password set via LANGFUSE_ADMIN_PASSWORD env var at install time, or auto-generated
            admin_email: "{{ langfuse_admin_email | default('admin@' + (base_domain_name | default('inference-example.com'))) }}"
            admin_password: "{{ langfuse_admin_password }}"
            admin_name: "admin"
            # API keys for LiteLLM integration (pre-generated, stable)
            public_key: "pk-lf-{{ lookup('password', '/dev/null length=32 chars=ascii_lowercase,digits') }}"
            secret_key: "sk-lf-{{ lookup('password', '/dev/null length=32 chars=ascii_lowercase,digits') }}"
            # Org/project IDs (stable UUIDs)
            org_id: "{{ lookup('password', '/dev/null length=8 chars=ascii_lowercase,digits') }}-{{ lookup('password', '/dev/null length=4 chars=ascii_lowercase,digits') }}-{{ lookup('password', '/dev/null length=4 chars=ascii_lowercase,digits') }}-{{ lookup('password', '/dev/null length=4 chars=ascii_lowercase,digits') }}-{{ lookup('password', '/dev/null length=12 chars=ascii_lowercase,digits') }}"
            project_id: "{{ lookup('password', '/dev/null length=8 chars=ascii_lowercase,digits') }}-{{ lookup('password', '/dev/null length=4 chars=ascii_lowercase,digits') }}-{{ lookup('password', '/dev/null length=4 chars=ascii_lowercase,digits') }}-{{ lookup('password', '/dev/null length=4 chars=ascii_lowercase,digits') }}-{{ lookup('password', '/dev/null length=12 chars=ascii_lowercase,digits') }}"

    - name: "langfuse | Load secrets"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: langfuse-secrets
        namespace: "{{ langfuse_namespace }}"
      register: _langfuse_secrets

    # Patch secret if clickhouse_password key is missing (upgrade path)
    - name: "langfuse | Add clickhouse_password to secrets if missing"
      when: _langfuse_secrets.resources[0].data.clickhouse_password is not defined
      kubernetes.core.k8s:
        state: patched
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: langfuse-secrets
            namespace: "{{ langfuse_namespace }}"
          stringData:
            clickhouse_password: "{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"

    - name: "langfuse | Reload secrets (always — ensures fresh data after any patch)"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: langfuse-secrets
        namespace: "{{ langfuse_namespace }}"
      register: _langfuse_secrets

    - name: "langfuse | Set secret facts"
      ansible.builtin.set_fact:
        _langfuse_salt: "{{ _langfuse_secrets.resources[0].data.salt | b64decode }}"
        _langfuse_encryption_key: "{{ _langfuse_secrets.resources[0].data.encryption_key | b64decode }}"
        _langfuse_nextauth_secret: "{{ _langfuse_secrets.resources[0].data.nextauth_secret | b64decode }}"
        _langfuse_admin_email: "{{ _langfuse_secrets.resources[0].data.admin_email | b64decode }}"
        _langfuse_admin_password: "{{ _langfuse_secrets.resources[0].data.admin_password | b64decode }}"
        _langfuse_admin_name: "{{ _langfuse_secrets.resources[0].data.admin_name | b64decode }}"
        _langfuse_public_key: "{{ _langfuse_secrets.resources[0].data.public_key | b64decode }}"
        _langfuse_secret_key: "{{ _langfuse_secrets.resources[0].data.secret_key | b64decode }}"
        _langfuse_org_id: "{{ _langfuse_secrets.resources[0].data.org_id | b64decode }}"
        _langfuse_project_id: "{{ _langfuse_secrets.resources[0].data.project_id | b64decode }}"
        _langfuse_clickhouse_password: "{{ _langfuse_secrets.resources[0].data.clickhouse_password | b64decode }}"
      no_log: true

    # ── Keycloak sign-in ─────────────────────────────────────────────────────

    - name: "langfuse | Keycloak sign-in"
      when: langfuse_sso | bool
      block:
        # Langfuse fetches Keycloak's discovery document at its public URL.
        - name: "langfuse | Reach Keycloak at its public URL"
          ansible.builtin.include_role:
            name: gateway
            tasks_from: client_trust.yaml
          vars:
            gateway_trust_namespace: "{{ langfuse_namespace }}"
            gateway_trust_configmap: langfuse-platform-ca

    # ── Helm install ──────────────────────────────────────────────────────────

    - name: "langfuse | Add Helm repo"
      kubernetes.core.helm_repository:
        name: "{{ langfuse_helm_repo_name }}"
        repo_url: "{{ langfuse_helm_repo }}"
      register: _langfuse_helm_repo
      until: _langfuse_helm_repo is succeeded
      retries: "{{ helm_retries | default(3) }}"
      delay: 15

    - name: "langfuse | Install via Helm"
      vars:
        _lf_ca: "{{ langfuse_sso | bool and gateway_trust.ca_pem | default('') | length > 0 }}"
        _lf_ca_volumes: [{name: platform-ca, configMap: {name: langfuse-platform-ca}}]
        _lf_env:
          # Single-node ClickHouse, no ZooKeeper.
          - {name: CLICKHOUSE_CLUSTER_ENABLED, value: "false"}
          - {name: LANGFUSE_INIT_ORG_ID, valueFrom: {secretKeyRef: {name: langfuse-secrets, key: org_id}}}
          - {name: LANGFUSE_INIT_ORG_NAME, value: inference}
          - {name: LANGFUSE_INIT_PROJECT_ID, valueFrom: {secretKeyRef: {name: langfuse-secrets, key: project_id}}}
          - {name: LANGFUSE_INIT_PROJECT_NAME, value: inference}
          - {name: LANGFUSE_INIT_PROJECT_PUBLIC_KEY, valueFrom: {secretKeyRef: {name: langfuse-secrets, key: public_key}}}
          - {name: LANGFUSE_INIT_PROJECT_SECRET_KEY, valueFrom: {secretKeyRef: {name: langfuse-secrets, key: secret_key}}}
          - {name: LANGFUSE_INIT_USER_EMAIL, valueFrom: {secretKeyRef: {name: langfuse-secrets, key: admin_email}}}
          - {name: LANGFUSE_INIT_USER_NAME, valueFrom: {secretKeyRef: {name: langfuse-secrets, key: admin_name}}}
          - {name: LANGFUSE_INIT_USER_PASSWORD, valueFrom: {secretKeyRef: {name: langfuse-secrets, key: admin_password}}}
          - {name: AUTH_SESSION_MAX_AGE, value: "{{ langfuse_session_max_age | string }}"}
        _lf_env_sso:
          - {name: AUTH_KEYCLOAK_NAME, value: Keycloak}
          - {name: AUTH_KEYCLOAK_CLIENT_ID, value: "{{ langfuse_oidc_client_id }}"}
          - {name: AUTH_KEYCLOAK_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: langfuse-sso, key: client-secret}}}
          - {name: AUTH_KEYCLOAK_ISSUER, value: "{{ keycloak_client_issuer | default('') }}"}
          - {name: AUTH_KEYCLOAK_CHECKS, value: "pkce,state"}
          # Everyone who signs in reads the seeded project; only the seeded admin creates orgs.
          - {name: LANGFUSE_DEFAULT_ORG_ID, valueFrom: {secretKeyRef: {name: langfuse-secrets, key: org_id}}}
          - {name: LANGFUSE_DEFAULT_ORG_ROLE, value: VIEWER}
          - {name: LANGFUSE_DEFAULT_PROJECT_ID, valueFrom: {secretKeyRef: {name: langfuse-secrets, key: project_id}}}
          - {name: LANGFUSE_DEFAULT_PROJECT_ROLE, value: VIEWER}
          - {name: LANGFUSE_ALLOWED_ORGANIZATION_CREATORS, valueFrom: {secretKeyRef: {name: langfuse-secrets, key: admin_email}}}
      kubernetes.core.helm:
        name: langfuse
        chart_ref: "{{ langfuse_helm_chart }}"
        chart_version: "{{ langfuse_version }}"
        release_namespace: "{{ langfuse_namespace }}"
        create_namespace: true
        wait: false
        timeout: "10m0s"
        values:
          # Set fullnameOverride so service is named 'langfuse-web' predictably
          fullnameOverride: "langfuse"

          # All langfuse app settings are nested under the 'langfuse' key
          langfuse:
            replicas: "{{ _langfuse_replicas | int }}"
            nodeEnv: production
            features:
              telemetryEnabled: false
              signUpDisabled: false
            salt:
              value: "{{ _langfuse_salt }}"
            encryptionKey:
              value: "{{ _langfuse_encryption_key }}"

            # NextAuth — nested under langfuse in chart v1.5.x
            nextauth:
              url: "https://{{ langfuse_hostname }}"
              secret:
                secretKeyRef:
                  name: langfuse-secrets
                  key: nextauth_secret

            # PSS restricted — chart v1.5.x reads these shared web+worker keys,
            # not the web/worker subkeys below. Image runs as uid 1001 (nextjs).
            podSecurityContext:
              runAsNonRoot: true
              runAsUser: 1001
              fsGroup: 1001
              seccompProfile:
                type: RuntimeDefault
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 1001
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault

            # Web UI sizing
            web:
              resources: "{{ _langfuse_web_resources }}"
              hostAliases: >-
                {{ [{'ip': gateway_trust.address, 'hostnames': [keycloak_client_issuer | urlsplit('hostname')]}]
                   if langfuse_sso | bool and langfuse_pin_issuer_host | bool else [] }}
              livenessProbe:
                initialDelaySeconds: 60
                periodSeconds: 15
                failureThreshold: 5
              readinessProbe:
                initialDelaySeconds: 30
                periodSeconds: 10
                failureThreshold: 5
              pod:
                affinity: "{{ _platform_affinity | default({}) }}"
                securityContext:
                  fsGroup: 1001
                  runAsUser: 1001
                  runAsNonRoot: true
              containerSecurityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              hpa:
                enabled: "{{ _langfuse_is_multinode | bool }}"
                minReplicas: "{{ _langfuse_replicas | int }}"
                maxReplicas: "{{ (_langfuse_replicas | int) * 2 }}"
                targetCPUUtilizationPercentage: 70

            # Worker sizing
            worker:
              resources: "{{ _langfuse_worker_resources }}"
              pod:
                affinity: "{{ _platform_affinity | default({}) }}"
                securityContext:
                  fsGroup: 1001
                  runAsUser: 1001
                  runAsNonRoot: true
              containerSecurityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              hpa:
                enabled: "{{ _langfuse_is_multinode | bool }}"
                minReplicas: "{{ _langfuse_replicas | int }}"
                maxReplicas: "{{ (_langfuse_replicas | int) * 2 }}"
                targetCPUUtilizationPercentage: 70

            additionalEnv: >-
              {{ _lf_env + (_lf_env_sso if langfuse_sso | bool else [])
                 + ([{'name': 'NODE_EXTRA_CA_CERTS', 'value': '/etc/platform-ca/ca.crt'}] if _lf_ca | bool else []) }}
            extraVolumes: "{{ _lf_ca_volumes if _lf_ca | bool else [] }}"
            extraVolumeMounts: "{{ [{'name': 'platform-ca', 'mountPath': '/etc/platform-ca', 'readOnly': true}] if _lf_ca | bool else [] }}"

          # ── PostgreSQL — use our existing instance ────────────────────────
          postgresql:
            deploy: false
            host: "{{ _langfuse_db_host }}"
            port: "{{ _langfuse_db_port | int }}"
            auth:
              username: "{{ _langfuse_db_user }}"
              password: "{{ _langfuse_db_pass }}"
              database: "{{ _langfuse_db_name }}"

          # ── ClickHouse — deployed by Helm subchart (bitnami/clickhouse) ────
          clickhouse:
            deploy: true
            clusterEnabled: false
            shards: 1
            replicaCount: 1
            auth:
              username: default
              password: "{{ _langfuse_clickhouse_password }}"
            migration:
              url: "clickhouse://default:{{ _langfuse_clickhouse_password }}@langfuse-clickhouse:9000"
            persistence:
              size: "{{ langfuse_clickhouse_storage_size | default('50Gi') }}"
            resourcesPreset: "small"
            networkPolicy:
              enabled: false
            zookeeper:
              enabled: false
              networkPolicy:
                enabled: false
            podSecurityContext:
              fsGroup: 1001
              runAsUser: 1001
              runAsNonRoot: true
            containerSecurityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]

          # ── Redis/Valkey — deployed by Helm subchart (bitnami/valkey) ───────
          redis:
            deploy: true
            architecture: standalone
            auth:
              enabled: false
            networkPolicy:
              enabled: false
            primary:
              extraFlags:
                - "--maxmemory-policy noeviction"
              podSecurityContext:
                fsGroup: 1001
                runAsUser: 1001
                runAsNonRoot: true
              containerSecurityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]

          # ── S3 — use the platform object store (SeaweedFS via object_store) ─
          s3:
            deploy: false
            bucket: "{{ langfuse_s3_bucket }}"
            region: "us-east-1"
            endpoint: "{{ _langfuse_s3_endpoint }}"
            forcePathStyle: true
            accessKeyId:
              value: "{{ _langfuse_s3_access_key }}"
            secretAccessKey:
              value: "{{ _langfuse_s3_secret_key }}"

    # ── Fix failed Prisma migrations (Langfuse bug: some migrations not idempotent on empty DB)
      register: _langfuse_helm
      until: _langfuse_helm is succeeded
      retries: "{{ helm_retries | default(3) }}"
      delay: 15
    - name: "langfuse | Wait for initial migration attempt (45s)"
      ansible.builtin.pause:
        seconds: 45

    - name: "langfuse | Check for failed Prisma migrations"
      kubernetes.core.k8s_exec:
        namespace: "{{ postgresql_namespace | default('postgresql') }}"
        pod: "{{ postgresql_cluster_name | default('postgresql') }}-1"
        container: postgres
        command:
          - psql
          - -U
          - langfuse
          - -d
          - langfuse
          - -tAc
          - "SELECT count(*) FROM _prisma_migrations WHERE rolled_back_at IS NOT NULL OR (finished_at IS NULL AND started_at IS NOT NULL);"
      register: _langfuse_failed_migration
      failed_when: false
      changed_when: false

    - name: "langfuse | Auto-resolve failed Prisma migrations"
      when: (_langfuse_failed_migration.stdout | default('0') | trim | int) > 0
      block:
        - name: "langfuse | Delete failed migration records"
          kubernetes.core.k8s_exec:
            namespace: "{{ postgresql_namespace | default('postgresql') }}"
            pod: "{{ postgresql_cluster_name | default('postgresql') }}-1"
            container: postgres
            command:
              - psql
              - -U
              - langfuse
              - -d
              - langfuse
              - -c
              - "DELETE FROM _prisma_migrations WHERE rolled_back_at IS NOT NULL OR (finished_at IS NULL AND started_at IS NOT NULL);"

        - name: "langfuse | Restart pods to retry migrations"
          ansible.builtin.shell: |
            kubectl rollout restart deployment -n {{ langfuse_namespace }} -l app.kubernetes.io/instance=langfuse
          changed_when: true

    # ── Wait for readiness (with progress) ───────────────────────────────────

    - name: "langfuse | Waiting for pods to be ready (image pull may take a few minutes)..."
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ langfuse_namespace }}"
        label_selectors:
          - app.kubernetes.io/instance=langfuse
      register: _langfuse_pods
      until:
        - _langfuse_pods.resources | default([]) | length > 0
        - _langfuse_pods.resources | selectattr('status.phase', 'eq', 'Running') | list | length == (_langfuse_pods.resources | length)
      retries: 120
      delay: 5

    - name: "langfuse | Progress: {{ _langfuse_pods.resources | default([]) | length }} pods, phases: {{ _langfuse_pods.resources | default([]) | map(attribute='status.phase') | list | join(', ') }}"
      ansible.builtin.debug:
        msg: "All Langfuse pods running."

    - name: "langfuse | Wait for web deployment ready"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        label_selectors:
          - "app.kubernetes.io/component=web"
          - "app.kubernetes.io/instance=langfuse"
        namespace: "{{ langfuse_namespace }}"
      register: _langfuse_web_deploy
      until:
        - _langfuse_web_deploy.resources | default([]) | length > 0
        - _langfuse_web_deploy.resources[0].status.conditions | default([]) | selectattr('type','eq','Available') | selectattr('status','eq','True') | list | length > 0
      retries: 60
      delay: 5

    - name: "langfuse | Wait for worker deployment ready"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        label_selectors:
          - "app.kubernetes.io/component=worker"
          - "app.kubernetes.io/instance=langfuse"
        namespace: "{{ langfuse_namespace }}"
      register: _langfuse_worker_deploy
      until:
        - _langfuse_worker_deploy.resources | default([]) | length > 0
        - _langfuse_worker_deploy.resources[0].status.conditions | default([]) | selectattr('type','eq','Available') | selectattr('status','eq','True') | list | length > 0
      retries: 60
      delay: 5

# Values apply on a fresh install only: an existing release keeps its sign-in.
- name: "langfuse | Read the web deployment"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: langfuse-web
    namespace: "{{ langfuse_namespace }}"
  register: _langfuse_web_live

- name: "langfuse | Sign-in settings are out of date"
  vars:
    _env: >-
      {{ (_langfuse_web_live.resources | first).spec.template.spec.containers
         | map(attribute='env') | flatten | map(attribute='name') | list }}
  ansible.builtin.debug:
    msg: >-
      Langfuse runs with Keycloak sign-in {{ 'off' if langfuse_sso | bool else 'on' }}, but
      langfuse_sso is {{ langfuse_sso | bool }}. Reinstall it: teardown langfuse, then install langfuse.
  when:
    - _langfuse_web_live.resources | length > 0
    - (langfuse_sso | bool) != ('AUTH_KEYCLOAK_ISSUER' in _env)

# ── Load secrets for use in tasks outside the install block ──────────────────
# Runs unconditionally so re-runs (Helm already installed) still have keys set

- name: "langfuse | Load secrets (unconditional — needed for LiteLLM injection)"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: langfuse-secrets
    namespace: "{{ langfuse_namespace }}"
  register: _langfuse_secrets_outer
  failed_when: false

- name: "langfuse | Set API key facts from existing secret"
  when: _langfuse_secrets_outer.resources | default([]) | length > 0
  ansible.builtin.set_fact:
    _langfuse_public_key: "{{ _langfuse_secrets_outer.resources[0].data.public_key | b64decode }}"
    _langfuse_secret_key: "{{ _langfuse_secrets_outer.resources[0].data.secret_key | b64decode }}"

# ── Gateway integration ───────────────────────────────────────────────────────

- name: "langfuse | Publish the langfuse host"
  ansible.builtin.include_role:
    name: gateway
    tasks_from: publish.yaml
  vars:
    gateway_publish_name: langfuse
    gateway_publish_namespace: "{{ langfuse_namespace }}"
    gateway_publish_host: "{{ langfuse_hostname }}"
    gateway_publish_mode: subdomain   # Langfuse cannot run under a path
    gateway_publish_portal: {title: "Langfuse", description: "LLM tracing and analytics"}
  when: langfuse_gateway_publish | bool

- name: "langfuse | Create HTTPRoute"
  when: langfuse_gateway_publish | bool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: langfuse
        namespace: "{{ langfuse_namespace }}"
      spec:
        parentRefs:
          - "{{ gateway_publish.parent_ref }}"
        hostnames:
          - "{{ langfuse_hostname }}"
        # With Keycloak sign-in, new accounts come only from Keycloak: the
        # email/password sign-up page and API redirect to the sign-in page.
        # Signed in at the gateway already, the root without a Langfuse
        # session starts Langfuse's Keycloak sign-in directly, so its sign-in
        # page (and button) never shows.
        rules: >-
          {{ ([{'matches': [{'path': {'type': 'Exact', 'value': '/api/auth/signup'}},
                            {'path': {'type': 'Exact', 'value': '/auth/sign-up'}}],
                'filters': [{'type': 'RequestRedirect',
                             'requestRedirect': {'path': {'type': 'ReplaceFullPath', 'replaceFullPath': '/auth/sign-in'},
                                                 'statusCode': 302}}]},
               {'matches': [{'path': {'type': 'Exact', 'value': '/'},
                             'headers': [{'type': 'RegularExpression', 'name': 'Cookie',
                                          'value': '(.*[;,] *)?__Secure-next-auth[.]session-token([.]0)?=.*'}]}],
                'backendRefs': [{'name': 'langfuse-web', 'port': 3000}]},
               {'matches': [{'path': {'type': 'Exact', 'value': '/'}}],
                'filters': [{'type': 'RequestRedirect',
                             'requestRedirect': {'path': {'type': 'ReplaceFullPath',
                                                          'replaceFullPath': '/auth/sso-initiate?provider=keycloak'},
                                                 'statusCode': 302}}]}]
              if langfuse_sso | bool else [])
             + [{'matches': [{'path': {'type': 'PathPrefix', 'value': '/'}}],
                 'backendRefs': [{'name': 'langfuse-web', 'port': 3000}]}] }}

# SDKs and OpenTelemetry exporters send traces with Langfuse API keys, which
# Langfuse checks itself; with Keycloak sign-in this path keeps its own route.
- name: "langfuse | Public API HTTPRoute"
  kubernetes.core.k8s:
    state: "{{ 'present' if langfuse_gateway_publish | bool and langfuse_sso | bool else 'absent' }}"
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: langfuse-api
        namespace: "{{ langfuse_namespace }}"
      spec:
        parentRefs:
          - "{{ gateway_publish.parent_ref | default({}) }}"
        hostnames:
          - "{{ langfuse_hostname }}"
        rules:
          - matches: [{path: {type: PathPrefix, value: /api/public}}]
            backendRefs: [{name: langfuse-web, port: 3000}]
  register: _langfuse_api_route
  # Removing tolerates a cluster without the Gateway API.
  failed_when: _langfuse_api_route is failed and langfuse_gateway_publish | bool and langfuse_sso | bool

- name: "langfuse | Path-mode redirect"
  ansible.builtin.include_role:
    name: gateway
    tasks_from: path_redirect.yaml
  vars:
    gateway_redirect_name: langfuse-redirect
    gateway_redirect_namespace: "{{ langfuse_namespace }}"
    gateway_redirect_path: "{{ langfuse_path }}"
    gateway_redirect_url: "https://{{ langfuse_hostname }}/"
    gateway_redirect_state: "{{ 'present' if langfuse_gateway_publish | bool else 'absent' }}"

# With Keycloak sign-in nobody reaches the UI without a realm session; Langfuse's
# own sign-in then runs on the same session. Without it Langfuse's login is the
# only gate. One policy per route: the other is removed first.
- name: "langfuse | Remove the other gateway policy"
  when: langfuse_gateway_publish | bool
  ansible.builtin.include_role:
    name: gateway
    tasks_from: "{{ 'route_auth_exempt.yaml' if langfuse_sso | bool else 'route_sso.yaml' }}"
  vars:
    gateway_route_name: langfuse
    gateway_route_namespace: "{{ langfuse_namespace }}"
    gateway_route_policy_name: "{{ 'langfuse-no-auth' if langfuse_sso | bool else 'langfuse-sso' }}"
    gateway_route_state: absent

- name: "langfuse | Sign in at the gateway"
  when: langfuse_gateway_publish | bool and langfuse_sso | bool
  ansible.builtin.include_role:
    name: gateway
    tasks_from: route_sso.yaml
  vars:
    gateway_route_name: langfuse
    gateway_route_namespace: "{{ langfuse_namespace }}"
    gateway_route_policy_name: langfuse-sso
    gateway_sso:
      issuer: "{{ keycloak_client_issuer }}"
      issuer_internal: "{{ keycloak_client_issuer_internal }}"
      client_id: "{{ langfuse_oidc_client_id }}"
      client_secret_name: langfuse-sso
      redirect_url: "https://{{ langfuse_hostname }}/oauth2/callback"
      allowed_groups: "{{ langfuse_allowed_groups }}"

- name: "langfuse | Exempt the route from gateway auth (Keycloak sign-in off)"
  when: langfuse_gateway_publish | bool and not (langfuse_sso | bool)
  ansible.builtin.include_role:
    name: gateway
    tasks_from: route_auth_exempt.yaml
  vars:
    gateway_route_name: langfuse
    gateway_route_namespace: "{{ langfuse_namespace }}"
    gateway_route_policy_name: langfuse-no-auth

- name: "langfuse | Public API gateway policy"
  when: langfuse_gateway_publish | bool
  ansible.builtin.include_role:
    name: gateway
    tasks_from: route_auth_exempt.yaml
  vars:
    gateway_route_name: langfuse-api
    gateway_route_namespace: "{{ langfuse_namespace }}"
    gateway_route_policy_name: langfuse-api-no-auth
    gateway_route_state: "{{ 'present' if langfuse_sso | bool else 'absent' }}"

# ── Wire LiteLLM → Langfuse callback ─────────────────────────────────────────

- name: "langfuse | Configure LiteLLM to send traces to Langfuse"
  when: (auth_type | default('jwt')) == 'litellm_vkey' or (litellm_enabled | default(false) | bool)
  block:
    - name: "langfuse | Get Langfuse public key from API"
      ansible.builtin.uri:
        url: "http://langfuse-web.{{ langfuse_namespace }}.svc.cluster.local:3000/api/auth/login"
        method: GET
        status_code: [200, 405]
        timeout: 10
      register: _langfuse_api_check
      failed_when: false

    - name: "langfuse | Inject Langfuse API keys into LiteLLM (no manual step needed)"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: langfuse-api-keys
            namespace: "{{ litellm_namespace | default('litellm') }}"
            labels:
              app.kubernetes.io/managed-by: ansible
          stringData:
            LANGFUSE_HOST: "http://langfuse-web.{{ langfuse_namespace }}.svc.cluster.local:3000"
            LANGFUSE_PUBLIC_KEY: "{{ _langfuse_public_key }}"
            LANGFUSE_SECRET_KEY: "{{ _langfuse_secret_key }}"
      failed_when: false

    - name: "langfuse | Wire LiteLLM tracing to Langfuse"
      ansible.builtin.include_tasks: litellm_wiring.yaml
      vars:
        _lf_wire: true

# ── Store credentials ─────────────────────────────────────────────────────────

- name: "langfuse | Store access info"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: langfuse-credentials
        namespace: "{{ langfuse_namespace }}"
        labels:
          app.kubernetes.io/managed-by: ansible
      data:
        hostname: "{{ langfuse_hostname }}"
        ui_url: "https://{{ langfuse_hostname }}"
        admin_email_hint: "kubectl get secret langfuse-secrets -n {{ langfuse_namespace }} -o jsonpath='{.data.admin_email}' | base64 -d"
        admin_password_hint: "kubectl get secret langfuse-secrets -n {{ langfuse_namespace }} -o jsonpath='{.data.admin_password}' | base64 -d"
        internal_url: "http://langfuse-web.{{ langfuse_namespace }}.svc.cluster.local:3000"

- name: "langfuse | Install complete"
  ansible.builtin.debug:
    msg:
      - "Langfuse deployed in namespace '{{ langfuse_namespace }}'"
      - "UI: https://{{ langfuse_hostname }}"
      - "Admin email: kubectl get secret langfuse-secrets -n {{ langfuse_namespace }} -o jsonpath='{.data.admin_email}' | base64 -d"
      - "Admin password: kubectl get secret langfuse-secrets -n {{ langfuse_namespace }} -o jsonpath='{.data.admin_password}' | base64 -d"
      - "LiteLLM integration: auto-configured (Langfuse API keys injected into LiteLLM)"
