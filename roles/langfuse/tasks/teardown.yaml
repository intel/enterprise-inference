---
# =============================================================================
# Langfuse — Teardown
# =============================================================================
# Removes only what this role installed (see langfuse_owned_objects).
# langfuse-db-secret and, normally, the langfuse namespace belong to the
# postgresql role and are left alone. The LiteLLM Deployment patch is not
# reverted.

- name: "langfuse | teardown | Remove owned objects"
  ansible.builtin.include_role:
    name: inference_ownership
    tasks_from: delete
  vars:
    ownership_name: langfuse
    ownership_items: "{{ langfuse_owned_objects }}"

- name: "langfuse | teardown | Remove Helm repo"
  kubernetes.core.helm_repository:
    name: "{{ langfuse_helm_repo_name }}"
    state: absent
  failed_when: false

- name: "langfuse | teardown | Complete"
  ansible.builtin.debug:
    msg: "Langfuse teardown done for namespace '{{ langfuse_namespace }}' (only objects this role installed)"
