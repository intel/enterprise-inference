---
# =============================================================================
# Langfuse — Teardown
# =============================================================================

- name: "langfuse | teardown | Remove Helm release"
  kubernetes.core.helm:
    name: langfuse
    release_namespace: "{{ langfuse_namespace }}"
    state: absent
    wait: true
  failed_when: false

- name: "langfuse | teardown | Remove HTTPRoute"
  kubernetes.core.k8s:
    state: absent
    api_version: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    name: langfuse
    namespace: "{{ langfuse_namespace }}"
  failed_when: false

- name: "langfuse | teardown | Remove SecurityPolicy"
  kubernetes.core.k8s:
    state: absent
    api_version: gateway.envoyproxy.io/v1alpha1
    kind: SecurityPolicy
    name: langfuse-no-auth
    namespace: "{{ langfuse_namespace }}"
  failed_when: false

# Unwire first, so LiteLLM neither traces to a removed Langfuse nor needs its keys.
- name: "langfuse | teardown | Turn LiteLLM tracing off"
  ansible.builtin.include_tasks: litellm_wiring.yaml
  vars:
    _lf_wire: false

- name: "langfuse | teardown | Remove Langfuse API keys from LiteLLM namespace"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: langfuse-api-keys
    namespace: "{{ litellm_namespace | default('litellm') }}"
  failed_when: false

- name: "langfuse | teardown | Remove ConfigMaps"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: ConfigMap
    name: "{{ item }}"
    namespace: "{{ langfuse_namespace }}"
  loop:
    - langfuse-credentials
  failed_when: false

- name: "langfuse | teardown | Remove Secrets"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: "{{ item }}"
    namespace: "{{ langfuse_namespace }}"
  loop:
    - langfuse-secrets
    - langfuse-db-secret
  failed_when: false

- name: "langfuse | teardown | Remove namespace"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ langfuse_namespace }}"
  failed_when: false

- name: "langfuse | teardown | Remove Helm repo"
  kubernetes.core.helm_repository:
    name: "{{ langfuse_helm_repo_name }}"
    state: absent
  failed_when: false

- name: "langfuse | teardown | Complete"
  ansible.builtin.debug:
    msg: "Langfuse removed from namespace '{{ langfuse_namespace }}'"
