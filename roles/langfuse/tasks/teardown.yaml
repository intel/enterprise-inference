---
# =============================================================================
# Langfuse — Teardown
# =============================================================================

- name: "langfuse | teardown | Remove Helm release"
  kubernetes.core.helm:
    name: langfuse
    release_namespace: "{{ langfuse_namespace }}"
    state: absent
    wait: true
  failed_when: false

- name: "langfuse | teardown | Remove HTTPRoute"
  kubernetes.core.k8s:
    state: absent
    api_version: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    name: langfuse
    namespace: "{{ langfuse_namespace }}"
  failed_when: false

- name: "langfuse | Remove the path-mode redirect"
  ansible.builtin.include_role:
    name: gateway
    tasks_from: path_redirect.yaml
  vars:
    gateway_redirect_name: langfuse-redirect
    gateway_redirect_namespace: "{{ langfuse_namespace }}"
    gateway_redirect_path: "{{ langfuse_path }}"
    gateway_redirect_url: "https://{{ langfuse_hostname }}/"
    gateway_redirect_state: absent

- name: "langfuse | Unpublish the langfuse host"
  ansible.builtin.include_role:
    name: gateway
    tasks_from: unpublish.yaml
  vars:
    gateway_publish_name: langfuse
    gateway_publish_namespace: "{{ langfuse_namespace }}"
    gateway_publish_host: "{{ langfuse_hostname }}"
    gateway_publish_mode: subdomain

- name: "langfuse | teardown | Drop the gateway auth exemption"
  ansible.builtin.include_role:
    name: gateway
    tasks_from: route_auth_exempt.yaml
  vars:
    gateway_route_name: langfuse
    gateway_route_namespace: "{{ langfuse_namespace }}"
    gateway_route_policy_name: langfuse-no-auth
    gateway_route_state: absent

# Unwire first, so LiteLLM neither traces to a removed Langfuse nor needs its keys.
- name: "langfuse | teardown | Turn LiteLLM tracing off"
  ansible.builtin.include_tasks: litellm_wiring.yaml
  vars:
    _lf_wire: false

- name: "langfuse | teardown | Remove Langfuse API keys from LiteLLM namespace"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: langfuse-api-keys
    namespace: "{{ litellm_namespace | default('litellm') }}"
  failed_when: false

- name: "langfuse | teardown | Remove ConfigMaps"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: ConfigMap
    name: "{{ item }}"
    namespace: "{{ langfuse_namespace }}"
  loop:
    - langfuse-credentials
  failed_when: false

- name: "langfuse | teardown | Remove Secrets"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: "{{ item }}"
    namespace: "{{ langfuse_namespace }}"
  loop:
    - langfuse-secrets
    - langfuse-db-secret
  failed_when: false

- name: "langfuse | teardown | Remove namespace"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ langfuse_namespace }}"
  failed_when: false

- name: "langfuse | teardown | Remove Helm repo"
  kubernetes.core.helm_repository:
    name: "{{ langfuse_helm_repo_name }}"
    state: absent
  failed_when: false

- name: "langfuse | teardown | Complete"
  ansible.builtin.debug:
    msg: "Langfuse removed from namespace '{{ langfuse_namespace }}'"
