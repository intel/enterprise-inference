---
- name: "langfuse | Dispatch action: {{ component_action | default('install') }}"
  ansible.builtin.include_tasks: "{{ component_action | default('install') }}.yaml"
  when: >-
    (component_action | default('install')) != 'install' or
    (((auth_provider | default('keycloak')) == 'litellm' or (litellm_enabled | default(false) | bool)) and (langfuse_enabled | default(true) | bool))
