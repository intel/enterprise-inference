---
# =============================================================================
# LiteLLM Role Defaults
# =============================================================================
# LiteLLM is an OpenAI-compatible proxy that adds virtual key management,
# spend tracking, rate limiting, and model routing on top of inference backends.
#
# When auth_provider=litellm:
#   - The gateway does TLS + routing only; LiteLLM is the sole auth boundary
#     and validates its own virtual keys (no gateway JWT, no extAuth)
#   - Keycloak is disabled (not deployed)
#   - Virtual keys are the auth mechanism (Bearer <litellm-virtual-key>)
#
# LiteLLM sits in front of KServe inference endpoints:
#   Client → Envoy Gateway (TLS+routing) → LiteLLM proxy (auth) → KServe
# =============================================================================

litellm_version: "v1.83.14-stable.patch.2"     # Docker image tag to deploy
litellm_namespace: "litellm"
litellm_valkey_tag: "8.0-alpine"                # valkey/valkey (official upstream image, Alpine for smaller footprint)

# Gateway integration
gateway_create: "{{ envoy_gateway_enabled | default(false) }}"
litellm_hostname: "litellm.{{ base_domain_name | default('inference-example.com') }}"

# Edge protection on the public LiteLLM route (litellm.<domain>).
# HSTS forces HTTPS so the UI login password / virtual key is never sent on :80.
litellm_hsts_enabled: true
litellm_hsts_max_age: 31536000                    # 1 year (seconds)
# Local per-client-IP rate limit (no Redis). Generous enough for legitimate
# inference, low enough to blunt automated brute-force; tune per deployment.
# Note: clients behind a shared NAT/egress IP share one counter.
litellm_rate_limit_enabled: true
litellm_rate_limit_requests: 600                  # requests per unit, per client IP
litellm_rate_limit_unit: "Minute"                 # Second | Minute | Hour | Day
litellm_rate_limit_client_header: "x-forwarded-for"

# PostgreSQL — stores virtual keys, spend logs, team/org data
litellm_db_name: "litellm"
litellm_db_user: "litellm"

# Master key — used by admin to create virtual keys
# Set via LITELLM_MASTER_KEY env var or auto-generated at install
litellm_master_key: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"

# Salt for hashing stored keys (keep stable across restarts)
litellm_salt_key: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"

# LiteLLM UI
litellm_ui_enabled: true

# Model routing — models are managed via LiteLLM UI/API (store_model_in_db: true)
# KServe gateway URL used when adding models via the UI. This is the in-cluster
# AI Gateway data plane (ai-gateway), NOT the envoy-gateway control-plane service.
litellm_kserve_gateway_url: "http://{{ ai_gateway_name | default('ai-gateway') }}.{{ gateway_namespace | default('envoy-gateway-system') }}.svc.cluster.local"
litellm_kserve_namespace: "llm-inference"

# Redis cache — reduces latency for repeated prompts
litellm_cache_enabled: true
litellm_cache_ttl: 600    # cache TTL in seconds (10 minutes)

# Valkey (cache) resource limits
litellm_redis_resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

# Single-node defaults (kubernetes_nodes | length <= 1)
litellm_single_node_replicas: 1
litellm_single_node_resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "4"
    memory: "4Gi"

# prisma query engine access under a hardened securityContext.
# The engines are baked into the image under /root, which the uid 1000 the proxy
# runs as cannot read, so they are seeded into this emptyDir by an initContainer
# instead. See roles/litellm/files/prisma-engine-seed.sh for the full rationale.
# The chart applies these to both the Deployment and the migration Job.
litellm_prisma_root_size: "256Mi"
litellm_prisma_root_volumes:
  - name: prisma-root
    emptyDir:
      sizeLimit: "{{ litellm_prisma_root_size }}"
litellm_prisma_root_volume_mounts:
  - name: prisma-root
    mountPath: /root

# Schema migration Job — the chart's 512Mi limit is far too small and the Job was
# cgroup-OOM-killed on every attempt until BackoffLimitExceeded (exit 137 reported
# as "Error", with no log output at all because python's stdout was still buffered
# when memory.oom.group killed the cgroup).
# `python litellm/proxy/prisma_migration.py` imports the full litellm package and
# shells out to the node prisma CLI; measured concurrent peak is ~2.1Gi
# (python 930Mi + prisma 733Mi + node 185Mi + prisma-client-py 237Mi), so 2Gi OOMs
# too. 4Gi matches the main container's ceiling, which runs the same migration
# successfully. Requests stay small — the Job is short-lived (~90s).
litellm_migration_job_resources:
  requests:
    cpu: "250m"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "4Gi"

# Multi-node defaults (kubernetes_nodes | length > 1)
litellm_multi_node_replicas: 2
litellm_multi_node_resources:
  requests:
    cpu: "2"
    memory: "2Gi"
  limits:
    cpu: "4"
    memory: "4Gi"

# --- Content-safety guardrail (litellm mode) ---
# A LiteLLM custom_code guardrail (Qwen3Guard) that
# screens every request pre-call against a small guard model (fail-closed).
# The `qwen3guard` catalog model is deployed by llm_services when this is on.
# Only meaningful in litellm mode — LiteLLM must be in the request path.
guardrails_enabled: "{{ (auth_provider | default('keycloak')) == 'litellm' }}"
guardrail_name: "content_safety"
# The gateway/vLLM served model name (catalog id), NOT the HF repo — the endpoint
# rejects the repo id (Qwen/Qwen3Guard-Gen-0.6B) with a 404.
guardrail_model: "qwen3guard"
guardrail_guard_namespace: "{{ llm_services_namespace | default('llm-inference') }}"
# Guard endpoint — the qwen3guard model reached directly via the in-cluster AI gateway
# DATA PLANE. The `ai-gateway` service lives in the gateway namespace
# (envoy-gateway-system), while the route prefix is the model's own namespace
# (/<model-ns>/<model>/v1, same path model_internal_url builds). Not via LiteLLM
# itself (would recurse the guardrail).
guard_service_url: "http://{{ ai_gateway_name | default('ai-gateway') }}.{{ gateway_namespace | default('envoy-gateway-system') }}.svc.cluster.local/{{ guardrail_guard_namespace }}/qwen3guard/v1/chat/completions"
guard_max_tokens: 32
guard_timeout: 60
guard_block_on_controversial: false
guardrail_litellm_namespace: "{{ litellm_namespace | default('litellm') }}"
guardrail_litellm_deployment: "litellm"
guardrail_litellm_container: "litellm"

# --- Hybrid Router (optional, litellm mode) ---
# A LiteLLM custom router (monkey-patches litellm.router
# to add an `auto_router/hybrid_router` prefix) that classifies prompt complexity
# and uses an online multi-armed bandit to pick the cheapest capable model per
# tier. The router package is mounted from a ConfigMap into the config dir (next
# to config.yaml) and wired via litellm_settings.callbacks. Off by default
# (opt-in); only meaningful in litellm mode. Compatible with the deployed LiteLLM
# version (uses Router.async_pre_routing_hook / PreRoutingHookResponse, v1.83.x).
hybrid_router_enabled: false
# LiteLLM resolves `callbacks` modules by file path relative to the config-file
# directory, so the router code is mounted here (where config.yaml lives).
hybrid_router_mount_dir: "/etc/litellm"
hybrid_router_model_name: "hybrid-router"          # client-facing virtual model name
# Default and tier targets follow the model a solution layer auto-deploys
# (llm_services_autodeploy_models, e.g. the agent toolkit's default); qwen3-4b otherwise.
hybrid_router_default_model: "{{ (llm_services_autodeploy_models | default([]) | first) | default('qwen3-4b', true) }}"
hybrid_router_bandit: "thompson"
hybrid_router_delta: 0.1
hybrid_router_epsilon: 0.1
hybrid_router_target_tpt: 1.0
hybrid_router_quality_weight: 0.0
# Candidate models per complexity tier — use your DEPLOYED served model names.
hybrid_router_tier_candidates:
  SIMPLE: ["{{ hybrid_router_default_model }}"]
  MEDIUM: ["{{ hybrid_router_default_model }}"]
  COMPLEX: ["{{ hybrid_router_default_model }}"]
  REASONING: ["{{ hybrid_router_default_model }}"]
hybrid_router_tier_boundaries:
  simple_medium: 0.15
  medium_complex: 0.35
  complex_reasoning: 0.60
# LiteLLM base routing strategy used when the hybrid router is enabled (the bandit
# runs pre-routing; this is the underlying deployment strategy).
hybrid_router_base_strategy: "usage-based-routing-v2"
