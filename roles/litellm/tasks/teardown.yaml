---
# =============================================================================
# LiteLLM — Teardown
# =============================================================================

- name: "litellm | teardown | Remove Helm release"
  kubernetes.core.helm:
    name: litellm
    release_namespace: "{{ litellm_namespace }}"
    state: absent
    wait: true
  failed_when: false

- name: "litellm | teardown | Remove gateway and mesh resources"
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ item.api }}"
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ litellm_namespace }}"
  loop:
    - { api: gateway.envoyproxy.io/v1alpha1, kind: SecurityPolicy, name: litellm-no-auth }
    - { api: gateway.envoyproxy.io/v1alpha1, kind: BackendTrafficPolicy, name: litellm-rate-limit }
    - { api: gateway.networking.k8s.io/v1, kind: HTTPRoute, name: litellm }
    - { api: security.istio.io/v1, kind: AuthorizationPolicy, name: litellm-ingress }
    - { api: security.istio.io/v1, kind: AuthorizationPolicy, name: litellm-redis }
  loop_control:
    label: "{{ item.kind }}/{{ item.name }}"
  failed_when: false

- name: "litellm | teardown | Remove ConfigMaps"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: ConfigMap
    name: "{{ item }}"
    namespace: "{{ litellm_namespace }}"
  loop:
    - litellm-credentials
  failed_when: false

- name: "litellm | teardown | Remove Secrets"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: "{{ item }}"
    namespace: "{{ litellm_namespace }}"
  loop:
    - litellm-master-key
    - litellm-db-secret
    - litellm-ui-auth
    - litellm-redis-auth
  failed_when: false

- name: "litellm | teardown | Remove namespace"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ litellm_namespace }}"
  failed_when: false

- name: "litellm | teardown | Complete"
  ansible.builtin.debug:
    msg: "LiteLLM removed from namespace '{{ litellm_namespace }}'"
