---
# =============================================================================
# LiteLLM — Teardown
# =============================================================================
# Removes only what this role installed (see litellm_owned_objects).
# litellm-db-secret belongs to the postgresql role and langfuse-api-keys to
# the langfuse role; neither is touched here.

- name: "litellm | teardown | Remove owned objects"
  ansible.builtin.include_role:
    name: inference_ownership
    tasks_from: delete
  vars:
    ownership_name: litellm
    ownership_items: "{{ litellm_owned_objects }}"

- name: "litellm | teardown | Complete"
  ansible.builtin.debug:
    msg: "LiteLLM teardown done for namespace '{{ litellm_namespace }}' (only objects this role installed)"
