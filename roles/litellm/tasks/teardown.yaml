---
# =============================================================================
# LiteLLM — Teardown
# =============================================================================

- name: "litellm | teardown | Remove Helm release"
  kubernetes.core.helm:
    name: litellm
    release_namespace: "{{ litellm_namespace }}"
    state: absent
    wait: true
  failed_when: false

- name: "litellm | teardown | Drop the gateway auth exemption and rate limit"
  ansible.builtin.include_role:
    name: gateway
    tasks_from: "{{ item.hook }}"
  loop:
    - {hook: route_auth_exempt.yaml, policy: litellm-no-auth}
    - {hook: route_rate_limit.yaml, policy: litellm-rate-limit}
  loop_control:
    label: "{{ item.policy }}"
  vars:
    gateway_route_name: litellm
    gateway_route_namespace: "{{ litellm_namespace }}"
    gateway_route_policy_name: "{{ item.policy }}"
    gateway_route_state: absent

- name: "litellm | teardown | Remove gateway and mesh resources"
  kubernetes.core.k8s:
    state: absent
    api_version: "{{ item.api }}"
    kind: "{{ item.kind }}"
    name: "{{ item.name }}"
    namespace: "{{ litellm_namespace }}"
  loop:
    - { api: gateway.networking.k8s.io/v1, kind: HTTPRoute, name: litellm }
    - { api: security.istio.io/v1, kind: AuthorizationPolicy, name: litellm-ingress }
    - { api: security.istio.io/v1, kind: AuthorizationPolicy, name: litellm-redis }
  loop_control:
    label: "{{ item.kind }}/{{ item.name }}"
  failed_when: false

- name: "litellm | teardown | Remove the admin UI host"
  ansible.builtin.include_tasks: ui_remove.yaml

- name: "litellm | Unpublish the litellm host"
  ansible.builtin.include_role:
    name: gateway
    tasks_from: unpublish.yaml
  vars:
    gateway_publish_name: litellm
    gateway_publish_namespace: "{{ litellm_namespace }}"
    gateway_publish_host: "{{ litellm_hostname }}"
    gateway_publish_path: "{{ litellm_path }}"

- name: "litellm | teardown | Remove ConfigMaps"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: ConfigMap
    name: "{{ item }}"
    namespace: "{{ litellm_namespace }}"
  loop:
    - litellm-credentials
    - litellm-router-code
  failed_when: false

- name: "litellm | teardown | Remove Secrets"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Secret
    name: "{{ item }}"
    namespace: "{{ litellm_namespace }}"
  loop:
    - litellm-master-key
    - litellm-db-secret
    - litellm-ui-auth
    - litellm-redis-auth
  failed_when: false

- name: "litellm | teardown | Remove namespace"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ litellm_namespace }}"
  failed_when: false

- name: "litellm | teardown | Complete"
  ansible.builtin.debug:
    msg: "LiteLLM removed from namespace '{{ litellm_namespace }}'"
