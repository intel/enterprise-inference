---
# Not on OpenShift yet: it reaches the models through the Envoy AI Gateway, which
# OpenShift does not get (models route through OpenShift AI's inference Gateway).
- name: "litellm | Not supported on OpenShift"
  ansible.builtin.fail:
    msg: >-
      LiteLLM (auth_type: litellm_vkey or litellm_enabled) is not supported on OpenShift yet: it needs the Envoy AI Gateway, which
      the installer does not deploy there. Use auth_type: jwt, or see docs/deploy/openshift.md (Known gaps).
  when:
    - cluster_distribution | default('kubernetes') == 'openshift'
    - component_action | default('install') == 'install'
    - (litellm_enabled | default(false) | bool) or (auth_type | default('jwt')) == 'litellm_vkey'

- name: "litellm | Dispatch action: {{ component_action | default('install') }}"
  ansible.builtin.include_tasks: "{{ component_action | default('install') }}.yaml"
  when: >-
    (component_action | default('install')) != 'install' or
    (litellm_enabled | default(false) | bool) or
    (auth_type | default('jwt')) == 'litellm_vkey'
