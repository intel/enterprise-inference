---
- name: "litellm | Detect platform"
  ansible.builtin.include_role:
    name: inference_platform

- name: "litellm | Dispatch action: {{ component_action | default('install') }}"
  ansible.builtin.include_tasks: "{{ component_action | default('install') }}.yaml"
  when: >-
    (component_action | default('install')) != 'install' or
    (litellm_enabled | default(false) | bool) or
    (auth_provider | default('keycloak')) == 'litellm'
