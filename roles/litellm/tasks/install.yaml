---
# =============================================================================
# LiteLLM — Install via Helm
# =============================================================================
# Single-node: 1 replica, no HPA.
# Multi-node:  2 replicas, HPA enabled (scales to 2x).
# =============================================================================

# The guard endpoint is the AI Gateway data plane, in the namespace the platform
# gateway exports (envoy_gateway_namespace).
- name: "litellm | Load the platform gateway"
  ansible.builtin.include_role:
    name: gateway
    tasks_from: platform.yaml
  when: guardrails_enabled | bool

# ── Idempotency check ─────────────────────────────────────────────────────────

- name: "litellm | Check for existing Helm release"
  kubernetes.core.helm_info:
    name: litellm
    release_namespace: "{{ litellm_namespace }}"
  register: _litellm_release
  failed_when: false

# The guardrail is fail-closed and LiteLLM refuses its guard call unless the guard
# host is in litellm_settings.user_url_allowed_hosts, so an existing release whose
# config lacks it is upgraded as well.
- name: "litellm | Read the running proxy configuration"
  kubernetes.core.k8s_info:
    kind: ConfigMap
    name: litellm-config
    namespace: "{{ litellm_namespace }}"
  register: _litellm_running_cfg
  when:
    - guardrails_enabled | bool
    - _litellm_release.status is defined and _litellm_release.status is not none

# LiteLLM sends the guard call to the guard host's resolved address. Behind a proxy
# that address matches neither the .svc/.cluster.local suffixes nor the CIDR entries
# of no_proxy (the HTTP client does not honour CIDRs), so the call would leave
# through the proxy; the guard Service's ClusterIP is added to the pod's no_proxy.
- name: "litellm | Look up the guard Service address"
  vars:
    _litellm_guard_host: "{{ (guard_service_url | urlsplit).hostname }}"
  kubernetes.core.k8s_info:
    kind: Service
    name: "{{ _litellm_guard_host.split('.')[0] }}"
    namespace: "{{ _litellm_guard_host.split('.')[1] }}"
  register: _litellm_guard_svc
  when:
    - guardrails_enabled | bool
    - http_proxy | default('') | length > 0 or https_proxy | default('') | length > 0
    - _litellm_guard_host.split('.') | length > 1
    - _litellm_guard_host is not match('^[0-9.]+$')

- name: "litellm | Set the guard addresses that bypass the proxy"
  vars:
    _litellm_guard_host: "{{ (guard_service_url | urlsplit).hostname }}"
  ansible.builtin.set_fact:
    _litellm_guard_no_proxy: >-
      {{ [_litellm_guard_host] if _litellm_guard_host is match('^[0-9.]+$') and guardrails_enabled | bool
         else ((_litellm_guard_svc.resources | default([]) | first | default({})).spec | default({})).clusterIPs | default([], true)
              | reject('equalto', 'None') | list }}

# In-pod install calls to 127.0.0.1:4000 skip the proxy only if no_proxy lists loopback.
- name: "litellm | Set the loopback addresses that bypass the proxy"
  ansible.builtin.set_fact:
    _litellm_loopback_no_proxy: ["127.0.0.1", "localhost"]

- name: "litellm | Warn when the guard Service address is unknown"
  ansible.builtin.debug:
    msg: >-
      Could not resolve the guard Service for {{ guard_service_url }}; behind a proxy the
      content-safety guardrail may not reach its guard model. Add its address to no_proxy.
  when:
    - _litellm_guard_svc is not skipped
    - _litellm_guard_no_proxy | length == 0

- name: "litellm | Read the running LiteLLM Deployment"
  kubernetes.core.k8s_info:
    kind: Deployment
    name: "{{ guardrail_litellm_deployment }}"
    namespace: "{{ litellm_namespace }}"
  register: _litellm_running_deploy
  when:
    - http_proxy | default('') | length > 0 or https_proxy | default('') | length > 0
    - _litellm_release.status is defined and _litellm_release.status is not none

- name: "litellm | Check the guard settings of the running release"
  vars:
    _litellm_running_allowed: >-
      {{ ((((_litellm_running_cfg.resources | default([]) | first | default({})).data | default({})).get('config.yaml', '{}')
         | from_yaml | default({}, true)).litellm_settings | default({})).user_url_allowed_hosts | default([], true) }}
    _litellm_running_no_proxy: >-
      {{ ((((_litellm_running_deploy.resources | default([]) | first | default({})).spec | default({})).template | default({})).spec | default({})).containers | default([])
         | selectattr('name', 'equalto', guardrail_litellm_container) | map(attribute='env') | flatten
         | selectattr('name', 'equalto', 'NO_PROXY') | map(attribute='value') | first | default('') }}
  ansible.builtin.set_fact:
    _litellm_needs_guard_settings: >-
      {{ (_litellm_running_cfg is not skipped
          and (_litellm_guard_hosts | difference(_litellm_running_allowed) | length > 0))
         or (_litellm_running_deploy is not skipped
          and ((_litellm_loopback_no_proxy + _litellm_guard_no_proxy)
               | difference(_litellm_running_no_proxy.split(',')) | length > 0)) }}

- name: "litellm | Already installed — skipping"
  ansible.builtin.debug:
    msg: >-
      LiteLLM already deployed in {{ litellm_namespace }} — skipping install
      (litellm_reconcile: true upgrades it with the current settings).
  when:
    - _litellm_release.status is defined and _litellm_release.status is not none
    - not litellm_reconcile | bool
    - not _litellm_needs_guard_settings | bool

- name: "litellm | Upgrading the release to apply the guard settings"
  ansible.builtin.debug:
    msg: >-
      LiteLLM in {{ litellm_namespace }} does not allowlist the guard host
      {{ _litellm_guard_hosts | join(', ') }} (litellm_settings.user_url_allowed_hosts) or does not
      keep {{ (_litellm_loopback_no_proxy + _litellm_guard_no_proxy) | join(', ') }} off the proxy (no_proxy),
      which the content-safety guardrail and the in-pod install checks need — upgrading the release
      with the current settings.
  when:
    - _litellm_needs_guard_settings | bool
    - not litellm_reconcile | bool

# ── Admin UI sign-in (Keycloak) ───────────────────────────────────────────────
# One client for both sign-ins: the gateway's (/oauth2/callback) and LiteLLM's.

- name: "litellm | Admin UI sign-in client"
  when: litellm_ui_sso | bool
  block:
    - name: "litellm | Namespace for the client secret"
      kubernetes.core.k8s:
        kind: Namespace
        name: "{{ litellm_namespace }}"
        state: present

    - name: "litellm | Keycloak client"
      ansible.builtin.include_role:
        name: keycloak
        tasks_from: oidc_client.yaml
      vars:
        keycloak_client:
          id: "{{ litellm_oidc_client_id }}"
          redirect_uris: ["{{ litellm_ui_url }}/sso/callback", "{{ litellm_ui_url }}/oauth2/callback"]
          post_logout_uris: ["{{ litellm_ui_url }}/ui/"]

    - name: "litellm | Keycloak client secret"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: litellm-sso
            namespace: "{{ litellm_namespace }}"
          type: Opaque
          stringData:
            client-secret: "{{ keycloak_client_secret }}"
      no_log: true

- name: "litellm | Install"
  when: >-
    _litellm_release.status is not defined or _litellm_release.status is none
    or litellm_reconcile | bool or _litellm_needs_guard_settings | bool
  block:

    # ── Detect cluster topology for sizing ───────────────────────────────────

    - name: "litellm | Detect cluster size"
      ansible.builtin.set_fact:
        _litellm_is_multinode: "{{ (kubernetes_nodes | default([]) | length) > 1 }}"

    - name: "litellm | Set sizing based on cluster topology"
      ansible.builtin.set_fact:
        _litellm_replicas: "{{ litellm_multi_node_replicas if _litellm_is_multinode | bool else litellm_single_node_replicas }}"
        _litellm_resources: "{{ litellm_multi_node_resources if _litellm_is_multinode | bool else litellm_single_node_resources }}"

    - name: "litellm | Topology summary"
      ansible.builtin.debug:
        msg: "LiteLLM sizing: {{ 'multi-node (' + (_litellm_replicas | string) + ' replicas, HPA enabled)' if _litellm_is_multinode | bool else 'single-node (1 replica)' }}"

    # ── Proxy env for the pod ─────────────────────────────────────────────────
    # Outbound calls (external model providers, the model cost map) go through
    # the corporate proxy. Both the Deployment and the migration Job render
    # .Values.envVars. no_proxy must keep .svc/.cluster.local + pod/service CIDRs
    # so DB traffic stays direct.

    - name: "litellm | Build proxy env"
      vars:
        _litellm_pod_no_proxy: >-
          {{ (_litellm_loopback_no_proxy + (no_proxy | default('', true)).split(',') + _litellm_guard_no_proxy)
             | select | unique | join(',') }}
      ansible.builtin.set_fact:
        _litellm_proxy_env: >-
          {{
            {
              'HTTP_PROXY': http_proxy | default(''),
              'HTTPS_PROXY': https_proxy | default(''),
              'http_proxy': http_proxy | default(''),
              'https_proxy': https_proxy | default(''),
              'NO_PROXY': _litellm_pod_no_proxy,
              'no_proxy': _litellm_pod_no_proxy
            }
            if (http_proxy | default('') | length > 0 or https_proxy | default('') | length > 0)
            else {}
          }}

    - name: "litellm | Proxy env summary"
      ansible.builtin.debug:
        msg: "LiteLLM pod proxy: {{ 'enabled — ' + (https_proxy | default(http_proxy | default(''))) if _litellm_proxy_env else 'not set (direct egress)' }}"

    # ── Namespace ─────────────────────────────────────────────────────────────

    - name: "litellm | Create namespace"
      kubernetes.core.k8s:
        kind: Namespace
        name: "{{ litellm_namespace }}"
        state: present

    - name: "litellm | Label namespace — PSS"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ litellm_namespace }}"
            labels:
              pod-security.kubernetes.io/enforce: "restricted"
              pod-security.kubernetes.io/audit: "restricted"
              pod-security.kubernetes.io/warn: "restricted"
      when: enforce_pss | default(false) | bool

    # ── PostgreSQL credentials ────────────────────────────────────────────────
    # The postgresql role creates the DB and copies credentials as
    # 'litellm-db-secret' into this namespace.

    # PostgreSQL ran first (depends_on), so the secret exists now or not at all.
    - name: "litellm | Read DB credentials secret"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: litellm-db-secret
        namespace: "{{ litellm_namespace }}"
      register: _litellm_db_secret

    - name: "litellm | DB credentials present"
      ansible.builtin.assert:
        that: _litellm_db_secret.resources | default([]) | length > 0
        fail_msg: >-
          litellm-db-secret not found in {{ litellm_namespace }}. PostgreSQL creates it when
          litellm is enabled: run install litellm without --only, or install postgresql first.
        quiet: true

    - name: "litellm | Wait for litellm database to be ready (CNPG Database CRD)"
      kubernetes.core.k8s_info:
        api_version: postgresql.cnpg.io/v1
        kind: Database
        name: litellm
        namespace: "{{ postgresql_namespace | default('postgresql') }}"
      register: _litellm_db_crd
      until: >-
        _litellm_db_crd.resources | default([]) | length > 0 and
        (_litellm_db_crd.resources[0].status.applied | default(false) | bool)
      retries: 60
      delay: 5

    - name: "litellm | Extract DB connection details"
      ansible.builtin.set_fact:
        _litellm_db_host: "{{ _litellm_db_secret.resources[0].data.host | b64decode }}"
        _litellm_db_port: "{{ _litellm_db_secret.resources[0].data.port | b64decode }}"
        _litellm_db_name: "{{ _litellm_db_secret.resources[0].data.database | b64decode }}"
        _litellm_db_user: "{{ _litellm_db_secret.resources[0].data.username | b64decode }}"
        _litellm_db_pass: "{{ _litellm_db_secret.resources[0].data.password | b64decode }}"
      no_log: true

    # ── Master key secret ─────────────────────────────────────────────────────

    - name: "litellm | Check for existing master key secret"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: litellm-master-key
        namespace: "{{ litellm_namespace }}"
      register: _litellm_master_key_existing
      failed_when: false

    - name: "litellm | Create master key secret"
      when: _litellm_master_key_existing.resources | default([]) | length == 0
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: litellm-master-key
            namespace: "{{ litellm_namespace }}"
          stringData:
            master_key: "sk-{{ litellm_master_key }}"
            salt_key: "{{ litellm_salt_key }}"
      no_log: true

    # ── UI and Valkey passwords (generated once, kept across re-installs) ─────

    - name: "litellm | Check for existing UI / Valkey password secrets"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ item }}"
        namespace: "{{ litellm_namespace }}"
      loop: [litellm-ui-auth, litellm-redis-auth]
      register: _litellm_pw_existing

    - name: "litellm | Create missing UI / Valkey password secrets"
      when: item.resources | length == 0
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ item.item }}"
            namespace: "{{ litellm_namespace }}"
          stringData:
            password: "{{ litellm_ui_password if item.item == 'litellm-ui-auth' else litellm_redis_password }}"
      loop: "{{ _litellm_pw_existing.results }}"
      loop_control:
        label: "{{ item.item }}"
      no_log: true

    # ── Hybrid router wiring ──────────────────────────────────────────────────
    # Creates the router-code ConfigMap and computes the volumes/mounts/model/
    # callbacks/router_settings the Helm values below consume (empty when off).
    - name: "litellm | Configure hybrid router wiring (before Helm)"
      ansible.builtin.include_tasks: hybrid_router_setup.yaml

    # ── Helm install ──────────────────────────────────────────────────────────
    # Chart is vendored at charts/litellm-helm (no internet required at install).
    # Valkey subchart deploys response cache when redis.enabled=true.
    # To upgrade: download new chart version, replace the directory, commit.

    - name: "litellm | Install via Helm"
      vars:
        _oidc: "{{ keycloak_client_issuer | default('') }}/protocol/openid-connect"
        _oidc_internal: "{{ keycloak_client_issuer_internal | default('') }}/protocol/openid-connect"
        # Browser goes to Keycloak's public URL; LiteLLM's own calls stay in-cluster.
        _litellm_sso_env:
          PROXY_BASE_URL: "{{ litellm_ui_url }}"
          # The UI login page goes straight to Keycloak (no LiteLLM login form).
          AUTO_REDIRECT_UI_LOGIN_TO_SSO: "true"
          GENERIC_CLIENT_ID: "{{ litellm_oidc_client_id }}"
          GENERIC_CLIENT_USE_PKCE: "true"
          GENERIC_AUTHORIZATION_ENDPOINT: "{{ _oidc }}/auth"
          GENERIC_TOKEN_ENDPOINT: "{{ _oidc_internal }}/token"
          GENERIC_USERINFO_ENDPOINT: "{{ _oidc_internal }}/userinfo"
          GENERIC_ROLE_MAPPINGS_GROUP_CLAIM: groups
          GENERIC_ROLE_MAPPINGS_ROLES: "{{ {'proxy_admin': [keycloak_client_admin_group | default('')]} | string }}"
          GENERIC_ROLE_MAPPINGS_DEFAULT_ROLE: proxy_admin_viewer
        _litellm_sso_secret_env:
          - {name: GENERIC_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: litellm-sso, key: client-secret}}}
        _litellm_extra_env:
          - name: LITELLM_SALT_KEY
            valueFrom:
              secretKeyRef:
                name: litellm-master-key
                key: salt_key
          - name: UI_PASSWORD
            valueFrom:
              secretKeyRef:
                name: litellm-ui-auth
                key: password
      kubernetes.core.helm:
        name: litellm
        chart_ref: "{{ role_path }}/../../charts/litellm-helm"
        release_namespace: "{{ litellm_namespace }}"
        create_namespace: true
        wait: false
        timeout: "10m0s"
        values:
          global:
            security:
              allowInsecureImages: true
          replicaCount: "{{ _litellm_replicas }}"
          image:
            repository: "{{ litellm_image_repository }}"
            tag: "{{ litellm_version }}"
          # DB — use our existing PostgreSQL via db-secret pattern
          db:
            useExisting: true
            deployStandalone: false
            endpoint: "{{ _litellm_db_host }}"
            database: "{{ _litellm_db_name }}"
            secret:
              name: litellm-db-secret
              usernameKey: username
              passwordKey: password
          masterkeySecretName: litellm-master-key
          masterkeySecretKey: master_key
          environmentSecrets:
            - litellm-master-key
          # Proxy vars merged in when the cluster is behind a corporate proxy.
          # PYTHONPATH = the config dir (hybrid router) so the router package next
          # to config.yaml is importable regardless of how litellm resolves it.
          envVars: >-
            {{ {'UI_USERNAME': 'admin'} | combine(_litellm_proxy_env)
               | combine({'PYTHONPATH': hybrid_router_mount_dir} if hybrid_router_enabled | bool else {})
               | combine(_litellm_sso_env if litellm_ui_sso | bool else {}) }}
          extraEnvVars: "{{ _litellm_extra_env + (_litellm_sso_secret_env if litellm_ui_sso | bool else []) }}"
          # Router-code ConfigMap mounts that rebuild the package tree next to
          # config.yaml (hybrid router only).
          volumes: "{{ _litellm_hybrid_volumes }}"
          volumeMounts: "{{ _litellm_hybrid_volume_mounts }}"
          podAnnotations: "{{ _litellm_hybrid_pod_annotations }}"
          # LiteLLM trips its Redis circuit breaker if it starts before the cache
          # answers, so wait for an authenticated PING.
          extraInitContainers: >-
            {{ [{'name': 'wait-for-cache',
                 'image': 'valkey/valkey:' ~ litellm_valkey_tag,
                 'command': ['sh', '-c',
                             'until [ "$(valkey-cli -h litellm-redis-primary -p 6379 ping)" = PONG ]; do sleep 2; done'],
                 'env': [{'name': 'REDISCLI_AUTH',
                          'valueFrom': {'secretKeyRef': {'name': 'litellm-redis-auth', 'key': 'password'}}}],
                 'securityContext': {'allowPrivilegeEscalation': false, 'readOnlyRootFilesystem': true,
                                     'capabilities': {'drop': ['ALL']}},
                 'resources': {'requests': {'cpu': '10m', 'memory': '16Mi'},
                               'limits': {'cpu': '100m', 'memory': '64Mi'}}}]
               if litellm_cache_enabled | default(true) | bool else [] }}
          # ── Schema migration Job ──────────────────────────────────────────
          # The chart's default 512Mi limit is far below what
          # `python litellm/proxy/prisma_migration.py` actually needs (~2.1Gi
          # peak across python + the node prisma CLI), so the Job was
          # cgroup-OOM-killed on every attempt until BackoffLimitExceeded.
          # See litellm_migration_job_resources.
          migrationJob:
            resources: "{{ litellm_migration_job_resources }}"
          # Chart-managed proxy config (replaces manual ConfigMap + template)
          proxyConfigMap:
            create: true
          proxy_config:
            general_settings:
              master_key: "os.environ/PROXY_MASTER_KEY"
              store_model_in_db: true
              ui_access_mode: "admin_only"
              # Keycloak is the only way into the UI.
              disable_password_login_when_sso_enabled: "{{ litellm_ui_sso | bool }}"
            litellm_settings:
              drop_params: true
              set_verbose: false
              cache: "{{ litellm_cache_enabled | default(true) | bool }}"
              cache_params:
                type: redis
                host: "litellm-redis-primary.{{ litellm_namespace }}.svc.cluster.local"
                port: 6379
                password: "os.environ/REDIS_PASSWORD"
                ttl: "{{ litellm_cache_ttl | default(600) }}"
              success_callback: "{{ ['langfuse'] if _litellm_langfuse | bool else [] }}"
              failure_callback: "{{ ['langfuse'] if _litellm_langfuse | bool else [] }}"
              # The content-safety guardrail calls its guard model inside the
              # cluster; only that host is let through LiteLLM's SSRF check
              # (empty while the guardrail is off).
              user_url_allowed_hosts: "{{ _litellm_guard_hosts }}"
              # Hybrid router callback (empty unless hybrid_router_enabled) — imports
              # custom_hybrid_router at startup and patches litellm.router.Router.
              callbacks: "{{ _litellm_hybrid_callbacks }}"
            # hybrid-router virtual model (empty list unless hybrid_router_enabled)
            model_list: "{{ _litellm_hybrid_model_list }}"
            router_settings: "{{ _litellm_hybrid_router_settings if _litellm_hybrid_router_settings else {'routing_strategy': 'least-busy'} }}"
          # Response cache. Keeps the Bitnami valkey subchart wiring (Service
          # name, wait logic) but runs the official upstream valkey/valkey image
          # instead of the deprecated bitnamilegacy/valkey. The Bitnami
          # entrypoint/probe scripts are bypassed: valkey-server starts directly
          # with cache-only flags and probes fall back to a TCP check. The cache
          # holds prompts and responses, so it requires a password; the chart
          # exposes it as VALKEY_PASSWORD here and REDIS_PASSWORD in LiteLLM.
          redis:
            enabled: "{{ litellm_cache_enabled | default(true) | bool }}"
            architecture: standalone
            image:
              repository: valkey/valkey
              tag: "{{ litellm_valkey_tag }}"
            auth:
              enabled: true
              existingSecret: litellm-redis-auth  # checkov:skip=CKV_SECRET_6: Secret name, not a value
              existingSecretPasswordKey: password
            networkPolicy:
              enabled: false
            primary:
              command: ["valkey-server"]
              args:
                - "--requirepass"
                - "$(VALKEY_PASSWORD)"
                - "--maxmemory-policy"
                - "allkeys-lru"
                - "--protected-mode"
                - "no"
                - "--save"
                - ""
              # Upstream image has no /health/*.sh scripts — use a TCP check.
              startupProbe: { enabled: false }
              livenessProbe: { enabled: false }
              readinessProbe: { enabled: false }
              customLivenessProbe:
                tcpSocket: { port: redis }
                initialDelaySeconds: 20
                periodSeconds: 15
              customReadinessProbe:
                tcpSocket: { port: redis }
                initialDelaySeconds: 5
                periodSeconds: 10
              resources: "{{ litellm_redis_resources }}"
              podSecurityContext:
                fsGroup: 1001
                runAsUser: 1001
                runAsNonRoot: true
              containerSecurityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          resources: "{{ _litellm_resources }}"
          # Run as the image's own user so it can read what it ships.
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: "{{ litellm_run_as_user | int }}"
            runAsGroup: "{{ litellm_run_as_user | int }}"
            fsGroup: "{{ litellm_run_as_user | int }}"
            seccompProfile:
              type: RuntimeDefault
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: "{{ litellm_run_as_user | int }}"
            capabilities:
              drop: ["ALL"]
          autoscaling:
            enabled: "{{ _litellm_is_multinode | bool }}"
            minReplicas: "{{ _litellm_replicas | int }}"
            maxReplicas: "{{ (_litellm_replicas | int) * 2 }}"
            targetCPUUtilizationPercentage: 80
          affinity: "{{ _platform_affinity | default({}) }}"
          service:
            type: ClusterIP
            port: 4000

    # ── Wait for readiness (with progress) ───────────────────────────────────

    - name: "litellm | Waiting for pods to be ready (image pull may take a few minutes)..."
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ litellm_namespace }}"
        label_selectors:
          - app.kubernetes.io/name=litellm
          - app.kubernetes.io/instance=litellm
      register: _litellm_pods
      until:
        - _litellm_pods.resources | default([]) | length > 0
        - _litellm_pods.resources | selectattr('status.phase', 'eq', 'Running') | list | length > 0
      retries: 120
      delay: 5

    - name: "litellm | Progress: {{ _litellm_pods.resources | default([]) | map(attribute='status.phase') | join(', ') | default('waiting...') }}"
      ansible.builtin.debug:
        msg: >-
          Pod status: {{ _litellm_pods.resources | default([])
            | map(attribute='status.containerStatuses', default=[])
            | flatten
            | map(attribute='state')
            | list }}

    - name: "litellm | Wait for deployment ready"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: litellm
        namespace: "{{ litellm_namespace }}"
      register: _litellm_deploy
      until:
        - _litellm_deploy.resources | default([]) | length > 0
        - _litellm_deploy.resources[0].status.conditions | default([]) | selectattr('type','eq','Available') | selectattr('status','eq','True') | list | length > 0
      retries: 60
      delay: 5

    # After the upgrade, so no pod still mounts it.
    - name: "litellm | Remove the hybrid router code when the router is off"
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: ConfigMap
        name: litellm-router-code
        namespace: "{{ litellm_namespace }}"
      when: not hybrid_router_enabled | bool

# Values apply on a fresh install only: an existing release keeps its sign-in.
- name: "litellm | Read the deployment"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: litellm
    namespace: "{{ litellm_namespace }}"
  register: _litellm_live

- name: "litellm | Sign-in settings are out of date"
  vars:
    _env: >-
      {{ (_litellm_live.resources | first).spec.template.spec.containers
         | map(attribute='env', default=[]) | flatten | map(attribute='name') | list }}
  ansible.builtin.debug:
    msg: >-
      LiteLLM runs with Keycloak UI sign-in {{ 'off' if litellm_ui_sso | bool else 'on' }}, but
      litellm_ui_sso is {{ litellm_ui_sso | bool }}. Reinstall it: teardown litellm, then install litellm.
  when:
    - _litellm_live.resources | length > 0
    - (litellm_ui_sso | bool) != ('GENERIC_CLIENT_ID' in _env)

# ── Gateway integration (runs even on re-runs to stay idempotent) ─────────────

# The gateway no longer delegates auth to LiteLLM (extAuth), so the grant
# older releases created for it is removed.
- name: "litellm | Remove the Envoy Gateway extAuth ReferenceGrant"
  kubernetes.core.k8s:
    state: absent
    api_version: gateway.networking.k8s.io/v1beta1
    kind: ReferenceGrant
    name: envoy-to-litellm
    namespace: "{{ litellm_namespace }}"
  failed_when: false

- name: "litellm | Publish the litellm host"
  ansible.builtin.include_role:
    name: gateway
    tasks_from: publish.yaml
  vars:
    gateway_publish_name: litellm
    gateway_publish_namespace: "{{ litellm_namespace }}"
    gateway_publish_host: "{{ litellm_hostname }}"
    gateway_publish_path: "{{ litellm_path }}"
  when: litellm_gateway_publish | bool

# API: only the exact inference paths reach LiteLLM, HTTPS listener only.
- name: "litellm | Create API HTTPRoute"
  when: litellm_gateway_publish | bool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: litellm
        namespace: "{{ litellm_namespace }}"
      spec:
        parentRefs:
          - "{{ gateway_publish.parent_ref }}"
        hostnames:
          - "{{ gateway_publish.host }}"
        # One host per service: exact paths. Path mode: one rule per path under
        # litellm_path, rewritten to the path LiteLLM serves; the shared host's
        # cookies are dropped (the API takes virtual keys).
        rules: >-
          {%- set out = [] -%}
          {%- set hdrs = {'type': 'ResponseHeaderModifier', 'responseHeaderModifier': {'set': litellm_route_headers}} -%}
          {%- set backend = [{'name': 'litellm', 'port': 4000}] -%}
          {%- set nocookie = {'type': 'RequestHeaderModifier', 'requestHeaderModifier': {'remove': ['Cookie']}} -%}
          {%- set tmo = {'request': litellm_route_timeout} -%}
          {%- if gateway_publish.mode == 'subdomain' -%}
          {%- set m = [] -%}
          {%- for p in litellm_public_paths -%}{%- set _ = m.append({'path': {'type': 'Exact', 'value': p}}) -%}{%- endfor -%}
          {%- set _ = out.append({'matches': m, 'filters': [hdrs], 'backendRefs': backend, 'timeouts': tmo}) -%}
          {%- else -%}
          {%- for p in litellm_public_paths -%}
          {%- set _ = out.append({'matches': [{'path': {'type': 'Exact', 'value': litellm_path ~ p}}],
                                  'filters': [hdrs, nocookie, {'type': 'URLRewrite', 'urlRewrite': {'path': {'type': 'ReplaceFullPath', 'replaceFullPath': p}}}],
                                  'backendRefs': backend, 'timeouts': tmo}) -%}
          {%- endfor -%}
          {%- endif -%}
          {{ out }}

# With auth_type=litellm_vkey programs authenticate with LiteLLM virtual keys,
# so the gateway's Keycloak JWT default is overridden on the API route only.
- name: "litellm | Exempt the route from gateway auth (LiteLLM checks virtual keys)"
  when: litellm_gateway_publish | bool
  ansible.builtin.include_role:
    name: gateway
    tasks_from: route_auth_exempt.yaml
  vars:
    gateway_route_name: litellm
    gateway_route_namespace: "{{ litellm_namespace }}"
    gateway_route_policy_name: litellm-no-auth
    gateway_route_state: "{{ 'present' if auth_type | default('jwt') == 'litellm_vkey' else 'absent' }}"

# ── Edge rate limit ───────────────────────────────────────────────────────────
# Per client IP, blunting key brute-force; removed again when turned off.
- name: "litellm | Edge rate limit"
  when: litellm_gateway_publish | bool
  ansible.builtin.include_role:
    name: gateway
    tasks_from: route_rate_limit.yaml
  vars:
    gateway_route_name: litellm
    gateway_route_namespace: "{{ litellm_namespace }}"
    gateway_route_policy_name: litellm-rate-limit
    gateway_route_state: "{{ 'present' if litellm_rate_limit_enabled | default(true) | bool else 'absent' }}"
    gateway_rate_limit_requests: "{{ litellm_rate_limit_requests }}"
    gateway_rate_limit_unit: "{{ litellm_rate_limit_unit | default('Minute') }}"
    gateway_rate_limit_client_header: "{{ litellm_rate_limit_client_header | default('x-forwarded-for') }}"

# ── Admin UI host (signed in at the gateway, then by LiteLLM) ─────────────────

- name: "litellm | Admin UI"
  when: litellm_gateway_publish | bool and litellm_ui_sso | bool
  block:
    - name: "litellm | Publish the admin UI host"
      ansible.builtin.include_role:
        name: gateway
        tasks_from: publish.yaml
      vars:
        gateway_publish_name: litellm-ui
        gateway_publish_namespace: "{{ litellm_namespace }}"
        gateway_publish_host: "{{ litellm_ui_hostname }}"
        gateway_publish_mode: subdomain   # the UI cannot run under a path
        gateway_publish_portal: {title: "LiteLLM", description: "Models, virtual keys and spend", path: /ui/}

    - name: "litellm | Admin UI HTTPRoute"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          metadata:
            name: litellm-ui
            namespace: "{{ litellm_namespace }}"
          spec:
            parentRefs: ["{{ gateway_publish.parent_ref }}"]
            hostnames: ["{{ litellm_ui_hostname }}"]
            rules:
              - matches: [{path: {type: PathPrefix, value: /}}]
                filters:
                  - type: ResponseHeaderModifier
                    # Nothing frames the admin UI.
                    responseHeaderModifier:
                      set: "{{ litellm_route_headers + [{'name': 'X-Frame-Options', 'value': 'DENY'}] }}"
                backendRefs: [{name: litellm, port: 4000}]

    - name: "litellm | Sign in at the gateway"
      ansible.builtin.include_role:
        name: gateway
        tasks_from: route_sso.yaml
      vars:
        gateway_route_name: litellm-ui
        gateway_route_namespace: "{{ litellm_namespace }}"
        gateway_route_policy_name: litellm-ui-sso
        gateway_sso:
          issuer: "{{ keycloak_client_issuer }}"
          issuer_internal: "{{ keycloak_client_issuer_internal }}"
          client_id: "{{ litellm_oidc_client_id }}"
          client_secret_name: litellm-sso
          redirect_url: "{{ litellm_ui_url }}/oauth2/callback"
          allowed_groups: "{{ litellm_ui_groups or [keycloak_client_admin_group] }}"

    # Path mode: <base>/litellm/ui points browsers at the UI's own host.
    - name: "litellm | Path-mode redirect to the admin UI"
      ansible.builtin.include_role:
        name: gateway
        tasks_from: path_redirect.yaml
      vars:
        gateway_redirect_name: litellm-ui-redirect
        gateway_redirect_namespace: "{{ litellm_namespace }}"
        gateway_redirect_path: "{{ litellm_path }}/ui"
        gateway_redirect_url: "{{ litellm_ui_url }}/ui/"

- name: "litellm | Admin UI off: remove its host"
  when: not (litellm_gateway_publish | bool and litellm_ui_sso | bool)
  ansible.builtin.include_tasks: ui_remove.yaml

# ── In-cluster lockdown (Istio ambient, L4) ───────────────────────────────────
# Mesh mTLS gives every caller an identity; only the allowed namespaces (and the
# source ranges in litellm_allowed_source_cidrs) may reach LiteLLM, and only
# LiteLLM may reach the cache.
- name: "litellm | Restrict in-cluster access (AuthorizationPolicy)"
  when: istio_enabled | default(false) | bool
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: security.istio.io/v1
      kind: AuthorizationPolicy
      metadata:
        name: "{{ item.name }}"
        namespace: "{{ litellm_namespace }}"
      spec:
        selector:
          matchLabels:
            app.kubernetes.io/name: "{{ item.app }}"
        action: ALLOW
        rules:
          - from:
              - source:
                  namespaces: "{{ item.from }}"
            to:
              - operation:
                  ports: ["{{ item.port }}"]
  loop:
    - { name: litellm-ingress, app: litellm, from: "{{ litellm_allowed_namespaces }}", port: "4000" }
    - { name: litellm-redis, app: redis, from: ["{{ litellm_namespace }}"], port: "6379" }   # valkey subchart, aliased redis
  loop_control:
    label: "{{ item.name }}"

# Callers outside the mesh carry no identity for the namespace rule above, so the
# listed source ranges get their own ALLOW policy on the API port (ALLOW policies
# add up); emptying litellm_allowed_source_cidrs removes it.
- name: "litellm | Allow source ranges outside the mesh (AuthorizationPolicy)"
  when: istio_enabled | default(false) | bool
  kubernetes.core.k8s:
    state: "{{ 'present' if litellm_allowed_source_cidrs | length > 0 else 'absent' }}"
    definition:
      apiVersion: security.istio.io/v1
      kind: AuthorizationPolicy
      metadata:
        name: litellm-ingress-cidrs
        namespace: "{{ litellm_namespace }}"
      spec:
        selector:
          matchLabels:
            app.kubernetes.io/name: litellm
        action: ALLOW
        rules:
          - from:
              - source:
                  ipBlocks: "{{ litellm_allowed_source_cidrs }}"
            to:
              - operation:
                  ports: ["4000"]

# ── Print credentials ─────────────────────────────────────────────────────────

- name: "litellm | Store credentials summary"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: litellm-credentials
        namespace: "{{ litellm_namespace }}"
        labels:
          app.kubernetes.io/managed-by: ansible
      data:
        hostname: "{{ litellm_hostname }}"
        api_url: "{{ litellm_url }}/v1"
        ui_url: "{{ (litellm_ui_url ~ '/ui/') if litellm_ui_sso | bool else '' }}"
        note: >-
          {{ 'Admin UI: Keycloak sign-in only.' if litellm_ui_sso | bool else 'The admin UI is not published.' }}
          Master key (break-glass, API only) is in secret litellm-master-key (key: master_key).

- name: "litellm | Install complete"
  ansible.builtin.debug:
    msg:
      - "LiteLLM deployed in namespace '{{ litellm_namespace }}'"
      - "API: {{ litellm_url }}/v1 (Bearer <virtual key>; paths: {{ litellm_public_paths | join(', ') }})"
      - >-
        {{ ('Admin UI: ' ~ litellm_ui_url ~ '/ui/ (Keycloak sign-in; groups '
            ~ (litellm_ui_groups or [keycloak_client_admin_group | default('')]) | join(', ')
            ~ '; LiteLLM free tier: at most 5 SSO users).') if litellm_ui_sso | bool else 'Admin UI: not published.' }}
        Break-glass: the master key over kubectl -n {{ litellm_namespace }} port-forward svc/litellm 4000
        (Secret litellm-master-key).

- name: "litellm | Register the content-safety guardrail"
  ansible.builtin.include_tasks: register_guardrail.yaml
  when: guardrails_enabled | bool
