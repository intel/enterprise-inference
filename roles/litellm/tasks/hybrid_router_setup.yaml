---
# =============================================================================
# Hybrid Router — wiring for the Helm values (empty while it is off)
# =============================================================================
# Creates the router-code ConfigMap and computes the volumes, mounts, virtual
# model, callback and router_settings install.yaml hands to the chart. The
# ConfigMap is removed after the Helm upgrade once the router is off, so no pod
# is left mounting a missing ConfigMap.

- name: "litellm | hybrid | Default wiring to empty (disabled)"
  ansible.builtin.set_fact:
    _litellm_hybrid_volumes: []
    _litellm_hybrid_volume_mounts: []
    _litellm_hybrid_model_list: []
    _litellm_hybrid_callbacks: []
    _litellm_hybrid_router_settings: {}
    _litellm_hybrid_pod_annotations: {}

- name: "litellm | hybrid | Configure hybrid router"
  when: hybrid_router_enabled | bool
  block:
    - name: "litellm | hybrid | Read router code (flat dotted keys)"
      ansible.builtin.set_fact:
        _litellm_hybrid_code:
          custom_hybrid_router.py: "{{ lookup('file', role_path + '/files/router/custom_hybrid_router.py') }}"
          router_strategy.__init__.py: "{{ lookup('file', role_path + '/files/router/router_strategy/__init__.py') }}"
          efficiency_router.__init__.py: "{{ lookup('file', role_path + '/files/router/router_strategy/efficiency_router/__init__.py') }}"
          efficiency_router.bandit.py: "{{ lookup('file', role_path + '/files/router/router_strategy/efficiency_router/bandit.py') }}"
          efficiency_router.efficiency_router.py: "{{ lookup('file', role_path + '/files/router/router_strategy/efficiency_router/efficiency_router.py') }}"
          hybrid_router.__init__.py: "{{ lookup('file', role_path + '/files/router/router_strategy/hybrid_router/__init__.py') }}"
          hybrid_router.hybrid_router.py: "{{ lookup('file', role_path + '/files/router/router_strategy/hybrid_router/hybrid_router.py') }}"

    - name: "litellm | hybrid | Create router-code ConfigMap"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: litellm-router-code
            namespace: "{{ litellm_namespace }}"
            labels:
              app.kubernetes.io/managed-by: ansible
              app.kubernetes.io/part-of: litellm-hybrid-router
          data: "{{ _litellm_hybrid_code }}"

    # subPath mounts rebuild the package tree in the LiteLLM CONFIG DIR
    # ({{ hybrid_router_mount_dir }}). LiteLLM's get_instance_fn resolves a
    # `callbacks` module by FILE PATH relative to the config file's directory
    # (config.yaml lives there), not CWD/PYTHONPATH — so the module must sit
    # alongside config.yaml. custom_hybrid_router.py then self-inserts its own
    # dir on sys.path to import the router_strategy package next to it.
    - name: "litellm | hybrid | Build helm wiring facts"
      ansible.builtin.set_fact:
        _litellm_hybrid_volumes:
          - name: router-code
            configMap:
              name: litellm-router-code
        _litellm_hybrid_volume_mounts:
          - { name: router-code, mountPath: "{{ hybrid_router_mount_dir }}/custom_hybrid_router.py", subPath: custom_hybrid_router.py }
          - { name: router-code, mountPath: "{{ hybrid_router_mount_dir }}/router_strategy/__init__.py", subPath: router_strategy.__init__.py }
          - { name: router-code, mountPath: "{{ hybrid_router_mount_dir }}/router_strategy/efficiency_router/__init__.py", subPath: efficiency_router.__init__.py }
          - { name: router-code, mountPath: "{{ hybrid_router_mount_dir }}/router_strategy/efficiency_router/bandit.py", subPath: efficiency_router.bandit.py }
          - { name: router-code, mountPath: "{{ hybrid_router_mount_dir }}/router_strategy/efficiency_router/efficiency_router.py", subPath: efficiency_router.efficiency_router.py }
          - { name: router-code, mountPath: "{{ hybrid_router_mount_dir }}/router_strategy/hybrid_router/__init__.py", subPath: hybrid_router.__init__.py }
          - { name: router-code, mountPath: "{{ hybrid_router_mount_dir }}/router_strategy/hybrid_router/hybrid_router.py", subPath: hybrid_router.hybrid_router.py }
        # subPath mounts never see ConfigMap updates, so a code change rolls the pods.
        _litellm_hybrid_pod_annotations:
          litellm.enterprise-ai/router-code: "{{ (_litellm_hybrid_code | to_json | hash('sha256'))[:16] }}"
        _litellm_hybrid_callbacks:
          - "custom_hybrid_router.proxy_handler_instance"
        _litellm_hybrid_model_list:
          - model_name: "{{ hybrid_router_model_name }}"
            litellm_params:
              model: "auto_router/hybrid_router"
              hybrid_router_config:
                bandit: "{{ hybrid_router_bandit }}"
                delta: "{{ hybrid_router_delta }}"
                epsilon: "{{ hybrid_router_epsilon }}"
                target_tpt: "{{ hybrid_router_target_tpt }}"
                quality_weight: "{{ hybrid_router_quality_weight }}"
                tier_candidates: "{{ hybrid_router_tier_candidates }}"
                complexity_router_config:
                  tier_boundaries: "{{ hybrid_router_tier_boundaries }}"
              hybrid_router_default_model: "{{ hybrid_router_default_model }}"
        # Shared routing state in the LiteLLM cache (Valkey) when it is deployed.
        _litellm_hybrid_router_settings: >-
          {{ {'routing_strategy': hybrid_router_base_strategy}
             | combine({'redis_host': 'litellm-redis-primary.' ~ litellm_namespace ~ '.svc.cluster.local',
                        'redis_port': 6379}
                       if litellm_cache_enabled | default(true) | bool else {}) }}

    - name: "litellm | hybrid | Wiring summary"
      ansible.builtin.debug:
        msg: "Hybrid router ENABLED — virtual model '{{ hybrid_router_model_name }}', default {{ hybrid_router_default_model }}, tiers {{ hybrid_router_tier_candidates.keys() | list }}"
