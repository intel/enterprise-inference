---
# =============================================================================
# Content-safety guardrail registration
# =============================================================================
# Renders the Qwen3Guard custom_code (screens the last user message against the
# guardrail_model guard model, fail-closed) and registers it with LiteLLM's runtime
# /guardrails API by exec-ing `python -` inside the LiteLLM pod (so it reads the
# pod's own master key). Idempotent: PUT if the guardrail already exists.
# =============================================================================

# LiteLLM refuses the guard call unless its host is allowlisted, and the guardrail
# is fail-closed: on a proxy without the allowlist it would block every request.
# install.yaml upgrades a release that lacks it; this is the post-condition.
- name: "litellm | guardrail | Read the proxy configuration"
  kubernetes.core.k8s_info:
    kind: ConfigMap
    name: litellm-config
    namespace: "{{ guardrail_litellm_namespace }}"
  register: _litellm_gr_cfg

- name: "litellm | guardrail | Guard host is allowlisted"
  vars:
    _litellm_gr_config: >-
      {{ ((_litellm_gr_cfg.resources | default([]) | first | default({})).data | default({})).get('config.yaml', '{}')
         | from_yaml | default({}, true) }}
    _litellm_gr_allowed: "{{ (_litellm_gr_config.litellm_settings | default({})).user_url_allowed_hosts | default([], true) }}"
  ansible.builtin.assert:
    that: _litellm_guard_hosts | difference(_litellm_gr_allowed) | length == 0
    fail_msg: >-
      The LiteLLM config in {{ guardrail_litellm_namespace }} (ConfigMap litellm-config) does not
      allowlist the guard host {{ _litellm_guard_hosts | join(', ') }}
      (litellm_settings.user_url_allowed_hosts), so the fail-closed guardrail would block every
      request. The install upgrades the release in {{ litellm_namespace }} to add it: check that the
      upgrade succeeded and that guardrail_litellm_namespace names that release, or set
      guardrails_enabled: false.
    quiet: true

- name: "litellm | guardrail | Wait for LiteLLM deployment to be ready"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ guardrail_litellm_deployment }}"
    namespace: "{{ guardrail_litellm_namespace }}"
  register: _litellm_gr_deploy
  until: >-
    _litellm_gr_deploy.resources | length > 0 and
    _litellm_gr_deploy.resources[0].status.readyReplicas is defined and
    _litellm_gr_deploy.resources[0].status.readyReplicas == _litellm_gr_deploy.resources[0].spec.replicas
  retries: 60
  delay: 5

- name: "litellm | guardrail | Render Qwen3Guard custom_code"
  ansible.builtin.set_fact:
    _litellm_gr_code: "{{ lookup('template', 'qwen3guard_gen.py.j2') }}"

- name: "litellm | guardrail | Build registration payload"
  ansible.builtin.set_fact:
    _litellm_gr_name: "{{ guardrail_name }}"
    _litellm_gr_url: "http://127.0.0.1:4000"
    _litellm_gr_payload:
      guardrail:
        guardrail_name: "{{ guardrail_name }}"
        litellm_params:
          guardrail: custom_code
          mode: pre_call
          default_on: true
          custom_code: "{{ _litellm_gr_code }}"
        guardrail_info:
          description: "Qwen3Guard content-safety screening (pre_call, fail-closed)"

# kubernetes.core.k8s_exec takes no stdin, so the script is piped in through kubectl.
- name: "litellm | guardrail | Register with LiteLLM (/guardrails API, in-pod)"
  ansible.builtin.command:
    cmd: >-
      kubectl exec -i -n {{ guardrail_litellm_namespace }}
      deploy/{{ guardrail_litellm_deployment }} -c {{ guardrail_litellm_container }} -- python -
    stdin: "{{ lookup('template', 'register-guardrail.py.j2') }}"
  vars:
    _litellm_gr_payload_b64: "{{ _litellm_gr_payload | to_json | b64encode }}"
  environment:
    KUBECONFIG: "{{ kubernetes_kubeconfig | default(ansible_env.HOME + '/.kube/config') }}"
  register: _litellm_gr_reg
  retries: 12
  delay: 5
  until: _litellm_gr_reg.rc == 0
  changed_when: "'registered' in (_litellm_gr_reg.stdout | default('')) or 'updated' in (_litellm_gr_reg.stdout | default(''))"
  failed_when: _litellm_gr_reg.rc != 0

- name: "litellm | guardrail | Registration result"
  ansible.builtin.debug:
    msg:
      - "Guardrail '{{ guardrail_name }}' registered with LiteLLM (mode=pre_call, default_on=true)"
      - "Guard model: {{ guardrail_model }} @ {{ guard_service_url }}"
      - "{{ _litellm_gr_reg.stdout_lines | default([]) }}"
