---
# =============================================================================
# LLM Services — inference namespace, ServingRuntimes, CRD readiness
# =============================================================================
# Unified role for both InferenceService and LLMInferenceService workloads.
# Creates the target namespace and deploys optional ServingRuntimes for the
# traditional InferenceService path.  LLMInferenceService workloads use
# LLMInferenceServiceConfig templates from the kserve-runtime-configs chart.
# =============================================================================

# =============================================================================
# CPU Policy — controls how model pods get pinned to CPUs.
# =============================================================================
# This is the single switch. All dependent behaviour (NRI install, kubelet
# flags, model-manager annotations, CPU request doubling) is auto-derived.
#
#   nri-balloons    (default) NRI balloons resource policy — NUMA-aware pinning
#   kubelet-static  kubelet static CPU manager (Guaranteed QoS pinning)
#   best-effort     no pinning, standard scheduler
kubernetes_cpu_policy: "nri-balloons"

# NRI Balloons tuning (only when kubernetes_cpu_policy=nri-balloons):
nri_reserved_cpu_list: ""                # Linux cpuset for system CPUs — set 1 per NUMA for multi-NUMA (e.g. "0,32")
nri_deployment_profile: "standard"       # minimal(8) | standard(12) | observability(16) | full(20)

# kubelet-static tuning (only when kubernetes_cpu_policy=kubelet-static).
# SMT width (hyperthreads per physical core), used to satisfy kubelet's
# full-pcpus-only option: a Guaranteed pod's cpu request must be a multiple of
# this, else kubelet rejects the pod with SMTAlignmentError. Empty ⇒
# model-manager auto-detects (2 when full-pcpus-only is on, else 1). Set to 1
# on an SMT/hyperthreading-disabled cluster to avoid rounding cpu up to even.
mm_kubelet_threads_per_core: ""

llm_services_namespace: "llm-inference"

# =============================================================================
# Model storage PVC
# =============================================================================
llm_services_model_store_pvc: "model-store"
llm_services_model_store_size: "100Gi"

# Set storage_backend in env/<env>/global_config.yaml, not this. The core storage
# role publishes _resolved_storage_backend in preflight, already trimmed and
# lowercased; the fallback keeps this role working without core's preflight.
_llm_storage_backend: >-
  {{ _resolved_storage_backend | default(storage_backend | default('local-path'))
     | string | trim | lower }}

# model-store is one PVC mounted by every predictor pod, so it needs
# ReadWriteMany as soon as pods can land on more than one node. Only local-path
# cannot provide it (node-local directories); nfs, CephFS and ontap-nas all can.
llm_services_model_store_access_mode: >-
  {{ 'ReadWriteOnce' if _llm_storage_backend == 'local-path' else 'ReadWriteMany' }}

# StorageClass for model-store. Named only for the backends whose *default*
# StorageClass is not the right one for a shared model cache (ceph defaults to
# ceph-block, which is RWO). Empty means "omit storageClassName" so the PVC binds
# to the cluster default, which core asserts is exactly one - that is the
# netapp-trident path. Never fall back to 'local-path': it only exists when the
# backend IS local-path, so that fallback pointed model-store at a StorageClass
# that does not exist and the PVC stayed Pending forever.
llm_services_model_store_storage_class: >-
  {{ 'local-path' if _llm_storage_backend == 'local-path'
     else 'nfs-client' if _llm_storage_backend == 'nfs'
     else 'ceph-fs' if _llm_storage_backend == 'ceph'
     else '' }}

# Tolerates null, which `| length` would crash on.
_llm_sc_requested: >-
  {{ llm_services_model_store_storage_class | default('', true) | string | trim }}

# Deploy files/runtimes/*.yaml as namespace-scoped ServingRuntimes.
# Needed for InferenceService CRs; LLMInferenceService CRs ignore these.
llm_services_deploy_runtimes: true

# Deploy default models after infrastructure is ready
# Set to false to skip model deployment during installation
# Override via: ./es_auto_installer.sh install inference --skip-models
llm_services_deploy_models: true

# Catalog models to deploy on install regardless of llm_services_deploy_models /
# `autodeploy:` — set by a solution layer that needs a default model (the agent
# toolkit sets its default). Empty here, so inference-only installs deploy none.
llm_services_autodeploy_models: []

# Extra flags appended to each `model-manager deploy <name> --wait` invocation.
# Examples:
#   model_deploy_flags: "--wait-timeout 1800"   # allow longer for large models
#   model_deploy_flags: "--dry-run"             # render manifests without applying
model_deploy_flags: ""

# Auto-deploy failure policy. Default (false): a model that fails to auto-deploy
# (e.g. gated model without HF_TOKEN, transient download error) is reported but
# does NOT abort the install — the serving infrastructure is already up and
# models can be deployed manually afterward. Set true to make any auto-deploy
# failure fatal to the install.
model_deploy_strict: false

# In-cluster AI Gateway data plane LiteLLM calls the models through
# (MM_LITELLM_KSERVE_URL): the ai-gateway Service beside the Envoy Gateway
# controller (envoy_gateway_namespace, exported by the platform gateway), or in
# the agentgateway gateway namespace (ai_gateway_namespace, the model namespace
# by default).
_llm_ai_gateway_url: >-
  http://{{ ai_gateway_service_name | default('ai-gateway') }}.{{
  (envoy_gateway_namespace | default('envoy-gateway-system'))
  if (ai_gateway_provider | default('envoy')) == 'envoy'
  else (ai_gateway_namespace | default(kserve_llmisvc_namespace | default('llm-inference'))) }}.svc.cluster.local

# =============================================================================
# Deploy from Headlamp (Models page)
# =============================================================================
# The Models page runs `model-manager deploy|undeploy` as a Job in this
# namespace. An admission policy admits only pods built from the published
# template (pinned image, fixed command, catalogue name), so creating a Job
# there cannot run anything else with model-manager's rights.
llm_services_ui_deploy: "{{ headlamp_enabled | default(false) | bool }}"
llm_services_mm_namespace: "model-manager"
# Stock image with kubectl, Python and PyYAML; model-manager is mounted from a
# ConfigMap. Pinned by digest; keep the tag on the cluster's Kubernetes minor.
llm_services_mm_image: "docker.io/alpine/k8s:1.36.5@sha256:094adf64cdc4827377cdbe7ea5747472ce115f9fbc64a4e35970ec66777f9a00"
# Who may start deploy Jobs (Kubernetes groups, after the OIDC prefix).
llm_services_mm_deployer_groups: ["{{ headlamp_oidc_prefix | default('oidc:') }}{{ keycloak_platform_admin_group | default('platform-admins') }}"]
# Finished Jobs (and their logs) are kept this long for the Models page.
llm_services_mm_job_ttl: 86400
llm_services_mm_job_timeout: 3600     # seconds; weights download + model load

# =============================================================================
# Inference engine observability
# =============================================================================
# Each engine listed here gets a ServiceMonitor (Prometheus scraping) and a
# Grafana dashboard auto-deployed from files/servicemonitors/ and files/dashboards/.
#
# To add a new engine (e.g. triton):
#   1. Add files/servicemonitors/triton.yaml
#   2. Add files/dashboards/triton.json
#   3. Add 'triton' to this list
#
# To disable without removing files, remove the name from the list.
# =============================================================================
# Engine name is derived from kubernetes_accelerator so the right dashboard
# (cpu = no GPU panels, gpu = full dashboard with KV cache gauges) deploys
# automatically. Override here if you need a different combination.
llm_services_engines:
  - "vllm-{{ kubernetes_accelerator | default('cpu') }}"

# Skip ServiceMonitor + dashboard deployment if observability stack is absent.
llm_services_observability_enabled: "{{ observability_enabled | default(true) | bool }}"
# Enable ambient mode label on namespace if Istio is enabled in the cluster
istio_enabled: false
