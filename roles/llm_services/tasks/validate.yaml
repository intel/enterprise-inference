---
# =============================================================================
# LLM Services — validate namespace, runtimes, and workloads
# =============================================================================

- name: "llm_services | Check namespace"
  ansible.builtin.command:
    cmd: "kubectl get namespace {{ llm_services_namespace }}"
  changed_when: false

- name: "llm_services | List ServingRuntimes"
  ansible.builtin.command:
    cmd: "kubectl get servingruntime -n {{ llm_services_namespace }} --no-headers"
  changed_when: false
  register: _llm_runtimes
  failed_when: false

- name: "llm_services | Report runtimes"
  ansible.builtin.debug:
    msg: "{{ _llm_runtimes.stdout_lines | default(['No ServingRuntimes deployed.']) }}"

- name: "llm_services | List InferenceServices"
  ansible.builtin.command:
    cmd: "kubectl get inferenceservice -n {{ llm_services_namespace }} --no-headers"
  changed_when: false
  register: _llm_isvcs
  failed_when: false

- name: "llm_services | Report InferenceServices"
  ansible.builtin.debug:
    msg: "{{ _llm_isvcs.stdout_lines | default(['No InferenceServices deployed.']) }}"

- name: "llm_services | List LLMInferenceServices"
  ansible.builtin.command:
    cmd: "kubectl get llminferenceservice -n {{ llm_services_namespace }} --no-headers"
  changed_when: false
  register: _llm_llmisvcs
  failed_when: false

- name: "llm_services | Report LLMInferenceServices"
  ansible.builtin.debug:
    msg: "{{ _llm_llmisvcs.stdout_lines | default(['No LLMInferenceServices deployed.']) }}"

# ── CPU policy consistency ───────────────────────────────────────────────────
# The configured kubernetes_cpu_policy must match what the cluster actually
# runs, otherwise models are annotated for a mechanism that is not there and
# silently lose their CPU pinning. Check both mechanisms and report mismatches.

- name: "llm_services | Check NRI balloons DaemonSet"
  ansible.builtin.command:
    cmd: kubectl get daemonset nri-resource-policy-balloons -n kube-system -o name
  changed_when: false
  failed_when: false
  register: _llm_nri_ds

- name: "llm_services | Read kubelet cpuManagerPolicy from a node"
  ansible.builtin.shell: |
    set -o pipefail
    node=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
    kubectl get --raw "/api/v1/nodes/${node}/proxy/configz" \
      | grep -o '"cpuManagerPolicy":"[^"]*"' | head -1 | cut -d'"' -f4
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false
  register: _llm_kubelet_cpu_policy

- name: "llm_services | Report CPU policy state"
  ansible.builtin.debug:
    msg:
      - "Configured kubernetes_cpu_policy: {{ kubernetes_cpu_policy | default('nri-balloons') }}"
      - "NRI balloons DaemonSet: {{ 'present' if _llm_nri_ds.rc == 0 else 'absent' }}"
      - "kubelet cpuManagerPolicy: {{ _llm_kubelet_cpu_policy.stdout | default('') | trim | default('unknown (needs RBAC on nodes/proxy)', true) }}"

- name: "llm_services | Warn when the CPU policy does not match the cluster"
  ansible.builtin.debug:
    msg: >-
      WARNING: kubernetes_cpu_policy={{ kubernetes_cpu_policy | default('nri-balloons') }}
      but
      {%- if (kubernetes_cpu_policy | default('nri-balloons')) == 'nri-balloons' %}
      the nri-resource-policy-balloons DaemonSet is not present in kube-system.
      Models will be annotated for NRI but get no CPU pinning. Run the
      nri_cpu_balloons role (./es_auto_installer.sh install nri_cpu_balloons).
      {%- else %}
      kubelet reports cpuManagerPolicy='{{ _llm_kubelet_cpu_policy.stdout | default('') | trim }}',
      not 'static'. Guaranteed pods will NOT get exclusive CPUs. Re-run
      ./es_auto_installer.sh install kubernetes with
      kubernetes_cpu_policy=kubelet-static to reconfigure kubelet.
      {%- endif %}
  when: >-
    ((kubernetes_cpu_policy | default('nri-balloons')) == 'nri-balloons' and _llm_nri_ds.rc != 0)
    or ((kubernetes_cpu_policy | default('nri-balloons')) == 'kubelet-static'
        and (_llm_kubelet_cpu_policy.stdout | default('') | trim) not in ['static', ''])

# Deploy from Headlamp: the template is admitted, a tampered copy is not.
- name: "llm_services | Headlamp deploy Jobs are locked to the template"
  when: llm_services_ui_deploy | bool
  block:
    - name: "llm_services | Read the Job template"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        name: model-manager-job
        namespace: "{{ llm_services_mm_namespace }}"
      register: _llm_mm_val

    - name: "llm_services | Admission of the template and a tampered copy (server dry run)"
      vars:
        _job: "{{ (_llm_mm_val.resources | first).data['job.json'] | from_json }}"
        _model: "{{ ((lookup('ansible.builtin.file', __llm_mm_catalog) | from_yaml).models | first).name }}"
        _pod: >-
          {{ {'apiVersion': 'v1', 'kind': 'Pod',
              'metadata': {'generateName': 'validate-', 'namespace': llm_services_mm_namespace},
              'spec': _job.spec.template.spec | combine({'containers': [_job.spec.template.spec.containers[0]
                        | combine({'args': ['deploy', _model, '--wait']} if item.ok else {'args': ['deploy', _model], 'command': ['/bin/sh']})]})} }}
      ansible.builtin.command:
        argv: [kubectl, create, --dry-run=server, -o, name, -f, "-"]
        stdin: "{{ _pod | to_json }}"
      environment:
        KUBECONFIG: "{{ kubernetes_kubeconfig | default(ansible_env.HOME + '/.kube/config') }}"
      loop: [{name: template, ok: true}, {name: tampered, ok: false}]
      loop_control:
        label: "{{ item.name }}"
      register: _llm_mm_admit
      changed_when: false
      failed_when: (_llm_mm_admit.rc == 0) != item.ok

- name: "llm_services | Validation passed"
  ansible.builtin.debug:
    msg: >-
      LLM services validation passed.
      CPU policy: {{ kubernetes_cpu_policy | default('nri-balloons') }}.
      InferenceServices: {{ _llm_isvcs.stdout_lines | default([]) | length }},
      LLMInferenceServices: {{ _llm_llmisvcs.stdout_lines | default([]) | length }}.
