---
# =============================================================================
# LLM Services — namespace + CRD readiness + optional ServingRuntimes
# =============================================================================

- name: "llm_services | Create namespace"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ llm_services_namespace }}"

- name: "llm_services | Label namespace — Istio"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ llm_services_namespace }}"
        labels:
          istio.io/dataplane-mode: "ambient"
  when: istio_enabled | default(false) | bool

- name: "llm_services | Label namespace — PSS"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ llm_services_namespace }}"
        labels:
          pod-security.kubernetes.io/enforce: "restricted"
          pod-security.kubernetes.io/audit: "restricted"
          pod-security.kubernetes.io/warn: "restricted"
  when: enforce_pss | default(false) | bool

# -- Model storage PVC --

# An existing PVC keeps its size unless its StorageClass can expand it: requests never shrink,
# and growing one that cannot expand is rejected by the API server.
- name: "llm_services | Read the model-store PVC"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: PersistentVolumeClaim
    name: "{{ llm_services_model_store_pvc }}"
    namespace: "{{ llm_services_namespace }}"
  register: _llm_store_pvc

- name: "llm_services | Read the model-store StorageClass"
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: "{{ _llm_store_pvc.resources[0].spec.storageClassName }}"
  register: _llm_store_sc
  when:
    - _llm_store_pvc.resources | length > 0
    - _llm_store_pvc.resources[0].spec.storageClassName | default('', true) | length > 0

- name: "llm_services | Model-store size is a Kubernetes quantity"
  ansible.builtin.assert:
    that: llm_services_model_store_size | string | trim is match(_llm_qty_re)
    fail_msg: >-
      llm_services_model_store_size '{{ llm_services_model_store_size }}' is not a storage size;
      use e.g. 200Gi or 500G.
    quiet: true

- name: "llm_services | Model-store size"
  vars:
    _units: {"": 1, "k": 1000, "M": 1000000, "G": 1000000000, "T": 1000000000000, "P": 1000000000000000,
             "E": 1000000000000000000, "Ki": 1024, "Mi": 1048576, "Gi": 1073741824, "Ti": 1099511627776,
             "Pi": 1125899906842624, "Ei": 1152921504606846976}
    _want: "{{ llm_services_model_store_size | string | trim }}"
    _cur: "{{ ((_llm_store_pvc.resources | first | default({})).spec | default({})).resources.requests.storage | default('') }}"
    _want_b: "{{ (_want | regex_replace(_llm_qty_re, '\\1') | float) * _units[_want | regex_replace(_llm_qty_re, '\\2')] }}"
    _cur_b: >-
      {{ (_cur | regex_replace(_llm_qty_re, '\1') | float) * _units[_cur | regex_replace(_llm_qty_re, '\2')]
         if _cur is match(_llm_qty_re) else 0 }}
    _expandable: "{{ (_llm_store_sc.resources | default([]) | first | default({})).allowVolumeExpansion | default(false) | bool }}"
  ansible.builtin.set_fact:
    _llm_store_size: "{{ _want if not _cur or (_want_b | float > _cur_b | float and _expandable | bool) else _cur }}"
    _llm_store_kept: "{{ _cur | length > 0 and _want_b | float > _cur_b | float and not _expandable | bool }}"

- name: "llm_services | Model-store size kept"
  ansible.builtin.debug:
    msg: >-
      model-store stays at {{ _llm_store_size }}: its StorageClass cannot expand volumes, so
      llm_services_model_store_size {{ llm_services_model_store_size }} applies to a new PVC only.
  when: _llm_store_kept | bool

- name: "llm_services | Create model-store PVC"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "{{ llm_services_model_store_pvc }}"
        namespace: "{{ llm_services_namespace }}"
        labels:
          app.kubernetes.io/name: "{{ llm_services_model_store_pvc }}"
          app.kubernetes.io/managed-by: ansible
      spec: "{{ _llm_model_store_spec }}"
  vars:
    _llm_model_store_spec_base:
      accessModes:
        - "{{ llm_services_model_store_access_mode }}"
      resources:
        requests:
          storage: "{{ _llm_store_size }}"
    # An empty storage class must render as *no* storageClassName key, so the PVC
    # binds to the cluster default StorageClass. storageClassName: "" means the
    # opposite - dynamic provisioning disabled - and the PVC stays Pending.
    # _llm_sc_requested is the null/whitespace-tolerant form of
    # llm_services_model_store_storage_class (defaults/main.yaml).
    _llm_model_store_spec: >-
      {{ _llm_model_store_spec_base
         | combine({'storageClassName': _llm_sc_requested})
         if _llm_sc_requested | length > 0
         else _llm_model_store_spec_base }}

# -- CRD readiness gates (fail fast if KServe isn't installed) --

- name: "llm_services | Verify InferenceService CRD"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: inferenceservices.serving.kserve.io
  register: _llm_isvc_crd
  failed_when: _llm_isvc_crd.resources | length == 0

- name: "llm_services | Check LLMInferenceService CRD"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: llminferenceservices.serving.kserve.io
  register: _llm_llmisvc_crd
  failed_when: false

- name: "llm_services | LLMInferenceService CRD status"
  ansible.builtin.debug:
    msg: >-
      LLMInferenceService CRD: {{ 'available' if _llm_llmisvc_crd.resources | length > 0 else 'not found (LLMIsvc workloads unavailable)' }}

# -- ServingRuntimes (used by InferenceService CRs) --

- name: "llm_services | Find serving runtimes"
  ansible.builtin.find:
    paths: "{{ role_path }}/files/runtimes"
    patterns: "*.yaml"
  register: _llm_runtime_files
  when: llm_services_deploy_runtimes | bool

- name: "llm_services | Deploy serving runtimes"
  kubernetes.core.k8s:
    src: "{{ item.path }}"
    namespace: "{{ llm_services_namespace }}"
    state: present
  loop: "{{ _llm_runtime_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: llm_services_deploy_runtimes | bool and (_llm_runtime_files.files | default([]) | length > 0)

# ── Observability (ServiceMonitors + Grafana dashboards per engine) ───────────

- name: "llm_services | Wire up engine observability"
  ansible.builtin.include_tasks: observability.yaml
  when: llm_services_observability_enabled | bool

- name: "llm_services | Install complete"
  ansible.builtin.debug:
    msg: >-
      Namespace '{{ llm_services_namespace }}' ready.
      ServingRuntimes: {{ (_llm_runtime_files.files | default([]) | length) if llm_services_deploy_runtimes | bool else 'skipped' }}.
      InferenceService: supported.
      LLMInferenceService: {{ 'supported' if _llm_llmisvc_crd.resources | length > 0 else 'unavailable' }}.
      Observability engines: {{ llm_services_engines | join(', ') if llm_services_observability_enabled | bool else 'skipped' }}.

# -- Optional: Deploy default models --

- name: "llm_services | Set inference extension directory"
  set_fact:
    inference_extension_dir: "{{ playbook_dir }}/../ext/enterprise.ai-inference"

# Read by the Headlamp Models page. Allow-listed fields only, as JSON. access.json
# is the public API every model is served on (picked by "model" in the body) and
# its credential type, from the same values model-manager prints after a deploy.
- name: "llm_services | Publish the model catalogue"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: model-catalog
        namespace: "{{ llm_services_namespace }}"
      data:
        models.json: >-
          {%- set out = [] -%}
          {%- set cat = lookup('ansible.builtin.file', _llm_catalog_file) | from_yaml -%}
          {%- for m in cat.models | default([]) -%}
          {%- set entry = m | dict2items | selectattr('key', 'in', _llm_catalog_fields) | items2dict -%}
          {#- A GPU runtime (device: gpu in its values.yaml) exports what Headlamp needs to offer the model only
              where the cluster advertises the resource: device, gpus (model, else the runtime's category default)
              and accelerator_resource. -#}
          {%- if m.servers | default({}) | length > 0 -%}
          {%- set rt = m.default_server | default(m.servers | list | sort | first, true) -%}
          {%- else -%}
          {%- set rt = m.runtime | default((cat.defaults | default({})).runtime | default('vllm', true), true) -%}
          {%- endif -%}
          {%- set overlay = (cat.runtimes | default({}))[rt] | default({}, true) -%}
          {%- set vals = (lookup('ansible.builtin.file', inference_extension_dir ~ '/model_manager/runtimes/' ~ rt ~ '/values.yaml', errors='ignore') | default('', true) | from_yaml | default({}, true)) | combine(overlay, recursive=True) -%}
          {%- if (vals.device | default('')) == 'gpu' -%}
          {%- set defaults = ((vals.categories | default({}))[m.category | default('llm')] | default({})).defaults | default({}) -%}
          {%- set _ = entry.update({'device': 'gpu', 'accelerator_resource': vals.accelerator_resource | default(''),
                                    'gpus': (m.gpus | default(defaults.gpus | default(1))) | string}) -%}
          {%- endif -%}
          {%- set _ = out.append(entry) -%}
          {%- endfor -%}
          {{ out | to_json }}
        access.json: >-
          {{ {'base_url': 'https://' ~ (__llm_mm_env.MM_INFERENCE_HOSTNAME | trim)
                          ~ (__llm_mm_env.MM_INFERENCE_PATH | trim | regex_replace('/+$', '')) ~ '/v1',
              'auth_type': 'litellm_vkey' if __llm_mm_litellm | bool else 'jwt'} | to_json }}
  vars:
    _llm_catalog_file: >-
      {{ (env_dir ~ '/models.yaml') if (env_dir is defined and (env_dir ~ '/models.yaml') is exists)
         else (inference_extension_dir ~ '/model_manager/models.yaml') }}
    _llm_catalog_fields: [name, model_id, category, servers, default_server, runtime, cpu, memory]

# The content-safety guardrail (litellm role) is registered default-on and
# fail-closed, so its guard model must be served whenever the guardrail is on —
# otherwise every LiteLLM request is blocked. A failed guard deploy is fatal for
# the same reason, whatever model_deploy_strict says. Same default as the litellm
# role's guardrails_enabled. It deploys first: it is small, fixed-size and
# required, and models with `cpu: auto` then size themselves around it.
- name: "llm_services | Deploy guard model for the content-safety guardrail"
  ansible.builtin.include_tasks: deploy_models.yaml
  vars:
    _mm_only_models: ["{{ guardrail_model | default('qwen3guard') }}"]
    _mm_strict: true
  when: guardrails_enabled | default((auth_type | default('jwt')) == 'litellm_vkey') | bool

- name: "llm_services | Deploy from Headlamp (model-manager Jobs)"
  ansible.builtin.include_tasks: ui_deploy.yaml
  when: llm_services_ui_deploy | bool

- name: "llm_services | Deploy default models"
  include_tasks: deploy_models.yaml
  when: llm_services_deploy_models | default(true) | bool

# Default model(s) requested by a solution layer (llm_services_autodeploy_models).
# Required like the guard model: the solution is not usable without it.
- name: "llm_services | Deploy solution-requested default models"
  ansible.builtin.include_tasks: deploy_models.yaml
  vars:
    _mm_only_models: "{{ llm_services_autodeploy_models }}"
    _mm_strict: true
  when: llm_services_autodeploy_models | default([]) | length > 0
