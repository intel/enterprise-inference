---
# Resolve MM_ACCEL_RESOURCE, model-manager's GPU deploy gate: the extended
# resource the cluster advertises. Used by the install-time deploys
# (deploy_models.yaml) and by the Headlamp deploy Jobs (ui_deploy.yaml), through
# __llm_mm_env. Set ONLY when the solutions layer is in rack-scale mode, from the
# vendor the rack-profile parser wrote to the flags file. Otherwise it stays
# empty, device: gpu runtimes are refused, and the CPU path is unaffected.

- name: "llm_services | Resolve GPU vendor from rack-scale flags"
  ansible.builtin.shell: |
    set -o pipefail
    grep '^rack_scale_gpu_vendor=' "{{ env_dir }}/inventory/metadata/rack-scale-flags.env" 2>/dev/null | cut -d= -f2
  args:
    executable: /bin/bash
  register: _mm_gpu_vendor_raw
  changed_when: false
  failed_when: false
  when:
    - rack_scale_enabled | default(false) | bool
    - env_dir is defined

- name: "llm_services | Map GPU vendor to accelerator resource"
  ansible.builtin.set_fact:
    _mm_accel_resource: >-
      {%- set v = (_mm_gpu_vendor_raw.stdout | default('') | trim)
                  if (rack_scale_enabled | default(false) | bool) else '' -%}
      {{ {'nvidia': 'nvidia.com/gpu', 'intel': 'gpu.intel.com/xe', 'amd': 'amd.com/gpu'}[v]
         if v in ['nvidia', 'intel', 'amd'] else '' }}
