---
# =============================================================================
# LLM Services — teardown inference workloads + namespace
# =============================================================================
# Removes only objects in llm_services_owned_objects that carry the ownership
# label: models and routes model-manager deployed, this role's runtime,
# dashboards and ServiceMonitor, the model-store PVC and the namespace.
# PersistentVolumes are not deleted directly: removing the PVC lets the
# StorageClass reclaim policy decide, so a Retain volume keeps its data.

- name: "llm_services | Remove owned objects"
  ansible.builtin.include_role:
    name: inference_ownership
    tasks_from: delete
  vars:
    ownership_name: llm_services
    ownership_items: "{{ llm_services_owned_objects }}"
