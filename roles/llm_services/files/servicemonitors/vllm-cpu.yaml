apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm-cpu
  labels:
    app.kubernetes.io/component: inference
    inference-engine: vllm-cpu
spec:
  # Match all namespaces — KServe deploys inference services in llm-inference
  namespaceSelector:
    any: true
  # Match workload services created by LLMInferenceService
  selector:
    matchLabels:
      app.kubernetes.io/part-of: llminferenceservice
      app.kubernetes.io/component: llminferenceservice-workload
  # KServe 0.21 names the workload port http, 0.18 https (plain HTTP on both);
  # a port the Service lacks yields no target.
  endpoints:
    - &vllm_endpoint
      port: http
      path: /metrics
      interval: 30s
      scheme: http
      relabelings:
        # Expose model name and namespace as Prometheus labels on every metric
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
          targetLabel: model
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - replacement: vllm
          targetLabel: engine
        # OVMS also serves as an LLMInferenceService; tell it apart by its image.
        - sourceLabels: [__meta_kubernetes_pod_container_image]
          regex: .*/model_server:.*
          replacement: ovms
          targetLabel: engine
    - <<: *vllm_endpoint
      port: https
