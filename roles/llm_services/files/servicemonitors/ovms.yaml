# A PodMonitor: KServe updates labels on the predictor pods but not on an existing
# Service, so pods are the only place inference-engine is reliable.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ovms
  labels:
    app.kubernetes.io/component: inference
    inference-engine: ovms
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      inference-engine: ovms
      component: predictor
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 30s
      scheme: http
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          targetLabel: model
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - replacement: ovms
          targetLabel: engine
