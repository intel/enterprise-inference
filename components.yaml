# =============================================================================
# Ext Component Registry — enterprise.ai-inference
# =============================================================================
# Auto-discovered and merged into the core registry at preflight
# (playbooks/includes/preflight.yaml). Rendered via lookup('template'), so the
# Jinja in `enabled:` resolves before component resolution.
#
# All inference-layer components (except nri_cpu_balloons, which lives in the
# solutions repo as it configures kubelet-level settings) are registered here.
# =============================================================================

components:
  - name: nfd
    layer: inference
    enabled: "{{ nfd_enabled | default(true) | bool }}"
    depends_on: []

  - name: keycloak_config
    layer: inference
    # Both auth modes: people sign in through Keycloak; the gateway trusts its JWTs.
    enabled: "{{ keycloak_enabled | default(true) | bool }}"
    depends_on: []

  # The AI gateways are skipped on OpenShift: models are routed through the
  # OpenShift AI inference Gateway (openshift-ingress/openshift-ai-inference).
  - name: envoy_ai_gateway
    layer: inference
    enabled: "{{ kserve_enabled | default(true) | bool and (ai_gateway_provider | default('envoy')) == 'envoy' and not (cluster_distribution | default('kubernetes') == 'openshift') }}"
    depends_on: []

  - name: agentgateway
    layer: inference
    enabled: "{{ (ai_gateway_provider | default('envoy')) == 'agentgateway' and not (cluster_distribution | default('kubernetes') == 'openshift') }}"
    depends_on: []

  - name: kserve
    layer: inference
    enabled: "{{ kserve_enabled | default(true) | bool }}"
    depends_on: [envoy_ai_gateway, agentgateway]

  - name: litellm
    layer: inference
    # Required in litellm auth mode; an optional add-on with Keycloak auth.
    enabled: "{{ (auth_type | default('jwt')) == 'litellm_vkey' or (litellm_enabled | default(false) | bool) }}"
    # PostgreSQL creates its database only while it is enabled.
    depends_on: [postgresql]

  - name: langfuse
    layer: inference
    # Optional tracing for LiteLLM: on with LiteLLM unless langfuse_enabled: false.
    enabled: "{{ ((auth_type | default('jwt')) == 'litellm_vkey' or (litellm_enabled | default(false) | bool)) and (langfuse_enabled | default(true) | bool) }}"
    depends_on: [litellm, postgresql]

  - name: llm_services
    layer: inference
    enabled: "{{ kserve_enabled | default(true) | bool }}"
    depends_on: [kserve]
